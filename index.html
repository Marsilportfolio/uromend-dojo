s dramatique"],"a":1,"exp":"Pas de douleur = pas d'urgence naturelle, plus de résistance au prix. Il faut la fabriquer honnêtement."},{"id":"q25","lesson":"l11","module":3,"q":"Pourquoi « parler leur langue » rend-il même un créateur UGC moyen crédible ?","choices":["Parce que le script sonne comme la personne, donc authentique","Parce que c'est plus court","Parce que Meta le favorise"],"a":0,"exp":"Voix accordée = confiance. Un script en jargon IA sonne faux même bien joué."},{"id":"q26","lesson":"l12","module":3,"q":"Que faire de « I was skeptical at first » ?","choices":["Le garder, c'est rassurant","Le remplacer en montrant le scepticisme : « I rolled my eyes when my sister sent me this »","Le mettre en gras"],"a":1,"exp":"Montre, ne nomme pas. Les vrais sceptiques n'annoncent pas leur scepticisme."},{"id":"q27","lesson":"l12","module":3,"q":"Où peut-on utiliser « clinically proven » et « industry leading » ?","choices":["Partout","Nulle part","Sur une page produit ou dans la bouche d'une autorité, jamais dans un témoignage ou un UGC"],"a":2,"exp":"Une vraie personne ne parle pas comme un communiqué de presse."},{"id":"q28","lesson":"l12","module":3,"q":"Le test décisif du module « words that kill » :","choices":["Le texte fait-il plus de 500 mots ?","Pourrait-on remplacer le nom du produit par un concurrent sans que ça change ?","Y a-t-il des emojis ?"],"a":1,"exp":"Si oui, c'est générique. Le bon copy ne peut être que sur CE produit, pour CET avatar, dans SA voix."},{"id":"q29","lesson":"l13","module":3,"q":"Pourquoi « 87 % en 14 jours » est-il plus crédible que « ça marche vite » ?","choices":["Parce que 87 est un beau chiffre","Parce que le cerveau utilise la précision comme raccourci vers la vérité (« pourquoi 87 et pas 90 ? »)","Parce que les études le disent"],"a":1,"exp":"Les menteurs arrondissent. Le spécifique signale le vrai. Mais ne jamais inventer : si tu n'as pas la donnée, va la chercher."},{"id":"q30","lesson":"l13","module":3,"q":"Laquelle est une sur-spécification ?","choices":["« 7 342 clientes à ce jour »","« 23,7 % d'amélioration en 14,3 jours »","« Jour 14 : tu descends l'escalier sans tenir la rampe »"],"a":1,"exp":"Trop de décimales sonne forcé. Arrondis à ce qui a du sens : 23 %, 14 jours."},{"id":"q31","lesson":"l13","module":3,"q":"La forme de spécificité la plus convaincante selon le cours :","choices":["Une citation de médecin","Une timeline semaine par semaine","Un logo « vet approved »"],"a":1,"exp":"« Semaine 1… semaine 2… semaine 4 : le moment dans le miroir. » Le lecteur se projette étape par étape."},{"id":"q32","lesson":"l14","module":3,"q":"Combien de boucles ouvertes actives au maximum ?","choices":["1","4","10"],"a":1,"exp":"Au-delà de 4, le lecteur perd le fil. Et chaque boucle doit être refermée, sinon c'est une trahison."},{"id":"q33","lesson":"l14","module":3,"q":"Laquelle est une boucle forte ?","choices":["« I'll explain why this works »","« What she found in her husband's search history changed everything, but it wasn't what you think »","« This is important »"],"a":1,"exp":"Précise, inattendue, chargée émotionnellement. Les deux autres sont de vagues promesses."},{"id":"q34","lesson":"l14","module":3,"q":"Le « story interrupt », c'est :","choices":["Arrêter de raconter des histoires","Commencer une histoire, la couper au moment le plus intense, et donner le contexte avant de la reprendre","Interrompre la pub par un jingle"],"a":1,"exp":"Comme Breaking Bad qui ouvre sur la scène du camping-car. Le cerveau veut la suite."},{"id":"q35","lesson":"l15","module":3,"q":"« But here's what nobody tells you » est :","choices":["Une bucket brigade (phrase-pont)","Un CTA","Un claim"],"a":0,"exp":"Elle porte le lecteur vers la phrase suivante. À placer aux transitions et quand l'énergie baisse, pas à chaque phrase."},{"id":"q36","lesson":"l15","module":3,"q":"Fréquence conseillée des bucket brigades :","choices":["Chaque phrase","Tous les 3 à 5 paragraphes, aux transitions","Une seule au début"],"a":1,"exp":"Trop = tic agaçant. Elles servent après le hook, entre idées, avant un point clé, après un passage dense, avant le CTA."},{"id":"q37","lesson":"l16","module":3,"q":"Pourquoi le langage sensoriel contourne-t-il le scepticisme ?","choices":["Parce qu'il est plus poétique","Parce qu'on ne peut pas discuter une expérience ressentie, seulement une affirmation","Parce qu'il est plus court"],"a":1,"exp":"« That sharp stabbing pain when you first stand up » active la zone de la douleur. « Our product reduces pain » est un claim discutable."},{"id":"q38","lesson":"l16","module":3,"q":"Le sens le plus souvent oublié dans le copy :","choices":["La vue","Le son","Le toucher"],"a":1,"exp":"« No more crunching, your knees are silent on the stairs », « the alarm, not the hot flash, wakes you »."},{"id":"q39","lesson":"l17","module":3,"q":"Pourquoi le future pacing fait-il acheter ?","choices":["Parce qu'il explique le produit","Parce que le cerveau vit la scène imaginée (même dopamine) et ne pas acheter revient à perdre ce qu'on a déjà ressenti","Parce qu'il est court"],"a":1,"exp":"Mental simulation : le futur imaginé est traité comme un souvenir. D'où le placement juste avant le CTA."},{"id":"q40","lesson":"l17","module":3,"q":"Lequel n'est PAS un ingrédient de la « mini-movie » ?","choices":["Un moment précis (7 h 14, samedi)","Un témoin qui remarque","Une liste d'ingrédients"],"a":2,"exp":"La mini-movie, c'est moment, sensoriel, témoin, réalisation interne, pic émotionnel, « nouveau normal »."},{"id":"q41","lesson":"l18","module":3,"q":"Un copy fait uniquement de phrases courtes :","choices":["Est parfait pour Facebook","Sonne robotique et haché","Est toujours plus clair"],"a":1,"exp":"Le flow vient du mélange : longues pour l'élan, courtes pour frapper. Teste à voix haute."},{"id":"q42","lesson":"l18","module":3,"q":"Le « slippery slide » de Sugarman veut dire :","choices":["Chaque élément doit pousser à lire le suivant jusqu'au CTA","Il faut écrire sur un ton glissant","Le prix doit baisser"],"a":0,"exp":"Comme un toboggan : une fois parti, on ne s'arrête qu'en bas."},{"id":"q43","lesson":"l19","module":3,"q":"« It tastes awful. And it works. » illustre :","choices":["Une erreur de marketing","La damaging admission : avouer un défaut rend le reste crédible","Une fausse urgence"],"a":1,"exp":"Le mauvais goût devient la preuve d'efficacité. Avis : « We're number two. We try harder. »"},{"id":"q44","lesson":"l19","module":3,"q":"Combien d'aveux par pièce de copy ?","choices":["Le plus possible","Un ou deux","Aucun"],"a":1,"exp":"Dix défauts, ce n'est plus de la confiance, c'est de l'auto-sabotage."},{"id":"q45","lesson":"l19","module":3,"q":"Si ton produit soulage mais ne guérit pas (et rien sur le marché ne guérit), le cours conseille :","choices":["De promettre la guérison quand même","De vendre honnêtement le soulagement : moins de remboursements, plus de fidélité, et tu es le seul honnête","D'abandonner le produit"],"a":1,"exp":"« It won't make menopause disappear, but it makes it bearable. » Les attentes justes font des clients qui restent."},{"id":"q46","lesson":"l20","module":3,"q":"Pourquoi dire « ce n'est pas pour toi si… » augmente-t-il les ventes ?","choices":["Ça fait plus court","Psychologie inverse + rareté + confiance + filtre des mauvais clients","Ça plaît à Meta"],"a":1,"exp":"Les bons clients veulent prouver qu'ils sont les bons ; les mauvais s'en vont avant de demander un remboursement."},{"id":"q47","lesson":"l20","module":3,"q":"Structure du takeaway :","choices":["Pour qui ce n'est pas → pourquoi → pour qui c'est → « si c'est toi, continue »","Prix → bonus → garantie","Hook → mécanisme → preuve"],"a":0,"exp":"« If that's you, keep reading. If not, I just saved you $79. »"},{"id":"q48","lesson":"l21","module":4,"q":"Dans la hiérarchie des déclencheurs d'attention, le plus fort est :","choices":["La curiosité","L'opportunité","La survie / la perte"],"a":2,"exp":"Survie (100 %) > douleur/perte (95 %) > identité (85 %) > opportunité (70 %) > curiosité (50 %)."},{"id":"q49","lesson":"l21","module":4,"q":"Selon l'équation de l'attention, pourquoi « revolutionary joint supplement » échoue ?","choices":["Pertinence faible, émotion nulle, nouveauté nulle : tout le monde a vu ça","Trop long","Pas assez de majuscules"],"a":0,"exp":"(3 × 1 × 1) / 2 = 1,5. Contre « still can't get off the floor without holding onto something » : (9 × 7 × 6) / 1 = 378."},{"id":"q50","lesson":"l21","module":4,"q":"La « hook fatigue », c'est :","choices":["Quand le créateur est fatigué","Quand un hook copié partout devient un motif que le cerveau ignore, voire associe à du contenu poubelle","Quand la pub dure trop longtemps"],"a":1,"exp":"Cycle : innovation → adaptation → saturation → fatigue. Remède : spécificité, micro-moments, histoires, voler hors de son secteur."},{"id":"q51","lesson":"l21","module":4,"q":"Dans la transe du scroll, quelle part du contenu est traitée consciemment ?","choices":["Moins de 5 %","Environ 50 %","Presque tout"],"a":0,"exp":"1,7 s par contenu, 3 par seconde. D'où : parler au cerveau reptilien, pas à la logique."},{"id":"q52","lesson":"l22","module":4,"q":"« My husband thought I was cheating » dans une pub ménopause est acceptable si :","choices":["On ne parle plus jamais du mari","Ça débouche vraiment sur les symptômes (elle se lève à 3 h, erre dans la maison) : pas d'appât-et-bascule","Jamais"],"a":1,"exp":"Le drama doit se résoudre dans le vrai message. Sinon : hook rate élevé, confiance détruite."},{"id":"q53","lesson":"l22","module":4,"q":"Lequel est un déclencheur « information interdite » ?","choices":["« I'm not supposed to share this »","« Buy one get one »","« Our new formula »"],"a":0,"exp":"Secrets, NDA, « my doctor whispered » : le cerveau veut ce qu'on lui cache."},{"id":"q54","lesson":"l23","module":4,"q":"Le job de la 2e ligne après le hook :","choices":["Vendre","Ancrer : confirmer que c'est pour lui (qualifier)","Donner le prix"],"a":1,"exp":"Ligne 1 arrête, ligne 2 ancre, ligne 3 ouvre une boucle."},{"id":"q55","lesson":"l23","module":4,"q":"« I dropped my keys yesterday. Looked at them for 10 seconds. Then kicked them to the couch. » Quelle formule ?","choices":["Question → renversement → promesse","Histoire in medias res → tension → stop avant résolution","Contradiction → preuve"],"a":1,"exp":"On est au milieu de la scène, la tension monte, on s'arrête avant de dire ce qui a changé."},{"id":"q56","lesson":"l24","module":4,"q":"Un hook qui fait un gros hook rate mais un hold rate nul (ex. tir vers la caméra) souffre de :","choices":["Clickbait sans payoff : le hook n'est pas connecté au message","Trop de spécificité","Mauvais ton"],"a":0,"exp":"Le hook doit mener naturellement au corps. Sinon les gens s'arrêtent, puis partent."},{"id":"q57","lesson":"l24","module":4,"q":"Pourquoi « knee-d a solution? » est une erreur ?","choices":["C'est trop long","Le jeu de mots demande un effort cognitif ; en mode zombie, la clarté bat toujours l'intelligence","C'est interdit"],"a":1,"exp":"Clear beats clever. Zéro effort pour comprendre."},{"id":"q58","lesson":"l24","module":4,"q":"Le remplacement conseillé de la fausse urgence (« only 3 left ») :","choices":["« Only 2 left »","Le coût de l'attente : « every week you wait is another week of bad sleep »","Un compte à rebours"],"a":1,"exp":"Urgence réelle énoncée simplement, ou aversion à la perte sur ce que l'attente coûte vraiment."},{"id":"q59","lesson":"l24","module":4,"q":"Sur-promettre (« pain gone in 24 hours ») coûte aussi :","choices":["Rien si ça vend","Remboursements, chargebacks, abonnements annulés, et la confiance","Seulement du temps"],"a":1,"exp":"Si ton modèle a besoin de 3 mois de rétention, tes preuves doivent parler de 3 mois."},{"id":"q60","lesson":"l25","module":5,"q":"« My grandson sprinted at me at the park. I didn't flinch. I scooped him up. » est :","choices":["Une histoire d'origine","Une histoire client complète","Une histoire-moment (un instantané qui dit toute la transformation)"],"a":2,"exp":"Pas de parcours, une seule scène sensorielle. Idéale pour un hook, un UGC de 15 s, un objet d'e-mail."},{"id":"q61","lesson":"l25","module":5,"q":"Dans l'histoire d'origine, le fondateur est :","choices":["Le héros","Le guide (celui qui a découvert et partage)","Le client"],"a":1,"exp":"Il a eu le problème, a tout essayé, a trouvé, et maintenant il montre le chemin, souvent contre une industrie."},{"id":"q62","lesson":"l26","module":5,"q":"Pourquoi la tension d'un UGC se raconte-t-elle au passé ?","choices":["Parce que c'est plus facile à jouer","Parce que le spectateur, qui vit ça au présent, se dit « elle l'avait aussi, qu'est-ce qui a changé ? » : relatabilité sans peur","Parce que Meta l'exige"],"a":1,"exp":"Les gens scrollent pour fuir leur vie. On ne la leur jette pas au visage ; on montre quelqu'un qui en est sorti."},{"id":"q63","lesson":"l26","module":5,"q":"Les 4 temps d'un UGC court :","choices":["Hook, tension, shift, résultat","Intro, produit, prix, CTA","Problème, étude, ingrédients, offre"],"a":0,"exp":"Et le résultat doit coller au désir réel de l'avatar : ni plus (scepticisme), ni moins."},{"id":"q64","lesson":"l27","module":5,"q":"Un bon témoignage ressemble à :","choices":["Un communiqué : « great product, fast shipping, will buy again »","Une conversation surprise entre deux amies au café : détails bizarres, scepticisme avoué, pas 100 % positif","Une fiche technique"],"a":1,"exp":"« Some days are still hard » augmente la crédibilité ; la perfection déclenche le doute."},{"id":"q65","lesson":"l27","module":5,"q":"Où placer les témoignages sur une page ?","choices":["Tout en bas","Au milieu, après le mécanisme ou le produit, sous une forme authentique (captures de commentaires)","Dans le pied de page"],"a":1,"exp":"En bas, personne ne les lit. Au milieu, ils lèvent les objections au bon moment."},{"id":"q66","lesson":"l28","module":5,"q":"Le temps le plus important de l'arc complet :","choices":["L'offre","Le mécanisme","Le hook"],"a":1,"exp":"Sans mécanisme, aucune raison de croire, donc pas de vente. Simple comme pour un enfant, avec une analogie et un nom."},{"id":"q67","lesson":"l28","module":5,"q":"Le point de rupture doit être :","choices":["Une décision (« j'ai décidé d'agir »)","Une scène avec un témoin et de la honte (« ma fille a dit qu'elle avait honte »)","Un chiffre"],"a":1,"exp":"Un moment, pas une décision. Il reflète ceux qui y sont et effraie ceux qui n'y sont pas encore."},{"id":"q68","lesson":"l28","module":5,"q":"Dans la « découverte » (temps 6), l'ordre crédible est :","choices":["J'ai fait des recherches sur 3 ingrédients, puis par hasard j'ai trouvé un produit qui les contient","Quelqu'un m'a recommandé le produit, puis j'ai vérifié le mécanisme et les études","J'ai vu une pub"],"a":1,"exp":"L'inverse sonne faux. On trouve d'abord, on vérifie ensuite."},{"id":"q69","lesson":"l28","module":5,"q":"L'ordre des preuves pour un public logique (souvent les hommes) :","choices":["Histoires d'abord","Démonstration d'abord (montrer que le mécanisme marche)","Prix d'abord"],"a":1,"exp":"Sceptiques : science d'abord. Émotionnels : histoires. Logiques : démo."},{"id":"q70","lesson":"l29","module":6,"q":"Selon Kahneman & Tversky (prospect theory), perdre 100 $ :","choices":["Fait aussi mal que gagner 100 $ fait plaisir","Fait environ deux fois plus mal","Ne compte pas"],"a":1,"exp":"D'où : les pubs sur ce qu'on perd battent celles sur ce qu'on gagne. Mais toujours avec une solution."},{"id":"q71","lesson":"l29","module":6,"q":"La méta-analyse de 127 études sur la peur montre qu'elle marche surtout :","choices":["Seule","Quand elle est accompagnée d'une solution","Chez les jeunes"],"a":1,"exp":"Peur + sortie = action. Peur sans sortie = fuite."},{"id":"q72","lesson":"l29","module":6,"q":"L'expérience « because » de Langer (1978) montre que :","choices":["Donner une raison, même creuse, augmente l'obéissance de 34 %","Les gens détestent les explications","Les raisons longues marchent mieux"],"a":0,"exp":"Le mécanisme est le « parce que » de ton produit : il répond à « pourquoi ça marcherait quand rien d'autre n'a marché ? »."},{"id":"q73","lesson":"l29","module":6,"q":"« You don't break the spell » veut dire :","choices":["Une histoire prolonge la transe du scroll au lieu de la casser par une pub","Il faut éviter la magie","Il faut un ton sérieux"],"a":0,"exp":"Les gens scrollent pour s'évader ; une histoire est une autre évasion, dans laquelle on glisse le produit."},{"id":"q74","lesson":"l29","module":6,"q":"Advertorial ou listicle ?","choices":["Advertorial pour un public conscient du problème (il faut éduquer), listicle pour un public conscient du produit","L'inverse","Toujours listicle"],"a":0,"exp":"On éduque celui qui ne connaît pas la solution ; on donne « 5 raisons » à celui qui connaît déjà le produit."},{"id":"q75","lesson":"l30","module":6,"q":"Le rituel de Schwartz pour ne jamais avoir de page blanche :","choices":["Écrire la nuit","Un minuteur de 33 min 33 : tu peux ne rien faire, mais rien d'autre ; puis 5 min de pause obligatoire","Dicter à sa secrétaire"],"a":1,"exp":"L'ennui pousse à travailler ; la pause laisse le cerveau connecter."},{"id":"q76","lesson":"l30","module":6,"q":"Pour Schwartz, le titre n'a qu'un seul travail :","choices":["Vendre le produit","Faire lire la phrase suivante","Identifier l'entreprise"],"a":1,"exp":"Et chaque phrase a le même job. L'enveloppe entière est le titre."},{"id":"q77","lesson":"l30","module":6,"q":"« Copy is not written, copy is assembled » signifie :","choices":["Qu'on copie les concurrents","Qu'on empile des blocs (claims, images, désirs) trouvés dans le produit lui-même","Qu'on écrit à plusieurs"],"a":1,"exp":"La puissance est dans le produit ; le copywriter la trouve (en lisant chaque page) et l'exprime."},{"id":"q78","lesson":"l30","module":6,"q":"Le mot le plus puissant de la langue anglaise selon Schwartz :","choices":["Free","New","You"],"a":2,"exp":"On écrit à une seule personne qui partage un désir avec des millions. Jamais « the hands », toujours « your hands »."},{"id":"q79","lesson":"l30","module":6,"q":"Quand les claims s'épuisent (claim exhaustion), que porte la croyance ?","choices":["Le prix","Le mécanisme étrange (« a way to vacuum dust from drawers without removing the contents »)","Les couleurs"],"a":1,"exp":"Le lecteur commande pour savoir comment c'est possible, même s'il n'y croit pas."},{"id":"q80","lesson":"l30","module":6,"type":"tf","q":"Vrai ou faux : Schwartz vendait souvent sans premium (cadeau) pour garder la marge.","a":1,"exp":"Faux. « I wouldn't sell anything without them. » Le premium fait essayer, et on joue toujours le coup suivant."}],"cards":[{"id":"c001","tag":"Conscience","q":"Les 5 niveaux de conscience, dans l'ordre ?","a":"1 Inconscient · 2 Conscient du problème · 3 Conscient des solutions · 4 Conscient du produit · 5 Le plus conscient (prêt à acheter)."},{"id":"c002","tag":"Conscience","q":"Que fait le copy pour un public <b>niveau 1</b> ?","a":"Miroir des symptômes (sans nommer la solution), puis nommer le problème et ses conséquences. On peut remuer le couteau."},{"id":"c003","tag":"Conscience","q":"Que fait le copy pour un public <b>niveau 3</b> ?","a":"Pas de couteau. Expliquer pourquoi les autres solutions ont échoué, puis mécanisme unique + preuve. Douleur brève, espoir immédiat."},{"id":"c004","tag":"Conscience","q":"Que fait le copy pour un public <b>niveau 4</b> ?","a":"Lever les objections, empiler les preuves, garantie, offre irrésistible (milieu de tunnel, retargeting)."},{"id":"c005","tag":"Conscience","q":"Que fait le copy pour un public <b>niveau 5</b> ?","a":"Dégager : CTA clair, meilleure offre, urgence. Aucune éducation."},{"id":"c006","tag":"Conscience","q":"Trafic froid / chaud / retargeting / e-mail : quels niveaux ?","a":"Froid 1-3 · Chaud 3-4 · Retargeting 4-5 · E-mail et recherche de marque 3-5 (souvent 5)."},{"id":"c007","tag":"Conscience","q":"L'erreur n° 1 sur les niveaux de conscience ?","a":"Écrire du niveau 5 (« -40 % ») à des gens de niveau 2. Ou du niveau 1 (« did you know… ») à un marché de niveau 3."},{"id":"c008","tag":"Sophistication","q":"Les 5 stades de sophistication ?","a":"1 Vierge (simple promesse) · 2 Promesses plus grosses · 3 Mécanisme obligatoire · 4 Nouveau mécanisme ou niche · 5 Personnalité, histoire, identité."},{"id":"c009","tag":"Sophistication","q":"À quel stade sont la plupart des marchés santé / beauté / compléments ?","a":"Stade 3 ou 4. Le stade 1 n'existe quasiment plus en vente directe."},{"id":"c010","tag":"Sophistication","q":"Les deux options du stade 4 ?","a":"A) Un nouveau mécanisme (nouvelle cause racine). B) Niche down (un avatar précis : « si tu n'as pas de SOPK, n'achète pas »)."},{"id":"c011","tag":"Sophistication","q":"Pourquoi Zakaria utilise des techniques de stade 5 même sur un marché de stade 3 ?","a":"L'histoire, l'aveu, la connexion humaine augmentent la croyance partout. On ajoute, on ne remplace pas le mécanisme."},{"id":"c012","tag":"Diagnostic","q":"Qu'est-ce que la « baseline » de conscience d'un marché ?","a":"Le niveau dominant, fixé par l'ancienneté du problème, la quantité de pub vue et ce dont on parle publiquement. La source de trafic la décale, ne la fixe pas."},{"id":"c013","tag":"Diagnostic","q":"Comment diagnostiquer la sophistication d'un marché (3 sources) ?","a":"Pubs concurrentes qui tournent depuis 3-6 mois ; avis Amazon 3 étoiles ; Reddit / forums (croyances, essais, scepticisme)."},{"id":"c014","tag":"Diagnostic","q":"Formule pour un avatar « niveau 3 sur la solution, niveau 1 sur la cause » (ex. cheveux SOPK) ?","a":"Reconnaître ce qu'il a essayé → expliquer pourquoi ça a échoué → révéler la vraie cause → montrer que ta solution la cible."},{"id":"c015","tag":"Matrice","q":"Case « faible conscience × forte sophistication » : la règle ?","a":"Gagner tout le parcours dans une seule pièce : symptôme → nommer → mécanisme → preuve → fermer avant qu'il aille comparer."},{"id":"c016","tag":"Matrice","q":"Case « forte conscience × forte sophistication » : que faut-il ?","a":"Mécanisme fort + preuves empilées + histoire/personnalité + offre irrésistible. C'est l'océan rouge de la plupart des marques."},{"id":"c017","tag":"Douleur","q":"Règle d'intensité de la douleur selon le niveau ?","a":"N1-2 : remuer le couteau (ils banalisent). N3 : douleur brève + espoir immédiat. N4-5 : aucune douleur, juste la raison d'acheter."},{"id":"c018","tag":"Douleur","q":"Qu'est-ce que l'effet « paralysie / fuite » ?","a":"Quand on appuie sur la douleur de quelqu'un qui souffre déjà sans lui montrer de sortie : il scrolle pour se protéger."},{"id":"c019","tag":"Émotions","q":"Les 6 émotions d'achat ?","a":"Relief (soulagement) · Nurturance (protéger) · Belonging (appartenir) · Identity (redevenir soi) · Security (peur de perdre) · Status (être admiré)."},{"id":"c020","tag":"Émotions","q":"Émotion dominante quand l'acheteur n'est pas l'utilisateur ?","a":"Nurturance. On fait plus pour ceux qu'on aime que pour soi (parents, maîtres d'animaux)."},{"id":"c021","tag":"Émotions","q":"Quelle émotion place-t-on souvent juste avant le CTA ?","a":"Security / aversion à la perte : « chaque mois que tu attends… ne revient pas »."},{"id":"c022","tag":"Émotions","q":"Signaux de Relief dans la recherche avatar ?","a":"« I couldn't take it anymore », « finally something that works », « I just wanted it to stop »."},{"id":"c023","tag":"Émotions","q":"Signaux d'Identity ?","a":"« I don't feel like myself », « I want to be me again », « I used to be… »."},{"id":"c024","tag":"Émotions","q":"Combien d'émotions viser par pièce de copy ?","a":"Une ou deux à fond, une troisième en secondaire. Pas six."},{"id":"c025","tag":"Parcours","q":"Les 5 étapes du parcours émotionnel ?","a":"Indifférence → Curiosité → Espoir → Conviction → Urgence."},{"id":"c026","tag":"Parcours","q":"Ce qui déclenche chaque étape ?","a":"Indifférence : « c'est moi » (image précise). Curiosité : info nouvelle/boucle. Espoir : quelqu'un comme moi + résultat précis. Conviction : volume de preuves + objections. Urgence : coût de l'attente, rareté réelle."},{"id":"c027","tag":"Parcours","q":"Répartition pub / landing page ?","a":"Pub : indifférence → curiosité → espoir. Haut de page : espoir → conviction. Bas de page : conviction → urgence."},{"id":"c028","tag":"Douleur","q":"Douleur vs désir : définition ?","a":"Douleur = s'éloigner de (« stop waking up drenched »). Désir = aller vers (« sleep like you used to »). Deux portes vers la même émotion."},{"id":"c029","tag":"Douleur","q":"Quand mener par la douleur, quand par le désir ?","a":"Douleur : niveaux 1-2 (ils banalisent). Désir : niveau 3+ (ils vivent déjà la douleur, besoin d'espoir)."},{"id":"c030","tag":"Douleur","q":"« Pain gets attention, desire gets… » ?","a":"…action. La douleur arrête le scroll, le désir fait cliquer."},{"id":"c031","tag":"Acheteur/utilisateur","q":"Structure en 6 blocs pour « acheteur ≠ utilisateur » ?","a":"1 Symptôme visible par l'acheteur · 2 Douleur de l'utilisateur vue par l'acheteur · 3 Émotion de l'acheteur · 4 Pont (« tu peux faire quelque chose ») · 5 Preuve (utilisateurs comme le sien) · 6 CTA formulé comme « aider »."},{"id":"c032","tag":"Acheteur/utilisateur","q":"Pour un chien, par où passe toute la douleur dans le copy ?","a":"Par ce que le maître observe (lent à se lever), devine (« il ne peut pas te le dire ») et ressent (culpabilité, impuissance)."},{"id":"c033","tag":"Intensité","q":"Les 3 intensités émotionnelles ?","a":"Aiguë (ça brûle, décision rapide) · Chronique (habitué, à réactiver) · Aspirationnelle (ce serait bien, urgence à créer, 2-3× plus de contacts)."},{"id":"c034","tag":"Intensité","q":"6 techniques pour créer l'urgence chez un public aspirationnel ?","a":"Pente glissante · Point de non-retour · Coût caché · Futur soi (version A / B) · Regret anticipé · Petit investissement vs gros résultat."},{"id":"c035","tag":"Langue","q":"« Voice match = … » ?","a":"…trust. Vocabulaire, longueur de phrase, formalité et température émotionnelle de l'avatar, tirés du dossier de recherche."},{"id":"c036","tag":"Mots qui tuent","q":"Que remplace « game changer » ?","a":"Le changement montré : « I slept seven hours for the first time in eight months »."},{"id":"c037","tag":"Mots qui tuent","q":"Que remplace « just try it, you have nothing to lose » ?","a":"Traiter l'objection réelle : « You've been burned before. Here's why this is different, and here's your money back. »"},{"id":"c038","tag":"Mots qui tuent","q":"Mots faibles à couper ?","a":"very, really, just, things, stuff, kind of, sort of, honestly, to be honest, I think, I feel like."},{"id":"c039","tag":"Mots qui tuent","q":"Où le jargon corporate (clinically proven, industry leading) est-il toléré ?","a":"Page produit ou bouche d'une autorité. Jamais dans un témoignage ou un UGC."},{"id":"c040","tag":"Mots qui tuent","q":"Le test décisif d'un texte générique ?","a":"Pourrait-on remplacer le nom du produit par un concurrent sans rien changer ? Une vraie personne dirait-elle ça ?"},{"id":"c041","tag":"Spécificité","q":"Les 7 types de spécificité ?","a":"Chiffres · Temps · Sensoriel · Scénario · Personne · Processus · Comparaison."},{"id":"c042","tag":"Spécificité","q":"Pourquoi le spécifique est-il cru ?","a":"Le cerveau prend la précision pour un raccourci vers la vérité : « pourquoi 87 % et pas 90 ? ». Les menteurs arrondissent."},{"id":"c043","tag":"Spécificité","q":"Les 3 règles de la spécificité ?","a":"Ne jamais inventer (va chercher la donnée) · Ne pas sur-spécifier (23,7 % en 14,3 jours) · Backer chaque chiffre."},{"id":"c044","tag":"Boucles","q":"Qu'est-ce qu'une boucle ouverte et pourquoi ça marche ?","a":"Une pensée incomplète ; le cerveau déteste et continue pour la refermer (effet Zeigarnik : on retient mieux l'inachevé)."},{"id":"c045","tag":"Boucles","q":"6 types de boucles ?","a":"« Ce qu'ils cachent » (ennemi) · Story interrupt · Contradiction · Les chiffres ne collent pas · « Avant de te le dire » · Boucles empilées (3 choses…)."},{"id":"c046","tag":"Boucles","q":"Règles des boucles ?","a":"Toujours refermer · La réponse doit valoir l'attente · Max 4 actives · Le détour doit être intéressant en lui-même."},{"id":"c047","tag":"Boucles","q":"Où placer les boucles ?","a":"3 premières lignes · avant chaque passage explicatif · avant la demande · en transition de section · la pub ouvre, la landing ferme et rouvre."},{"id":"c048","tag":"Bucket brigades","q":"5 exemples de bucket brigades ?","a":"But here's the thing · Here's what nobody tells you · Sound familiar? · Picture this · Here's the bottom line."},{"id":"c049","tag":"Bucket brigades","q":"Fréquence et placement ?","a":"Aux transitions et aux baisses d'énergie (passages ingrédients), tous les 3-5 paragraphes. Pas à chaque phrase. Accordées au ton de l'avatar."},{"id":"c050","tag":"Sensoriel","q":"Pourquoi le sensoriel contourne-t-il le scepticisme ?","a":"On peut discuter une affirmation (« reduces pain ») mais pas une expérience ressentie (« that stabbing pain when you first stand up »)."},{"id":"c051","tag":"Sensoriel","q":"Les 5 questions pour convertir un bénéfice abstrait ?","a":"Que verra-t-il ? Que sentira-t-il ? Qu'entendra-t-il ? Qu'est-ce qui n'arrivera plus ? Quel moment précis sera différent ?"},{"id":"c052","tag":"Sensoriel","q":"Structure de la « mini-movie » ?","a":"Décor (jour, heure, lieu) → détails sensoriels → contraste avec avant → émotion → résolution."},{"id":"c053","tag":"Future pacing","q":"Pourquoi le future pacing fait acheter ?","a":"Le cerveau vit la scène imaginée (mêmes zones, dopamine). Ne pas acheter = perdre quelque chose qu'on a déjà ressenti."},{"id":"c054","tag":"Future pacing","q":"6 ingrédients d'un future pacing fort ?","a":"Moment précis · Déclencheur sensoriel · Témoin qui remarque · Réalisation interne (« wait, that's it? ») · Pic émotionnel · Cadrage « nouveau normal » (« this is just Tuesday »)."},{"id":"c055","tag":"Future pacing","q":"Le test physique du future pacing ?","a":"Lu à voix haute : rythme cardiaque, sourire, yeux qui piquent ? Sinon ce n'est pas assez fort. Placement : juste avant le CTA."},{"id":"c056","tag":"Rythme","q":"À quoi servent les phrases courtes ? les longues ?","a":"Courtes : frapper (points clés, pics, pause après un bloc). Longues : élan (image, récit, explication). Tout court = robot, tout long = essoufflant."},{"id":"c057","tag":"Rythme","q":"4 outils de rythme ?","a":"Fragments (« Not anymore. ») · Règle de trois · Parallélisme (« you've tried…, you've seen…, you've read… ») · Montée en intensité."},{"id":"c058","tag":"Rythme","q":"Le test ultime du rythme ?","a":"Lire à voix haute (ou s'enregistrer). Souffle court = trop long ; haché = trop court ; ennui = manque de boucle."},{"id":"c059","tag":"Aveu","q":"Qu'est-ce qu'une damaging admission et pourquoi ça marche ?","a":"Avouer un vrai défaut (délai, prix, goût, prise quotidienne). Le cerveau conclut « ils sont honnêtes » et croit le reste. Buckley's : « it tastes awful and it works »."},{"id":"c060","tag":"Aveu","q":"Formule aveu + pivot ?","a":"« Ça prend 14 jours PARCE QUE ça répare au lieu de masquer. » « C'est 79 $ PARCE QUE forme clinique, 87 % absorbée. »"},{"id":"c061","tag":"Aveu","q":"Règles de l'aveu ?","a":"Un vrai défaut, pas un faux · Qui ne détruit pas la proposition de valeur · Un ou deux par pièce · Qui mène quelque part de positif."},{"id":"c062","tag":"Aveu","q":"Si ton produit soulage sans guérir ?","a":"Vends honnêtement le soulagement : moins de remboursements, plus de fidélité, et tu es le seul honnête dans une foule de « cures »."},{"id":"c063","tag":"Takeaway","q":"Pourquoi « ce n'est pas pour toi si… » vend plus ?","a":"Psychologie inverse (je veux ce qu'on m'enlève) + rareté + confiance (vendeur honnête) + filtre des mauvais clients."},{"id":"c064","tag":"Takeaway","q":"Structure du takeaway ?","a":"Pour qui ce n'est pas → pourquoi → pour qui c'est → « if that's you, keep reading ; if not, I just saved you $79 »."},{"id":"c065","tag":"Attention","q":"Que se passe-t-il dans le cerveau en 0,5 s face à un hook ?","a":"0-100 ms détection · 100-300 ms amygdale : menace / récompense / ignorer · 300-500 ms « est-ce pour moi ? » · 500 ms décision. La plupart des pubs meurent avant 300 ms."},{"id":"c066","tag":"Attention","q":"À quoi réagit le cerveau reptilien ?","a":"Menace · Opportunité · Nouveauté/inattendu · Soi (ma tribu, ma situation) · Contraste · Émotion forte."},{"id":"c067","tag":"Attention","q":"Hiérarchie des déclencheurs d'attention ?","a":"5 Survie (100 %) > 4 Douleur/perte (95 %) > 3 Identité (85 %) > 2 Opportunité (70 %) > 1 Curiosité (50 %)."},{"id":"c068","tag":"Attention","q":"L'équation de l'attention ?","a":"Attention = (pertinence × émotion × nouveauté) / effort. « Revolutionary joint supplement » = 1,5 ; « still can't get off the floor without holding onto something » = 378."},{"id":"c069","tag":"Attention","q":"Le hook passe « est-ce pour moi ? » s'il touche… (7 choses)","a":"Démographie · Situation exacte · Identité · Douleur · Désir · Ennemi · Échecs passés."},{"id":"c070","tag":"Attention","q":"Qu'est-ce que la hook fatigue et ses 4 phases ?","a":"Un hook copié partout devient un motif ignoré (et associé au contenu poubelle). Innovation → adaptation → saturation → fatigue."},{"id":"c071","tag":"Attention","q":"5 remèdes à la hook fatigue ?","a":"Spécificité (incopiable) · Voler hors de son secteur · Micro-spécifique (le geste exact) · Histoires (infinies) · Être premier plutôt que parfait."},{"id":"c072","tag":"Attention","q":"Statistiques de la transe du scroll ?","a":"1,7 s par contenu · 3 contenus par seconde · moins de 5 % traités consciemment."},{"id":"c073","tag":"Triggers","q":"Les 4 choses pour lesquelles le cerveau est câblé (trigger phrases) ?","a":"Menaces sociales (trahison, secret) · Menaces de survie (hôpital, arnaque) · Information interdite · Histoires inachevées. Plus le gossip."},{"id":"c074","tag":"Triggers","q":"10 catégories de phrases déclencheurs ?","a":"Gossip relationnel · Pris/exposé · Secret · Arnaque · Urgence médicale · Crise financière · Confession · Découverte · Conflit avec l'autorité · Transformation."},{"id":"c075","tag":"Triggers","q":"Formule d'un hook à déclencheur ?","a":"Phrase déclencheur + ton sujet + qualification + boucle. « My husband thought I was faking it. After three years of complaining about my knees… That's when I knew. »"},{"id":"c076","tag":"Triggers","q":"La règle anti-clickbait ?","a":"Pas d'appât-et-bascule : le drama doit se résoudre dans le vrai message. On veut hook rate ET hold rate ET conversion."},{"id":"c077","tag":"3 lignes","q":"Le job des 3 premières lignes après le hook ?","a":"Ligne 1 arrête (rupture) · Ligne 2 ancre (c'est pour toi) · Ligne 3 ouvre une boucle (commitment)."},{"id":"c078","tag":"3 lignes","q":"5 formules d'ouverture ?","a":"Douleur → validation → sortie · Histoire in medias res → tension → stop · Question → renversement → promesse · Contradiction → preuve → empilement · Transformation → contraste → teaser."},{"id":"c079","tag":"Erreurs hook","q":"10 erreurs de hook ?","a":"Clickbait sans payoff · Sur-promesse · Ennuyeux/attendu · Commencer par le produit · Trop vague · Trop malin · Fermer la boucle dans le hook · Mauvais ton de plateforme · Viser tout le monde · Fausse urgence."},{"id":"c080","tag":"Erreurs hook","q":"« Clear beats clever » ?","a":"En mode zombie, zéro effort disponible : un jeu de mots (« knee-d a solution? ») tue le hook. Clarté d'abord."},{"id":"c081","tag":"Erreurs hook","q":"Que remplace la fausse urgence ?","a":"Une urgence réelle dite simplement, ou le coût de l'attente (« every week you wait is another week of bad sleep »)."},{"id":"c082","tag":"Erreurs hook","q":"Hook OK + hold mauvais = ? Hold OK + pas d'achat = ?","a":"Problème de boucles / de corps. Problème de mécanisme ou de preuve. Un bon hook permet de tester le reste."},{"id":"c083","tag":"Histoires","q":"Les 3 types d'histoires qui convertissent ?","a":"Origine (pourquoi ça existe, le guide) · Client (quelqu'un comme toi) · Moment (une scène qui dit tout)."},{"id":"c084","tag":"Histoires","q":"Structure de l'histoire client ?","a":"Avant → point de rupture → découverte → scepticisme → essai → résultat → maintenant."},{"id":"c085","tag":"Histoires","q":"Comment combiner les 3 types ?","a":"Ouvrir sur un moment → développer en histoire client → introduire l'origine (mécanisme crédible) → fermer sur un moment futur."},{"id":"c086","tag":"UGC","q":"Les 4 temps d'un UGC court et leurs durées (30 s) ?","a":"Hook 3 s · Tension 10 s · Shift 5 s · Résultat 12 s."},{"id":"c087","tag":"UGC","q":"Pourquoi raconter la tension au passé ?","a":"Le spectateur vit ça au présent ; « elle l'avait aussi, qu'est-ce qui a changé ? » = relatabilité sans peur. Les gens scrollent pour fuir, pas pour être effrayés."},{"id":"c088","tag":"UGC","q":"Règles de langue d'un UGC ?","a":"Première personne, passé, langage parlé (phrases incomplètes OK), détails précis (3 a.m.), émotion montrée pas nommée, créateur qui ressemble à l'avatar."},{"id":"c089","tag":"Témoignages","q":"Structure d'un témoignage qui sonne vrai ?","a":"Moment (scène du problème) → Lutte (essais précis) → Découverte (naturelle, sceptique) → Maintenant (réalité concrète)."},{"id":"c090","tag":"Témoignages","q":"Le principe d'honnêteté des témoignages ?","a":"Inclure scepticisme, délai plus long, imperfection (« some days are still hard »). La perfection déclenche le doute."},{"id":"c091","tag":"Témoignages","q":"Où placer les témoignages ?","a":"Au milieu de la page, après le mécanisme/produit, sous forme authentique (captures de commentaires), pas en bas."},{"id":"c092","tag":"Arc complet","q":"Les 4 actes de l'arc complet ?","a":"1 Identification (hook, l'avant, point de rupture) · 2 Éducation (échecs, mécanisme) · 3 Solution (découverte, preuves, produit, essai, après) · 4 Close (offre, urgence/choix)."},{"id":"c093","tag":"Arc complet","q":"Formule du point de rupture ?","a":"Attente + échec + témoin + émotion. Une scène, pas une décision. La honte pousse à agir."},{"id":"c094","tag":"Arc complet","q":"Les 3 jobs d'un mécanisme (Marrakech) ?","a":"Invalider ce qu'ils ont essayé · Nommer la vraie cause · Positionner le produit comme seule réponse logique."},{"id":"c095","tag":"Arc complet","q":"3 types de mécanisme ?","a":"Cause cachée · Ingrédient manquant · Processus cassé. Donner un nom unique."},{"id":"c096","tag":"Arc complet","q":"Astuce « ingrédient déjà cru + twist » ?","a":"Prends un ingrédient auquel ils croient déjà (magnésium) et ajoute un élément de curiosité (L-théanine, dosage, forme) pour rendre le mécanisme unique."},{"id":"c097","tag":"Arc complet","q":"Ordre crédible de la découverte ?","a":"On trouve le produit (ami, groupe), PUIS on vérifie mécanisme et études. L'inverse sonne faux."},{"id":"c098","tag":"Arc complet","q":"7 types de preuves à empiler ?","a":"Science · Autorité · Volume social · Histoires · Démonstration · Timeline personnelle · Garantie (risque inversé)."},{"id":"c099","tag":"Arc complet","q":"L'ordre des preuves selon le public ?","a":"Sceptiques : science d'abord. Émotionnels : histoires d'abord. Logiques (souvent les hommes) : démo d'abord."},{"id":"c100","tag":"Arc complet","q":"La timeline d'essai doit être… ?","a":"À la frontière entre « rapide » et « croyable ». Début lent (jour 1 : rien) puis jour 10, jour 14. Le miracle = détecteur de BS."},{"id":"c101","tag":"Arc complet","q":"Les composants de l'offre (temps 11) ?","a":"Ancrer haut (coût des alternatives) → prix → bonus liés au produit → garantie basée sur le cycle réel → les maths (« $1.65 a day »)."},{"id":"c102","tag":"Arc complet","q":"Le CTA se formule comme… ?","a":"Un résultat (« grow my hair back », « give him back his walks »), pas « add to cart »."},{"id":"c103","tag":"Marrakech","q":"Prospect theory (Kahneman & Tversky, 1979) en une phrase ?","a":"Perdre 100 $ fait environ deux fois plus mal que gagner 100 $ fait plaisir. La peur bat le désir, avec une solution."},{"id":"c104","tag":"Marrakech","q":"Résultat de la méta-analyse de 127 études sur la peur ?","a":"La peur augmente attitudes, intentions et comportements, surtout quand elle est accompagnée d'une solution."},{"id":"c105","tag":"Marrakech","q":"Les claims spécifiques sont jugés… ?","a":"21 à 53 % plus crédibles que les claims vagues. « 31 days » bat « about a month »."},{"id":"c106","tag":"Marrakech","q":"L'expérience « because » (Langer, 1978) ?","a":"Donner une raison, même creuse, augmente l'obéissance de 34 %. Le mécanisme est le « because » du produit."},{"id":"c107","tag":"Marrakech","q":"Transportation theory et ocytocine ?","a":"Absorbé par un récit, on contre-argumente moins ; les histoires émotionnelles ont augmenté les dons de 56 % (Zak, 2014)."},{"id":"c108","tag":"Marrakech","q":"Expérience empruntée vs future pacing ?","a":"Empruntée : le résultat vécu par quelqu'un d'autre, en « je » (la Lambo du guru). Future pacing : le futur du lecteur, en « tu ». On combine les deux avant le CTA."},{"id":"c109","tag":"Marrakech","q":"Système 1 / système 2 et le copy ?","a":"Le scroll est en système 1 (automatique, émotionnel). Le mécanisme doit être compréhensible par un enfant de 5 ans."},{"id":"c110","tag":"Marrakech","q":"Advertorial ou listicle, selon quoi ?","a":"Advertorial pour un public conscient du problème (éduquer) ; listicle pour un public conscient du produit."},{"id":"c111","tag":"Schwartz","q":"La méthode de lecture de Schwartz ?","a":"Lire chaque page du manuscrit, souligner chaque claim, 1 h par jour pendant 2 semaines, faire taper un « vocabulaire » de 50-60 pages, puis assembler."},{"id":"c112","tag":"Schwartz","q":"Le minuteur de Schwartz ?","a":"33 min 33 s : interdit de faire autre chose, permis de ne rien faire. Puis 5 min de pause obligatoire : le cerveau connecte quand il joue."},{"id":"c113","tag":"Schwartz","q":"« Copy is not written, copy is… » ?","a":"…assembled. Des blocs (claims, images, désirs) empilés en « a little city of desire ». Les mots sont des vitrines : on doit voir le produit, pas la vitre."},{"id":"c114","tag":"Schwartz","q":"Créativité = ?","a":"Connectivité : relier deux idées qui n'allaient pas ensemble. Le cerveau focalisé tient 7 éléments ; l'inconscient connecte pendant les pauses (douche, vacances, trois projets en parallèle)."},{"id":"c115","tag":"Schwartz","q":"Le seul job du titre (et de chaque phrase) ?","a":"Faire lire la phrase suivante."},{"id":"c116","tag":"Schwartz","q":"Longueur du copy et « scapegoat » ?","a":"Aussi long qu'il faut pour les claims ; toujours une sortie pour commander tôt (enveloppe + 1re page suffisent). On ne vend pas, on fait essayer."},{"id":"c117","tag":"Schwartz","q":"Claim + mécanisme chez Schwartz ?","a":"Une promesse forte + un moyen étrange (« vacuum dust from drawers without removing the contents », voir page 71). Quand les claims s'épuisent, le mécanisme porte la croyance."},{"id":"c118","tag":"Schwartz","q":"Comment relancer un package fatigué ?","a":"Un autre copywriter, un « whole new set of do's » : on ne vend pas un livre mais ce qu'il fait faire. Et toujours un premium."}],"glossary":[{"t":"Creative strategist (stratège créatif)","d":"La personne qui décide quoi dire, à qui, sous quelle forme, avant de produire une pub. Il choisit l'angle, le persona, le niveau de conscience, le format, puis brief les créateurs et analyse les résultats."},{"t":"Copywriting","d":"L'écriture qui vend : textes de pubs, scripts vidéo, pages produit, e-mails. Zakaria : « tout ce que lit ton client est du copywriting »."},{"t":"Avatar / persona","d":"Le portrait précis du client idéal : âge, situation, mots qu'il emploie, douleurs du quotidien, ce qu'il a déjà essayé."},{"t":"Avatar deep dive","d":"Le dossier de recherche sur l'avatar (avis Amazon, Reddit, groupes Facebook, appels clients). Toute bonne accroche vient de là, pas de l'imagination."},{"t":"Niveaux de conscience (awareness levels)","d":"Les 5 états mentaux du prospect (Eugene Schwartz) : 1 inconscient du problème, 2 conscient du problème, 3 conscient des solutions, 4 conscient du produit, 5 le plus conscient (prêt à acheter)."},{"t":"Stades de sophistication (market sophistication)","d":"À quel point le marché a déjà tout entendu : 1 vierge (une simple promesse suffit), 2 promesses plus grosses, 3 il faut un mécanisme, 4 nouveau mécanisme ou niche, 5 seuls l'identité, la personnalité et l'histoire marchent."},{"t":"Mécanisme (unique mechanism)","d":"L'explication simple de POURQUOI le produit marche là où les autres échouent. Exemple du cours : « ce n'est pas la bactérie, c'est l'inflammation en dessous »."},{"t":"Root cause (cause racine)","d":"La vraie origine du problème, souvent différente de ce que le client croit. Exemple du cours : la perte de cheveux SOPK n'est pas un problème de cheveux, c'est hormonal."},{"t":"Hook (accroche)","d":"Les 1 à 3 premières secondes ou lignes. Son seul travail : faire lire la ligne suivante (Schwartz). Doit passer le filtre « est-ce pour moi ? » en 0,5 seconde."},{"t":"Hook rate (taux d'accroche)","d":"Part des gens qui regardent au moins les 3 premières secondes d'une vidéo. Mesure la qualité du hook."},{"t":"Hold rate (taux de rétention)","d":"Part des gens qui restent après le hook. Mesure la qualité du corps : boucles ouvertes, rythme, histoire."},{"t":"CTR","d":"Click-through rate : part des gens qui cliquent sur la pub."},{"t":"CPA / ROAS","d":"CPA : coût par achat. ROAS : chiffre d'affaires divisé par la dépense pub (return on ad spend)."},{"t":"Open loop (boucle ouverte)","d":"Une pensée laissée incomplète qui force à continuer (« ce que j'ai trouvé page 4 des résultats Google… »). Max 4 boucles actives, et toujours les refermer."},{"t":"Bucket brigade","d":"Petites phrases-ponts qui poussent à la phrase suivante : « Here's the thing », « But here's what nobody tells you », « Sound familiar? »."},{"t":"Specificity injection","d":"Remplacer le vague par du précis : chiffres exacts, délais, scènes, personnes, comparaisons. « 87 % en 14 jours » est plus crédible que « ça marche vite »."},{"t":"Sensory language (langage sensoriel)","d":"Des mots que le corps ressent (voir, entendre, toucher, sentir) pour faire vivre la scène au lieu de la décrire."},{"t":"Future pacing","d":"Faire vivre au lecteur, au présent et en détail, le moment précis où le résultat est là (samedi, 7 h 14, le chien qui court à la porte). Déclenche la dopamine avant l'achat."},{"t":"Borrowed experience (expérience empruntée)","d":"Même chose que le future pacing mais raconté à la première personne par quelqu'un d'autre (témoignage vécu). Le lecteur s'y projette."},{"t":"Damaging admission (aveu qui coûte)","d":"Avouer un vrai défaut (« ça prend 14 jours », « ce n'est pas le moins cher ») pour rendre tout le reste crédible."},{"t":"Takeaway / disqualification","d":"Dire à qui le produit n'est PAS destiné pour que les bons clients se reconnaissent et s'engagent (« si vous ne tiendrez pas 30 jours, gardez votre argent »)."},{"t":"Twist the knife (remuer le couteau)","d":"Appuyer sur la douleur. Autorisé pour un public inconscient ou qui banalise ; interdit sans promesse d'espoir pour un public qui souffre déjà (sinon il fuit : « freeze / run response »)."},{"t":"Pattern interrupt (rupture de schéma)","d":"Quelque chose d'inattendu dans le fil (visuel, phrase, angle) qui réveille le cerveau en mode « zombie scroll »."},{"t":"Loss aversion (aversion à la perte)","d":"Perdre 100 $ fait deux fois plus mal que gagner 100 $ fait plaisir (Kahneman). Les accroches sur ce qu'on perd battent celles sur ce qu'on gagne."},{"t":"Reptilian brain / System 1","d":"Le cerveau automatique qui scrolle : il ne lit pas les études, il réagit à la menace, la récompense, la nouveauté, « ça parle de moi ». Le copy s'adresse à lui."},{"t":"Buyer vs user (acheteur / utilisateur)","d":"Quand celui qui paie n'est pas celui qui utilise. Exemple du cours : la maman achète, l'ado utilise. On écrit à celui qui paie, on montre la douleur de celui qui utilise à travers ce qu'il observe."},{"t":"Nurturance (instinct de protection)","d":"L'émotion d'achat dominante quand on achète pour un être aimé. Centrale pour tout le marché animalier."},{"t":"6 émotions d'achat","d":"Relief (soulagement), Nurturance (protéger), Belonging (appartenir), Identity (redevenir soi), Security (sécurité, peur de perdre), Status (être admiré)."},{"t":"Parcours émotionnel","d":"Indifférence → Curiosité → Espoir → Conviction → Urgence. Chaque pièce de copy fait franchir une étape ; on ne saute pas à l'urgence sans conviction."},{"t":"Intensité émotionnelle","d":"Aiguë (ça brûle, décision rapide), chronique (on s'est habitué, il faut réactiver), aspirationnelle (ce serait bien, il faut créer l'urgence)."},{"t":"Advertorial","d":"Pub écrite comme un article ou un témoignage long (7 000 à 10 000 caractères). Format roi pour les publics conscients du problème qui ont besoin d'éducation."},{"t":"Listicle","d":"Page « 5 raisons pour lesquelles… ». Pour les publics déjà conscients du produit."},{"t":"Pre-sell page","d":"Page intermédiaire entre la pub et la page produit, qui éduque et ferme la boucle ouverte par la pub."},{"t":"VSL","d":"Video sales letter : longue vidéo de vente."},{"t":"UGC","d":"User generated content : vidéo façon « vrai client qui parle à la caméra ». Structure courte : hook, tension, shift, résultat, au passé et à la première personne."},{"t":"Ugly image ad","d":"Pub image volontairement brute (capture, photo iPhone) qui ne ressemble pas à une pub, avec un long texte à côté."},{"t":"Page-personnage","d":"Page Facebook qui ressemble à une personne ou un média plutôt qu'à une marque, pour que la pub paraisse native et crédible."},{"t":"Bibliothèque publicitaire Meta (Ad Library)","d":"Site public de Meta où l'on voit toutes les pubs actives d'une marque, leur date de lancement et leurs variantes. Outil n° 1 de veille."},{"t":"Hook fatigue","d":"Un hook qui a trop tourné devient un motif que le cerveau ignore (« I was skeptical at first… »). Cycle : innovation, adaptation, saturation, fatigue."},{"t":"Words that kill (mots qui tuent)","d":"Les formules usées qui crient « ceci est une pub » : game changer, life changing, amazing, just try it, clinically proven… On les remplace par une scène ou un chiffre."},{"t":"Claim","d":"Une promesse ou affirmation sur le produit. Schwartz : le copy s'assemble à partir des claims trouvés dans le produit lui-même."},{"t":"Proof stacking","d":"Empiler les preuves : chiffres, études, témoignages, avant/après, autorités, garantie."},{"t":"Premium / bonus","d":"Le cadeau offert avec la commande (guide PDF, 2e produit). Schwartz ne vendait rien sans premium."}],"killers":[{"re":"i was skeptical( at first)?","label":"I was skeptical at first","fix":"Montre le scepticisme : « I rolled my eyes when my sister sent me this. »"},{"re":"game[- ]?changer","label":"game changer","fix":"Dis ce qui a changé : « I slept seven hours for the first time in eight months. »"},{"re":"life[- ]?changing","label":"life changing","fix":"Montre le changement concret : « I don't plan my day around his belly anymore. »"},{"re":"\\bamazing\\b|\\bincredible\\b","label":"amazing / incredible","fix":"Remplace par un résultat précis : « Day 3, less scooting. Day 14, flat belly. »"},{"re":"can'?t believe (it|this) (actually )?work(s|ed)","label":"can't believe it actually works","fix":"Raconte le doute puis la preuve : « I almost returned it after a week. Week three… »"},{"re":"just try it|nothing to lose","label":"just try it / nothing to lose","fix":"Traite l'objection réelle : « You've been burned before. Here's why this is different, and here's your money back. »"},{"re":"best decision (i|we) (ever )?made","label":"best decision I ever made","fix":"« Wish I'd found this two years ago, I'd have saved $400 in vet visits. »"},{"re":"\\b(very|really|truly) \\w+","label":"very / really","fix":"Coupe l'adverbe. « It works » bat « it really works »."},{"re":"\\b(things|stuff)\\b","label":"things / stuff","fix":"Nomme-les : « bloating, scooting, grass eating ». "},{"re":"kind of|sort of","label":"kind of / sort of","fix":"Soit ça marche, soit non. Choisis."},{"re":"honestly|to be honest","label":"honestly / to be honest","fix":"Supprime : ça suggère que le reste ne l'était pas."},{"re":"i think|i feel like","label":"I think / I feel like","fix":"Affirme et prouve : « It works. Here's why. »"},{"re":"industry[- ]leading|best[- ]in[- ]class|world[- ]class|premium quality|cutting[- ]edge|revolutionary","label":"jargon corporate (industry leading, revolutionary…)","fix":"Parle comme un humain à un ami : « Here's what's in it and why. »"},{"re":"clinically proven|scientifically formulated","label":"clinically proven / scientifically formulated","fix":"Donne l'étude ou le chiffre, ou parle comme une personne : « tested on every batch by an outside lab »."},{"re":"doctors? don'?t want you to know|vets? (won'?t|don'?t want you to) (tell|know)","label":"doctors don't want you to know","fix":"Usé jusqu'à la corde (hook graveyard). Préfère une scène vécue : « my vet whispered… » ou un mécanisme."},{"re":"miracle|breakthrough","label":"miracle / breakthrough","fix":"Déclenche le scepticisme. Remplace par une promesse tenable et datée."},{"re":"works? instantly|overnight","label":"works instantly / overnight","fix":"Irréaliste pour un complément : donne la vraie timeline (jour 3, semaine 3)."},{"re":"100% guaranteed","label":"100% guaranteed to work","fix":"« 87 % voient un changement en 14 jours ; les autres sont remboursés. »"},{"re":"one weird trick|you won'?t believe","label":"one weird trick / you won't believe","fix":"Associé aux contenus poubelle. Préfère un moment micro-spécifique."},{"re":"the secret (to|is)|secret that","label":"the secret","fix":"Usé. Dis ce que c'est, ou raconte comment tu l'as découvert."}],"ads":[],"exerc const DATA_EN={"modules":[{"id":1,"title":"Market Intelligence (understanding the market)","desc":"Before writing a word: where the customer's head is (awareness) and how much the market has already heard it all (sophistication)."},{"id":2,"title":"Buyer Psychology (what makes people buy)","desc":"The 6 buying emotions, the emotional journey, pain or desire, buyer ≠ user, and the intensity to respect."},{"id":3,"title":"Copywriting Techniques (the writing tools)","desc":"Speaking their language, hunting words that kill, injecting specificity, open loops, bridges, senses, future pacing, rhythm, admissions and disqualification."},{"id":4,"title":"Hooks & Attention (stopping the scroll)","desc":"What happens in the brain in 0.5 seconds, the phrases that stop people, the first 3 lines, the mistakes that kill a hook."},{"id":5,"title":"Story & Drama (telling stories to sell)","desc":"The 3 story types, the short UGC structure, testimonials that ring true, the full 12-beat arc."},{"id":6,"title":"Zakaria at Evolve Marrakech + Eugene Schwartz","desc":"The talk that sums everything up (fear, specificity, mechanism, story, borrowed experience) and the working method of the master of copywriting."}],"lessons":[{"id":"l01","module":1,"num":"01","dur":"16 min","title":"The 5 awareness levels","body":"<p><b>The idea:</b> before you write, know where your prospect is mentally. If you talk \"product\" to someone who doesn't know they have a problem, you lose them; if you explain the problem to someone already comparing products, you bore them.</p>\n<ul>\n<li><b>Level 1, unaware</b> (\"I don't have a problem\"): they have symptoms but haven't labelled them. Your job: <b>mirror the symptoms</b>, then name the problem and its consequences. You can twist the knife. Course example: \"3 a.m., eyes wide open, soaked sheets… it's not stress, it's not age\" (menopause, unnamed). The biggest audience and the hardest to convert.</li>\n<li><b>Level 2, problem-aware</b> (\"I have a problem, I don't know what to do\"): validate, agitate a little, then <b>introduce a solution category</b>. \"Your daughter used to take 47 selfies to keep one; now she avoids the camera. Here's what's going on and what actually works.\"</li>\n<li><b>Level 3, solution-aware</b> (\"solutions exist, which one?\"): they've tried (glucosamine for 8 months, nothing). <b>Don't twist the knife</b>: they're already suffering, they'd flee (the \"freeze\" effect). Explain why the other solutions fail, then your <b>unique mechanism</b> + proof.</li>\n<li><b>Level 4, product-aware</b> (\"I know it, but why buy?\"): mid-funnel, retargeting. Handle objections, stack proof, guarantee, irresistible offer. \"You've had that tab open for 3 days… 47,000 moms have been where you are.\"</li>\n<li><b>Level 5, most aware</b> (\"I'm ready, give me a reason\"): get out of the way. Clear CTA, best offer, urgency. \"Your cart feels lonely. -40% until midnight.\"</li>\n</ul>\n<p><b>Traffic rule:</b> cold traffic = levels 1-3; warm = 3-4; retargeting = 4-5; email = 3-5. The biggest mistake: writing level 5 copy (\"-40%\") to level 2 people.</p>\n<blockquote>\"Talking to problem-aware people as if they were product-aware: you lost them. The reverse: you bore them.\" (around 00:33)</blockquote>"},{"id":"l02","module":1,"num":"02","dur":"10 min","title":"The 5 sophistication stages","body":"<p><b>The idea:</b> awareness is the customer's head; sophistication is how worn out the market is. A sophisticated market is immune to simple promises.</p>\n<ol>\n<li><b>Stage 1, virgin market</b>: a simple promise is enough (\"clear acne\"). Almost gone in DTC (direct-to-consumer online sales).</li>\n<li><b>Stage 2, second wave</b>: you enlarge the promise (speed, degree, scope): \"clear acne in 14 days, even stubborn hormonal acne, guaranteed\".</li>\n<li><b>Stage 3, skeptical market</b>: the promise isn't enough, you need a <b>mechanism</b>: \"it's not the bacteria, it's the inflammation underneath; this product targets the inflammatory cycle\". Menopause: \"your hypothalamus misreads temperature, estrogen doesn't fix that\". Most health/beauty markets are here or above.</li>\n<li><b>Stage 4, exhausted market</b>: every mechanism has been seen. Two options: <b>a new mechanism</b> (\"acne doesn't start on the skin but in the gut\") or <b>niche down</b> (\"not for everyone: for the 62-year-old woman who still wants to hike\", \"if you don't have PCOS, don't buy\").</li>\n<li><b>Stage 5, dead market</b>: no promise or mechanism gets through anymore (weight loss). What's left is <b>personality, story, identity</b>: \"I won't promise you clear skin. I had 11 years of acne… here's what happened for me\". Zakaria uses stage 5 techniques (story, admission, human connection) even in stage 3-4 markets.</li>\n</ol>\n<p><b>Where their avatars are:</b> teen acne stage 4, menopause stage 3-4, knees stage 3, PCOS hair stage 3 (the niche makes the market less sophisticated).</p>"},{"id":"l03","module":1,"num":"03","dur":"14 min","title":"Diagnosing your market's position","body":"<p><b>The idea:</b> you don't guess, you diagnose. Every market has an <b>awareness baseline</b> set by how old the problem is, how much advertising has already been seen, and what people discuss publicly. The traffic source doesn't change that baseline, it <b>shifts it upward</b>: cold = baseline, warm = baseline +1, retargeting = +1 to +2, email/brand search = level 5.</p>\n<ul>\n<li>Knees 55+: mature market, 20 years of glucosamine ads → baseline <b>level 3</b>. Even cold traffic is \"solution-aware\": it doesn't ask \"do I have a problem?\" but \"which one works?\".</li>\n<li>Menopause: baseline <b>level 2-3</b>, with a share of level 1 (unconnected symptoms). You can run two ads: one that educates the unaware, one that differentiates for the others.</li>\n<li>PCOS hair: <b>two levels at the same time</b>. Level 3 on hair loss (she's tried biotin, shampoos), level 1 on the cause (she doesn't know it's hormonal). Hence the formula: <b>acknowledge what she tried → explain why it failed → reveal the real cause → show that your solution targets it</b>. Wrong approach: \"Did you know women lose hair?\" (insulting) or \"try our serum\" (more of the same).</li>\n</ul>\n<p><b>Diagnosing sophistication:</b> read competitor ads running for 3-6 months (if an ad has run for 6 months, it works: which stage?), Amazon 3-star reviews (what they tried, what they doubt), Reddit and forums (what they believe, what they've been told).</p>\n<p><b>Classic mistakes:</b> believing cold traffic is always unaware; writing level 1 copy to a level 3 market (\"did you know knee pain affects millions?\"); believing every market has the same baseline; ignoring the baseline in the creatives.</p>\n<blockquote>Checklist before writing: how long has the problem existed? how much advertising has the market seen? what does the average person already know? which promises and mechanisms have already been made? Do I need a mechanism (stage 3)? a new mechanism or a niche (stage 4)?</blockquote>"},{"id":"l04","module":1,"num":"04","dur":"14 min","title":"The awareness × sophistication matrix","body":"<p><b>The idea:</b> the two axes cross, and each box dictates a strategy.</p>\n<ul>\n<li><b>Low awareness × low sophistication</b> (blue ocean): educate with simple promises. Almost nonexistent today.</li>\n<li><b>Low awareness × high sophistication</b> (the trap): the woman has hot flashes but hasn't said \"menopause\"; the menopause market, however, is saturated. Mistake: \"she's unaware, so I just need to educate\". As soon as you name her problem, she enters a sophisticated market, googles it, and buys from a competitor who has a mechanism. <b>You have to win the whole journey in a single piece</b>: recognised symptom → name the problem → immediate transition to the mechanism → proof → close before she compares.</li>\n<li><b>High awareness × low sophistication</b>: direct offer (\"you need X, we sell X\"). Rare, and competition arrives fast.</li>\n<li><b>High awareness × high sophistication</b> (the red ocean where most brands live): strong mechanism + stacked proof + story/personality + irresistible offer. Testimonials, studies and labels also protect you legally and let you scale.</li>\n</ul>\n<p>That's why the whole course insists on <b>mechanism creation, proof stacking, story and emotional connection</b>: that's what wins in a saturated market.</p>"},{"id":"l05","module":1,"num":"05","dur":"21 min","title":"Adapting copy to the market position (practice)","body":"<p><b>The idea:</b> same product, five different copies depending on the awareness level, and three depending on the sophistication stage.</p>\n<p><b>Same menopause supplement, 5 levels:</b> L1 pure symptoms without the word \"menopause\"; L2 name the problem (\"menopause is stealing your sleep, here's what to do\"); L3 acknowledge the attempts (black cohosh, HRT) and differentiate with the mechanism; L4 \"you've visited this page three times this week, here's what convinced 7,000 women\"; L5 \"-40%, delivery tomorrow\".</p>\n<p><b>Pain-intensity rule:</b></p>\n<ul>\n<li><b>Levels 1-2: twist the knife</b>, they don't feel the urgency. \"You tell yourself it's normal; in 6 months you won't be able to hide your part, in 12 months you'll be buying hairpieces.\"</li>\n<li><b>Level 3: acknowledge the pain briefly, offer relief right away.</b> Bad: \"your hairline is receding, your confidence goes with your hair\" (she scrolls to protect herself). Good: \"here's what actually works in 2026 for PCOS hair loss\". Course image: the friend at the casino who lost everything, you don't say \"I told you so\", you show them a way out.</li>\n<li><b>Levels 4-5: no pain</b>, just the reason to buy now.</li>\n</ul>\n<p><b>Same knee supplement, 3 stages:</b> stage 2 = bigger promise + proof + guarantee; stage 3 = mechanism (\"cartilage breaks down faster than it rebuilds because of 3 things: inflammation, dehydration, oxidative stress; we close the drain before filling the tub\"); stage 4 = new mechanism (\"the pain doesn't come from the cartilage but from the synovial fluid, we fix the oil, not the parts\") or a new avatar.</p>\n<blockquote>Checklist: for which traffic source? which level? which stage? does my hook match the level? my body the stage? do I have a mechanism (stage 3)? am I differentiated (stage 4)?</blockquote>"},{"id":"l06","module":2,"num":"06","dur":"22 min","title":"The 6 buying emotions","body":"<p><b>The idea:</b> we buy with emotion and justify with logic. Six universal emotions; your copy must aim at one or two hard, not six at half strength.</p>\n<ol>\n<li><b>Relief</b>: making the pain stop. The most powerful when there's chronic pain or shame. Copy: \"Imagine tomorrow morning, the first step out of bed without the pain.\" (sensory language).</li>\n<li><b>Nurturance (protecting)</b>: we do more for those we love than for ourselves. <b>Dominant whenever the buyer isn't the user</b>: parents, pet owners, children buying for their parents. \"You can't take her acne onto your own face, but you can give her this.\"</li>\n<li><b>Belonging</b>: exclusion hurts as much as physical pain. \"47,000 women know exactly what you're going through. You're not alone, you're one of us.\"</li>\n<li><b>Identity (being yourself again)</b>: \"you're not the girl with acne, it's just something that happened to your face\". Loss of identity through pain (the hiker who became \"the man with bad knees\").</li>\n<li><b>Security</b>: loss aversion, fear it gets worse. \"Every month you wait, follicles die and don't come back.\" Often placed right before the CTA.</li>\n<li><b>Status (being seen, respected)</b>: \"in 30 days you won't be invisible anymore\", \"the grandpa the grandkids want to show off\".</li>\n</ol>\n<p><b>Diagnosing the dominant emotion</b>: reread your avatar file and count the signals. Relief: \"I couldn't take it anymore\". Nurturance: \"watching her suffer\". Belonging: \"nobody understands\". Identity: \"I don't feel like myself\". Security: \"what if it gets worse\". Status: \"I can't take pictures\". Score each emotion out of 10, keep the 2-3 strongest.</p>"},{"id":"l07","module":2,"num":"07","dur":"9 min","title":"The emotional journey to purchase","body":"<p><b>The idea:</b> nobody goes from \"never heard of it\" to \"take my money\" in one step. Five steps, each with a trigger.</p>\n<ol>\n<li><b>Indifference</b> → you need a break: an image so precise they think \"that's me\" (\"this morning you sat on the edge of the bed for 30 seconds before you could get up. Nobody noticed. Your wife did.\").</li>\n<li><b>Curiosity</b> (\"tell me more\") → new information, a mechanism, an open loop (\"it's not your estrogen, it's your hypothalamus\").</li>\n<li><b>Hope</b> (\"this could work for me\") → a story of someone like them, a precise result, not a promise (\"Tommy, 65, ex-runner, did 3 miles on Saturday, first time in 4 years\"). Hope is fragile: over-promising kills it.</li>\n<li><b>Conviction</b> (\"this will work for me\") → volume of proof, objections handled, studies, guarantee.</li>\n<li><b>Urgency</b> (\"I have to do it now\") → real scarcity, cost of waiting, the problem getting worse.</li>\n</ol>\n<p><b>Where in the funnel:</b> the ad = indifference → curiosity → hope; the top of the landing page = hope → conviction; the bottom = conviction → urgency. Biggest mistake: jumping to urgency (\"-50% today\") without having built hope and conviction.</p>"},{"id":"l08","module":2,"num":"08","dur":"12 min","title":"Pain or desire: the two doors","body":"<p><b>The idea:</b> the 6 emotions are rooms; pain and desire are two doors into the same room. <b>Pain = moving away from</b> (\"stop waking up at 3 a.m. drenched\"); <b>desire = moving toward</b> (\"sleep through the night like you used to\"). Both lead to relief.</p>\n<ul>\n<li>Relief: stop the suffering / feel at peace. Nurturance: stop watching her suffer / give her the confidence she deserves. Identity: stop being the hopeless mom / be the mom who found the answer. Security: stop the threat / feel protected. Status: stop being overlooked / be respected. Belonging: stop hiding from photos / be in the picture, front row.</li>\n<li><b>When to lead with pain:</b> levels 1-2 (they ignore or downplay). <b>With desire:</b> level 3+ (they live the pain every day, they've already been burned, they need hope). Too much pain = flight; too much desire = daydreaming without action.</li>\n<li><b>The sequence that converts:</b> pain → hope → agitation → hope → stakes → close. Ratio by avatar: acne mom 60/40 pain, knees 50/50, menopause 40/60 desire, PCOS 50/50.</li>\n<li><b>Rule:</b> pain stops the scroll, desire makes them click.</li>\n</ul>\n<p>Pain signals in research: \"I can't stand\", \"I'm so tired of\", \"I've tried everything\". Desire signals: \"I wish I could\", \"I want to be again\", \"I dream of\".</p>"},{"id":"l09","module":2,"num":"09","dur":"11 min","title":"Buyer ≠ user: convincing two people","body":"<p><b>The idea:</b> the mom buys, the teen uses; the owner buys, the dog uses. Two psychologies. <b>You write to the one who pays, you show the pain of the one who uses.</b></p>\n<ul>\n<li><b>Teen acne:</b> the teen feels shame, social anxiety (\"everyone looks at me\"); the mom feels worry, guilt, helplessness (\"I hate seeing her like this\"). Hook for the mom: a scene SHE recognises (\"she used to walk through the door telling you about her day, now she heads straight to her room\").</li>\n<li><b>Dog with joint issues:</b> the user doesn't talk. Everything goes through what the owner <b>observes</b> (slow to get up, doesn't jump anymore), <b>guesses</b> (\"he can't tell you it hurts, but you know\"), <b>feels</b> (guilt, helplessness), <b>wants</b> (to see him run to the door again).</li>\n<li><b>6-block structure:</b> hook (symptom visible to the buyer) → user's pain seen by the buyer → buyer's emotion → bridge (\"there's something you can do\") → proof (stories of users like theirs) → CTA phrased as \"help\" (\"give him back his walks\").</li>\n<li><b>Mistakes:</b> writing only to the user (the teen has no credit card); writing only to the buyer without showing the suffering (no emotional fuel).</li>\n</ul>"},{"id":"l10","module":2,"num":"10","dur":"15 min","title":"Emotional intensity and timing","body":"<p><b>The idea:</b> match the tone to the avatar's temperature.</p>\n<ul>\n<li><b>Acute</b> (it burns right now): they're looking for a solution today, little price resistance. Short, direct copy, fast path to purchase: \"you've barely been able to walk for two days; it works in 7 days or your money back; start tonight\". Don't twist the knife: they're already intense.</li>\n<li><b>Chronic</b> (they got used to it): \"that's life\", they've lowered their expectations. Copy: <b>reactivate</b>, show them what they gave up (\"you don't hike anymore, you tell yourself it's fine, it's not: you just got used to less\").</li>\n<li><b>Aspirational</b> (it would be nice): no pain, high price resistance, slow decision, 2 to 3 times more touchpoints. You have to <b>create</b> the urgency: the slippery slope (\"compare with your photo from 5 years ago\"), the point of no return (\"a dead follicle doesn't come back\"), the hidden cost (\"how long does your makeup take every morning?\"), the future self (\"at 50, version A or version B\"), anticipated regret, the small investment versus the big result.</li>\n</ul>\n<p><b>Shifting intensity:</b> from chronic to acute (\"three years like this, and three more?\"), from aspirational to chronic then acute. Mistakes: \"urgency\" copy on an aspirational audience (it sounds fake); limp copy (\"you might see improvement over time\") on an acute audience.</p>"},{"id":"l11","module":3,"num":"11","dur":"8 min","title":"Foundation: speaking their language","body":"<p><b>The idea:</b> this isn't a technique, it's the base. If your avatar is 58 and you write like a 24-year-old TikToker, they scroll. <b>Voice match = trust.</b></p>\n<ul>\n<li><b>Vocabulary:</b> knees 55+ say \"my knees are shot\", \"bone on bone\", not \"joint optimization\". The acne mom says \"her face is broken out\", not \"dermatological intervention\".</li>\n<li><b>Sentence length:</b> professionals = long sentences; teens = short, not necessarily complete; seniors = clear, no jargon; stressed mom = straight to the point.</li>\n<li><b>Formality:</b> menopause 45-60 = relaxed but respectful (neither clinical nor \"girl, the hot flashes are not it\"); PCOS 20-30 = loose (\"you're 26 and you can see your scalp, what the f…\").</li>\n<li><b>Emotional temperature:</b> frustrated → empathetic, not cheerful; skeptical → honest, not salesy.</li>\n</ul>\n<p>The right voice makes any UGC creator credible, even an average one, because the script sounds like the person. The wrong voice (AI jargon, corporate) makes even a good actor sound fake. Everything comes from the avatar file: comments, reviews, calls.</p>"},{"id":"l12","module":3,"num":"12","dur":"9 min","title":"The words that kill conversion","body":"<p><b>The idea:</b> some phrases trigger \"this is an ad\" and the wall goes up.</p>\n<ul>\n<li><b>Worn-out phrases:</b> \"I was skeptical at first\", \"game changer\", \"life changing\", \"this product is amazing\", \"I can't believe it actually works\", \"just try it / nothing to lose\", \"best decision I ever made\". The remedy is always the same: <b>show instead of naming</b>. \"Game changer\" → \"I slept seven hours for the first time in eight months\". \"Skeptical\" → \"I rolled my eyes when my sister sent me this\". \"Just try it\" → handle the real objection (\"you've been burned before, here's why this is different, here's your money back\").</li>\n<li><b>Weak words to cut:</b> very, really, just, things, stuff, kind of, sort of, honestly, to be honest, I think, I feel like.</li>\n<li><b>Corporate jargon</b> (OK on a product page or in the mouth of an authority, never in a testimonial): industry leading, best in class, clinically proven, scientifically formulated, premium, world class. Human: \"here's what's in it and why\".</li>\n<li><b>Skepticism triggers</b> (they worked in 2010): doctors don't want you to know, the secret, miracle, breakthrough, works instantly, 100% guaranteed, lose 13 pounds in 13 days, one weird trick, you won't believe.</li>\n</ul>\n<blockquote>The decisive test: does it sound like every ad in the category? Could you swap the product name for a competitor's? Would a real person say that? If yes, rewrite.</blockquote>"},{"id":"l13","module":3,"num":"13","dur":"9 min","title":"Specificity injection (technique number 1)","body":"<p><b>The idea:</b> vague = unbelievable, forgettable, ignorable. Precise = credible, memorable, convincing. The brain uses precision as a shortcut to truth: \"why would they say 87% and not 90?\".</p>\n<p><b>7 ways to be specific:</b></p>\n<ol>\n<li><b>Numbers</b>: \"47,342 customers as of last Tuesday\"; \"12.7 pounds in 8 weeks\".</li>\n<li><b>Time</b>: \"day 9\", \"I've had acne since I was 13, I'm 28, that's 15 years\".</li>\n<li><b>Sensory</b>: \"that sharp stabbing pain when you first stand up\", \"no more bumps when you run your fingers across your cheeks\".</li>\n<li><b>Scenario</b>: \"imagine your daughter asking for a photo together and you say yes without checking your angle\".</li>\n<li><b>Person</b>: \"Michelle, 47, Ohio, two teenagers, tried Proactiv, Differin, a dermatologist\".</li>\n<li><b>Process</b>: \"most supplements lubricate the joint; we target the inflammation that destroys the cartilage\".</li>\n<li><b>Comparison</b>: \"biotin alone: 23% saw improvement; our formula: 87%\".</li>\n</ol>\n<p><b>Week-by-week timeline</b> = the most convincing form: \"week 1 active breakouts calm down 40%, week 2 new breakouts drop 70%, week 3 clear stretches, week 4 the moment in the mirror\".</p>\n<p><b>Rules:</b> never make it up (if you don't have the data, go get it); don't over-specify (\"23.7% in 14.3 days\" sounds forced); back every number.</p>"},{"id":"l14","module":3,"num":"14","dur":"17 min","title":"Open loops: keeping attention","body":"<p><b>The idea:</b> the hook catches, the loop holds. An open loop = an incomplete thought; the brain hates it and keeps going to close it (Zeigarnik effect: we remember unfinished tasks better, like the comeback you should have made, three hours later).</p>\n<p><b>Weak vs strong:</b> \"I'll tell you more\" (weak) versus \"what she found in her husband's search history changed everything, but it wasn't what you think\" (strong: precise, unexpected, charged).</p>\n<p><b>Types of loops:</b></p>\n<ul>\n<li><b>\"What they don't want you to know\"</b> (enemy): \"there's a reason Proactiv doesn't work for most teens, and the company knows it\".</li>\n<li><b>Story interrupt</b>: you start a story and cut it at the peak (\"her husband knocked: 'I found something. You're not going to believe where.' I'll tell you in a minute, but first…\").</li>\n<li><b>Contradiction</b>: \"everything you've been told about knee pain is wrong, and what you do every day thinking it helps is making it worse\".</li>\n<li><b>The numbers don't add up</b>: \"number 1 for 15 years, and only 12% of PCOS women benefit; follow the money\".</li>\n<li><b>\"Before I tell you\"</b>: delaying the answer with necessary context (\"if I just gave you the name, you'd Google it, read a 2019 blog and give up\").</li>\n<li><b>Stacked loops</b>: \"three things are destroying your knees: the first is obvious, the second will surprise you, the third your doctor does by accident\".</li>\n</ul>\n<p><b>Where:</b> in the first 3 lines, before each explanatory section (to relaunch the energy), before the ask, at section transitions; the ad opens, the landing page closes and reopens.</p>\n<p><b>Rules:</b> always close (otherwise it's betrayal), the answer must be worth the wait, max 4 active loops, the detour must be interesting in itself.</p>"},{"id":"l15","module":3,"num":"15","dur":"8 min","title":"Bucket brigades and transitions","body":"<p><b>The idea:</b> every sentence is a decision (\"do I keep going?\"). Bucket brigades decide for the reader: they create momentum.</p>\n<ul>\n<li><b>Continuation:</b> But here's the thing. Here's why this matters. And that's not all. It gets better. Let me explain.</li>\n<li><b>Contradiction:</b> But. However. Here's the catch. Not exactly.</li>\n<li><b>Revelation:</b> Here's the truth. The real reason. What nobody tells you. In other words.</li>\n<li><b>Question:</b> So what does this mean for you? Sound familiar? See where I'm going with this?</li>\n<li><b>Story:</b> Picture this. Imagine. Let me give you an example.</li>\n<li><b>Urgency:</b> Here's the kicker. The bottom line. Here's what it comes down to.</li>\n</ul>\n<p><b>Before / after:</b> \"Glucosamine is a popular supplement. Studies show mixed results. This is because…\" (flat) versus \"You've probably tried glucosamine. Here's the thing: some swear by it, others feel nothing. So what's going on? The answer might surprise you… But here's what nobody tells you… And this is where it gets interesting.\" (momentum).</p>\n<p><b>Where:</b> after the hook, between paragraphs, before a key point, after a dense explanation (\"OK, that's a lot. Here's the simple version\"), before the CTA. <b>Not every sentence</b>: at transitions and energy drops, roughly every 3-5 paragraphs. Vary them, and match them to the avatar's tone (\"listen up y'all\" doesn't work for a 65-year-old professional).</p>"},{"id":"l16","module":3,"num":"16","dur":"11 min","title":"Sensory language: making them feel it","body":"<p><b>The idea:</b> a statement can be argued with, an experience is felt. When you read \"that sharp stabbing pain when you first stand up\", your brain activates the pain area. Sensory language bypasses skepticism.</p>\n<ul>\n<li><b>Sight:</b> \"look at your part: those tiny hairs at your hairline weren't there eig
