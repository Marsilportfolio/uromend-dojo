"everything your customer reads is copywriting.\""},{"t":"Avatar / persona","d":"A precise portrait of the ideal customer: age, situation, the words they use, daily pains, what they have already tried."},{"t":"Avatar deep dive","d":"The research file on the avatar (Amazon reviews, Reddit, Facebook groups, customer calls). Every good hook comes from there, not from imagination."},{"t":"Awareness levels","d":"The 5 mental states of a prospect (Eugene Schwartz): 1 unaware of the problem, 2 problem-aware, 3 solution-aware, 4 product-aware, 5 most aware (ready to buy)."},{"t":"Market sophistication","d":"How much the market has already heard it all: 1 virgin (a simple promise is enough), 2 bigger promises, 3 you need a mechanism, 4 new mechanism or niche, 5 only identity, personality and story still work."},{"t":"Unique mechanism","d":"The simple explanation of WHY the product works where others fail. Course example: \"it's not the bacteria, it's the inflammation underneath\"."},{"t":"Root cause","d":"The real origin of the problem, often different from what the customer believes. Course example: PCOS hair loss isn't a hair problem, it's hormonal."},{"t":"Hook","d":"The first 1 to 3 seconds or lines. Its only job: get the next line read (Schwartz). It must pass the \"is this for me?\" filter in half a second."},{"t":"Hook rate","d":"Share of people who watch at least the first 3 seconds of a video. Measures the quality of the hook."},{"t":"Hold rate","d":"Share of people who keep watching after the hook. Measures the quality of the body: open loops, rhythm, story."},{"t":"CTR","d":"Click-through rate: share of people who click on the ad."},{"t":"CPA / ROAS","d":"CPA: cost per acquisition (cost per purchase). ROAS: return on ad spend, revenue divided by ad spend."},{"t":"Open loop","d":"A thought left incomplete that forces the reader to keep going (\"what I found on page 4 of the Google results…\"). Max 4 active loops, and always close them."},{"t":"Bucket brigade","d":"Short bridge phrases that push the reader to the next sentence: \"Here's the thing\", \"But here's what nobody tells you\", \"Sound familiar?\"."},{"t":"Specificity injection","d":"Replacing vague with precise: exact numbers, timeframes, scenes, people, comparisons. \"87% in 14 days\" is more believable than \"it works fast\"."},{"t":"Sensory language","d":"Words the body can feel (see, hear, touch, smell) so the reader lives the scene instead of reading a description of it."},{"t":"Future pacing","d":"Making the reader live, in the present tense and in detail, the exact moment when the result is there (Saturday, 7:14 a.m., the dog running to the door). Triggers dopamine before the purchase."},{"t":"Borrowed experience","d":"Same as future pacing but told in the first person by someone else (a lived testimonial). The reader projects into it."},{"t":"Damaging admission","d":"Admitting a real flaw (\"it takes 14 days\", \"it's not the cheapest\") so that everything else becomes believable."},{"t":"Takeaway / disqualification","d":"Saying who the product is NOT for, so the right customers recognise themselves and commit (\"if you won't do 30 days, keep your money\")."},{"t":"Twist the knife","d":"Pressing on the pain. Allowed for an audience that is unaware or that downplays the problem; forbidden without a promise of hope for an audience already suffering (otherwise they flee: the \"freeze / run response\")."},{"t":"Pattern interrupt","d":"Something unexpected in the feed (visual, sentence, angle) that wakes up a brain in \"zombie scroll\" mode."},{"t":"Loss aversion","d":"Losing $100 hurts twice as much as gaining $100 feels good (Kahneman). Hooks about what you lose beat hooks about what you gain."},{"t":"Reptilian brain / System 1","d":"The automatic brain that scrolls: it does not read studies, it reacts to threat, reward, novelty, \"this is about me\". Copy speaks to it."},{"t":"Buyer vs user","d":"When the person who pays is not the person who uses. Course example: the mom buys, the teen uses. You write to the one who pays and show the pain of the one who uses, through what they observe."},{"t":"Nurturance","d":"The dominant buying emotion when you buy for a loved one: the instinct to protect. Central to the whole pet market."},{"t":"6 buying emotions","d":"Relief, Nurturance (protect), Belonging, Identity (be yourself again), Security (fear of loss), Status (be admired)."},{"t":"Emotional journey","d":"Indifference → Curiosity → Hope → Conviction → Urgency. Each piece of copy moves the reader one step; you never jump to urgency without conviction."},{"t":"Emotional intensity","d":"Acute (it burns, fast decision), chronic (they got used to it, you have to reactivate), aspirational (it would be nice, you have to create urgency)."},{"t":"Advertorial","d":"An ad written like an article or a long testimonial (7,000 to 10,000 characters). The king format for problem-aware audiences that need education."},{"t":"Listicle","d":"A \"5 reasons why…\" page. For audiences already aware of the product."},{"t":"Pre-sell page","d":"A page between the ad and the product page that educates and closes the loop the ad opened."},{"t":"VSL","d":"Video sales letter: a long selling video."},{"t":"UGC","d":"User generated content: a video in the style of a \"real customer talking to the camera\". Short structure: hook, tension, shift, result, in the past tense and first person."},{"t":"Ugly image ad","d":"A deliberately raw image ad (screenshot, iPhone photo) that does not look like an ad, with a long text next to it."},{"t":"Persona page","d":"A Facebook page that looks like a person or a media outlet rather than a brand, so the ad feels native and credible."},{"t":"Meta Ad Library","d":"Meta's public site where you can see every active ad of a brand, its launch date and its variants. Competitive-research tool number one."},{"t":"Hook fatigue","d":"A hook that has run too much becomes a pattern the brain ignores (\"I was skeptical at first…\"). Cycle: innovation, adaptation, saturation, fatigue."},{"t":"Words that kill","d":"The worn-out phrases that scream \"this is an ad\": game changer, life changing, amazing, just try it, clinically proven… You replace them with a scene or a number."},{"t":"Claim","d":"A promise or statement about the product. Schwartz: copy is assembled from the claims found in the product itself."},{"t":"Proof stacking","d":"Piling up proof: numbers, studies, testimonials, before/after, authorities, guarantee."},{"t":"Premium / bonus","d":"The gift that comes with the order (PDF guide, second product). Schwartz never sold anything without a premium."}],"killers":[{"re":"i was skeptical( at first)?","label":"I was skeptical at first","fix":"Show the skepticism: \"I rolled my eyes when my sister sent me this.\""},{"re":"game[- ]?changer","label":"game changer","fix":"Say what changed: \"I slept seven hours for the first time in eight months.\""},{"re":"life[- ]?changing","label":"life changing","fix":"Show the concrete change: \"I don't plan my day around his belly anymore.\""},{"re":"\\bamazing\\b|\\bincredible\\b","label":"amazing / incredible","fix":"Replace with a precise result: \"Day 3, less scooting. Day 14, flat belly.\""},{"re":"can'?t believe (it|this) (actually )?work(s|ed)","label":"can't believe it actually works","fix":"Tell the doubt then the proof: \"I almost returned it after a week. Week three…\""},{"re":"just try it|nothing to lose","label":"just try it / nothing to lose","fix":"Handle the real objection: \"You've been burned before. Here's why this is different, and here's your money back.\""},{"re":"best decision (i|we) (ever )?made","label":"best decision I ever made","fix":"\"Wish I'd found this two years ago, I'd have saved $400 in vet visits.\""},{"re":"\\b(very|really|truly) \\w+","label":"very / really","fix":"Cut the adverb. \"It works\" beats \"it really works\"."},{"re":"\\b(things|stuff)\\b","label":"things / stuff","fix":"Name them: \"bloating, scooting, grass eating\". "},{"re":"kind of|sort of","label":"kind of / sort of","fix":"Either it works or it doesn't. Pick one."},{"re":"honestly|to be honest","label":"honestly / to be honest","fix":"Delete it: it suggests the rest wasn't."},{"re":"i think|i feel like","label":"I think / I feel like","fix":"State it and prove it: \"It works. Here's why.\""},{"re":"industry[- ]leading|best[- ]in[- ]class|world[- ]class|premium quality|cutting[- ]edge|revolutionary","label":"corporate jargon (industry leading, revolutionary…)","fix":"Talk like a human to a friend: \"Here's what's in it and why.\""},{"re":"clinically proven|scientifically formulated","label":"clinically proven / scientifically formulated","fix":"Give the study or the number, or talk like a person: \"tested on every batch by an outside lab\"."},{"re":"doctors? don'?t want you to know|vets? (won'?t|don'?t want you to) (tell|know)","label":"doctors don't want you to know","fix":"Worn to the bone (hook graveyard). Prefer a lived scene: \"my vet whispered…\" or a mechanism."},{"re":"miracle|breakthrough","label":"miracle / breakthrough","fix":"Triggers skepticism. Replace with a keepable, dated promise."},{"re":"works? instantly|overnight","label":"works instantly / overnight","fix":"Unrealistic for a supplement: give the real timeline (day 3, week 3)."},{"re":"100% guaranteed","label":"100% guaranteed to work","fix":"\"87% see a change in 14 days; the others get their money back.\""},{"re":"one weird trick|you won'?t believe","label":"one weird trick / you won't believe","fix":"Associated with junk content. Prefer a micro-specific moment."},{"re":"the secret (to|is)|secret that","label":"the secret","fix":"Worn out. Say what it is, or tell how you discovered it."}],"ads":[],"exercises":[],"brand":{"html":"","products":[]}};

/* Fusion de deux progressions Dojo, sans jamais rien perdre.
   Même code dans le jeu (navigateur) et dans le script du Google Sheet (Apps Script). Ne pas y mettre de dépendance. */
function pbMerge(a, b) {
  a = a || {}; b = b || {};
  const out = {};
  const isObj = x => x && typeof x === "object" && !Array.isArray(x);
  const union = (x, y) => Object.assign({}, isObj(x) ? x : {}, isObj(y) ? y : {});
  // XP : on garde le plus haut (jamais de double compte, jamais de retour à zéro)
  out.xp = Math.max(+a.xp || 0, +b.xp || 0);
  // Jours joués : union triée. Série : celle du côté qui a joué le plus récemment.
  const days = Array.from(new Set([].concat(a.days || [], b.days || []))).sort();
  out.days = days;
  const la = a.lastDay || "", lb = b.lastDay || "";
  out.lastDay = la > lb ? la : lb || null;
  // La série se recalcule depuis les jours joués (jours consécutifs jusqu'au dernier jour), pour qu'un appareil neuf ne la remette pas à 1.
  let run = days.length ? 1 : 0;
  for (let i = days.length - 1; i > 0; i--) { const d1 = new Date(days[i] + "T00:00:00Z"), d0 = new Date(days[i - 1] + "T00:00:00Z"); if (Math.round((d1 - d0) / 86400000) === 1) run++; else break; }
  const sa = la === out.lastDay ? (a.streak || 0) : 0, sb = lb === out.lastDay ? (b.streak || 0) : 0;
  out.streak = Math.max(run, sa, sb);
  // Leçons lues et labo : union (on garde la date la plus ancienne)
  ["lessons", "labo"].forEach(k => {
    const r = union(a[k], b[k]);
    const x = isObj(a[k]) ? a[k] : {}, y = isObj(b[k]) ? b[k] : {};
    Object.keys(r).forEach(id => { if (x[id] && y[id] && x[id].at && y[id].at) r[id] = Object.assign({}, x[id], y[id], { at: x[id].at < y[id].at ? x[id].at : y[id].at }); });
    out[k] = r;
  });
  // Quiz : union, et une bonne réponse l'emporte sur une mauvaise
  const qa = isObj(a.quiz) ? a.quiz : {}, qb = isObj(b.quiz) ? b.quiz : {};
  out.quiz = union(qa, qb);
  Object.keys(out.quiz).forEach(id => { if (qa[id] && qb[id]) out.quiz[id] = qa[id].ok && !qb[id].ok ? qa[id] : qb[id].ok && !qa[id].ok ? qb[id] : ((qa[id].at || "") >= (qb[id].at || "") ? qa[id] : qb[id]); });
  // Cartes : celle qui a le plus de révisions l'emporte (à égalité : le palier le plus haut)
  const ca = isObj(a.cards) ? a.cards : {}, cb = isObj(b.cards) ? b.cards : {};
  out.cards = union(ca, cb);
  Object.keys(out.cards).forEach(id => {
    if (ca[id] && cb[id]) { const x = ca[id], y = cb[id]; out.cards[id] = (x.seen || 0) !== (y.seen || 0) ? ((x.seen || 0) > (y.seen || 0) ? x : y) : ((x.lvl || 0) >= (y.lvl || 0) ? x : y); }
  });
  // Atelier : union, le texte le plus long l'emporte (c'est le plus travaillé)
  const ea = isObj(a.atelier) ? a.atelier : {}, eb = isObj(b.atelier) ? b.atelier : {};
  out.atelier = union(ea, eb);
  Object.keys(out.atelier).forEach(id => { if (ea[id] && eb[id]) out.atelier[id] = ((ea[id].text || "").length >= (eb[id].text || "").length) ? ea[id] : eb[id]; });
  // Badges : union
  out.badges = Array.from(new Set([].concat(a.badges || [], b.badges || [])));
  out.version = Math.max(+a.version || 1, +b.version || 1);
  return out;
}
if (typeof module !== "undefined") module.exports = { pbMerge };

const SYNC_URL="https://script.google.com/macros/s/AKfycbzpfzWZ3R93R2bMQ3qjt9Oxl3JIbve3_S8FpKoZVy4WXIt4sHapxf7562UpxcW6wygE/exec"; // vide = pas de synchro cloud (la progression reste dans ce navigateur)
const cloud={state:SYNC_URL?"idle":"off",at:null};
const canon=o=>Array.isArray(o)?o.map(canon):(o&&typeof o==="object"?Object.keys(o).sort().reduce((r,k)=>(r[k]=canon(o[k]),r),{}):o);
const sameState=(a,b)=>JSON.stringify(canon(a))===JSON.stringify(canon(b));
function setS(next){S=Object.assign({},DEFAULT,next);try{localStorage.setItem(KEY(),JSON.stringify(S));}catch(e){}}
function typing(){const a=document.activeElement;return !!a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT");}
let dbDoc=null,saveTimer=null,cloudTimer=null,cloudBusy=false,cloudAgain=false;
function save(){try{localStorage.setItem(KEY(),JSON.stringify(S));}catch(e){}
  if(dbDoc){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{dbDoc.set({state:S,updated:new Date().toISOString()}).catch(()=>{});},800);}
  if(SYNC_URL&&PROFILE){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSync(true),1500);}
  updateBadges();}
async function cloudCall(body){const r=await fetch(SYNC_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});const j=await r.json();if(!j||!j.ok)throw new Error((j&&j.error)||"cloud");return j;}
async function cloudSync(quiet){if(!SYNC_URL||!PROFILE)return;if(cloudBusy){cloudAgain=true;return;}cloudBusy=true;const who=PROFILE;
  try{cloud.state="sync";const j=await cloudCall({action:"set",profile:who,state:S});if(who!==PROFILE)return;
    const m=pbMerge(S,j.state);cloud.state="ok";cloud.at=Date.now();
    if(!sameState(m,S)){setS(m);if(!typing())render();if(!quiet)toast(t("synced"));}
  }catch(e){cloud.state="err";}
  finally{cloudBusy=false;if(cloudAgain){cloudAgain=false;setTimeout(()=>cloudSync(true),300);}}}
function cloudLabel(){if(!SYNC_URL)return t("cloudOff");if(cloud.state==="err")return t("cloudErr");if(cloud.state==="ok")return t("cloudOn");return t("cloudWait");}
async function connectDb(){try{if(!window.claude||!window.claude.use)return;const db=await claude.use("db");const user=await claude.use("user");if(!db||!user)return;const id=await user.id();if(!id)return;
  dbDoc=db.doc("data/users/"+id+"/progress_"+(PROFILE||"").replace(/\s+/g,"_"));const snap=await dbDoc.get();
  if(snap.exists&&snap.data()&&snap.data().state){const m=pbMerge(S,snap.data().state);if(!sameState(m,S)){setS(m);if(!typing())render();toast(t("synced"));}dbDoc.set({state:m,updated:new Date().toISOString()}).catch(()=>{});}
  else{dbDoc.set({state:S,updated:new Date().toISOString()}).catch(()=>{});}
  }catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&PROFILE)cloudSync(true);});
function touchDay(){const td=today();if(S.lastDay!==td){const y=new Date(Date.now()-DAY).toISOString().slice(0,10);S.streak=(S.lastDay===y)?S.streak+1:1;S.lastDay=td;if(!S.days.includes(td))S.days.push(td);}}
function addXp(n,why){touchDay();S.xp+=n;save();toast("+"+n+" XP"+(why?" · "+why:""));checkBadges();}
function level(){return Math.floor(Math.sqrt(S.xp/40))+1;}
function levelName(){const l=level();return t("levels")[Math.min(l-1,6)];}
function nextLevelXp(){const l=level();return 40*l*l;}

/* ---------- Cards: spaced repetition ---------- */
function cardState(id){return S.cards[id]||{lvl:0,due:null,seen:0,ok:0};}
function dueCards(){const now=Date.now();const rev=DATA.cards.filter(c=>{const st=cardState(c.id);return st.due&&new Date(st.due).getTime()<=now;});const fresh=DATA.cards.filter(c=>!cardState(c.id).due);const readIds=Object.keys(S.lessons);const prio=fresh.filter(c=>c.tag!=="__none__"&&readIds.length>0).concat(fresh.filter(c=>c.tag==="__none__"));return rev.concat((readIds.length?prio:fresh).slice(0,15));} // 15 new cards max per day
function rateCard(id,grade){ // 0 again, 1 hard, 2 good, 3 easy
  const st=cardState(id);st.seen++;
  if(grade===0){st.lvl=0;}else if(grade===1){st.lvl=Math.max(0,st.lvl);}else if(grade===2){st.lvl=Math.min(INTERVALS.length-1,st.lvl+1);st.ok++;}else{st.lvl=Math.min(INTERVALS.length-1,st.lvl+2);st.ok++;}
  const days=grade===0?0:(grade===1?Math.max(1,Math.round(INTERVALS[st.lvl]/2)):INTERVALS[st.lvl]);
  const due=new Date(Date.now()+(days===0?600000:days*DAY));st.due=due.toISOString();
  S.cards[id]=st;save();return days;}
function nextDays(id,grade){const st=cardState(id);let lvl=st.lvl;if(grade===0)return 0;if(grade===1)return Math.max(1,Math.round(INTERVALS[lvl]/2));lvl=Math.min(INTERVALS.length-1,lvl+(grade===2?1:2));return INTERVALS[lvl];}

 $("#missionBtn").onclick=()=>mission.go();
}
function pickMission(){
 const due=dueCards().length;
 if(due>0)return {title:t("mCards",due),text:t("mCardsT"),cta:t("mCardsC"),go:()=>go("cartes")};
 const next=DATA.lessons.find(l=>!(S.lessons[l.id]&&S.lessons[l.id].read));
 if(next)return {title:t("mNext")+next.title,text:t("mNextT"),cta:t("mNextC"),go:()=>go("cours",next.id)};
 const ad=DATA.ads.find(a=>!S.labo[a.id]);
 if(ad)return {title:t("mAd"),text:t("mAdT"),cta:t("mAdC"),go:()=>go("labo",ad.id)};
 return {title:t("mQuiz"),text:t("mQuizT"),cta:t("mQuizC"),go:()=>go("quiz")};
}

function cours(v){
 if(sub){return lesson(v,DATA.lessons.find(l=>l.id===sub));}
 v.innerHTML=`<div><div class="eyebrow">${t("coursEyebrow")}</div><h1>${t("coursT")}</h1><p style="color:var(--fg2)">${t("coursP")}</p></div>`+
  DATA.modules.map(m=>`<div class="card"><div class="moduleTag">${t("module")} ${m.id}</div><h2>${esc(m.title)}</h2><p style="color:var(--fg2);margin:4px 0 12px">${esc(m.desc)}</p><div class="list">${DATA.lessons.filter(l=>l.module===m.id).map(l=>`<button class="item" data-lesson="${l.id}"><span class="moduleTag">${esc(l.num)}</span><span class="t">${esc(l.title)}</span><span class="m">${esc(l.dur)}</span>${S.lessons[l.id]&&S.lessons[l.id].read?'<span class="done">✓</span>':""}</button>`).join("")}</div></div>`).join("");
 v.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>go("cours",b.dataset.lesson));
}
function lesson(v,l){
 if(!l){go("cours");return;}
 const m=DATA.modules.find(x=>x.id===l.module);
 const idx=DATA.lessons.indexOf(l),prev=DATA.lessons[idx-1],next=DATA.lessons[idx+1];
 const qs=DATA.quiz.filter(q=>q.lesson===l.id).slice(0,3);
 v.innerHTML=`<div class="row"><button class="btn small" data-go="cours">${t("back")}</button><span class="moduleTag">${t("module")} ${m.id} · ${esc(m.title)} · ${esc(l.num)} · ${esc(l.dur)}</span></div>
 <h1>${esc(l.title)}</h1>
 <div class="card prose">${l.body}</div>
 ${l.brandNote?`<div class="card prose"><div class="eyebrow">${t("forPB")}</div>${l.brandNote}</div>`:""}
 ${qs.length?`<div class="card"><div class="eyebrow">${t("anchor")}</div><div id="miniquiz" class="list" style="margin-top:10px"></div></div>`:""}
 <div class="row" style="justify-content:space-between"><div>${prev?`<button class="btn small" id="prevL">← ${esc(prev.title)}</button>`:""}</div><div>${next?`<button class="btn small" id="nextL">${esc(next.title)} →</button>`:""}</div></div>`;
 if(prev)$("#prevL").onclick=()=>go("cours",prev.id);if(next)$("#nextL").onclick=()=>go("cours",next.id);
 if(!(S.lessons[l.id]&&S.lessons[l.id].read)){S.lessons[l.id]={read:true,at:today()};addXp(15,t("lessonRead"));}
 if(qs.length)mountQuiz($("#miniquiz"),qs,{small:true});
}

/* ---------- Quiz ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function quiz(v){
 v.innerHTML=`<div><div class="eyebrow">${t("arena")}</div><h1>${t("quizT")}</h1><p style="color:var(--fg2)">${t("quizP")}</p></div>
 <div class="card"><div class="row"><label for="qmod" class="sr-only">Module</label><select id="qmod" style="max-width:360px"><option value="all">${t("allModules")}</option>${DATA.modules.map(m=>`<option value="${m.id}">${esc(m.title)}</option>`).join("")}</select><button class="btn primary" id="startQ">${t("start")}</button></div><p style="color:var(--fg2);font-size:.85rem;margin-top:8px">${t("seen")} : ${Object.keys(S.quiz).length}/${DATA.quiz.length} · ${t("firstTry")} : ${Object.values(S.quiz).filter(q=>q.ok).length}</p></div>
 <div id="qarea"></div>`;
 $("#startQ").onclick=()=>{const mod=$("#qmod").value;let pool=DATA.quiz.filter(q=>mod==="all"||(mod==="pb"?q.tag==="pb":q.module==mod));
  const weak=pool.filter(q=>S.quiz[q.id]&&!S.quiz[q.id].ok),fresh=pool.filter(q=>!S.quiz[q.id]),rest=pool.filter(q=>S.quiz[q.id]&&S.quiz[q.id].ok);
  const pick=shuffle(weak).slice(0,4).concat(shuffle(fresh)).concat(shuffle(rest)).slice(0,10);
  mountQuiz($("#qarea"),shuffle(pick),{});};
}
function mountQuiz(el,qs,opt){
 let i=0,score=0;
 function step(){
  if(i>=qs.length){el.innerHTML=`<div class="card"><h2>${t("done")} : ${score}/${qs.length}</h2><p style="color:var(--fg2);margin-top:6px">${score===qs.length?t("perfect"):score>=qs.length/2?t("good"):t("again")}</p>${opt.small?"":`<div class="row" style="margin-top:10px"><button class="btn primary" id="again">${t("tenMore")}</button></div>`}</div>`;if(!opt.small)$("#again",el).onclick=()=>quiz($("#view"));return;}
  const q=qs[i];const choices=q.type==="tf"?[t("true_"),t("false_")]:q.choices;
  const order=q.type==="tf"?[0,1]:shuffle(choices.map((_,k)=>k));
  el.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><span class="eyebrow">${t("question")} ${i+1}/${qs.length}</span><span class="pill">${esc(q.tag==="pb"?"":(DATA.modules.find(m=>m.id==q.module)||{}).title||"")}</span></div>
   ${q.context?`<div class="adtext" style="margin-top:10px;max-height:220px">${esc(q.context)}</div>`:""}
   <h3 style="margin:12px 0">${esc(q.q)}</h3><div class="choices">${order.map(k=>`<button class="choice" data-k="${k}">${esc(choices[k])}</button>`).join("")}</div><div id="exp"></div></div>`;
  el.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k,ok=k===q.a;el.querySelectorAll(".choice").forEach(c=>{c.disabled=true;if(+c.dataset.k===q.a)c.classList.add("ok");});if(!ok)b.classList.add("ko");
   if(ok)score++;const first=!S.quiz[q.id];S.quiz[q.id]={ok:ok,at:today()};if(ok)addXp(first?10:4,t("rightAnswer"));else{touchDay();save();}
   $("#exp",el).innerHTML=`<div class="explain" style="margin-top:12px"><b>${ok?t("right"):t("wrong")}</b> ${esc(q.exp)}</div><div class="row" style="margin-top:10px"><button class="btn primary" id="nextQ">${i+1<qs.length?t("next"):t("seeScore")}</button></div>`;
   $("#nextQ",el).onclick=()=>{i++;step();};});
 }
 step();
}

/* ---------- Cards ---------- */
function cartes(v){
 const due=dueCards();const total=DATA.cards.length;const mastered=DATA.cards.filter(c=>cardState(c.id).lvl>=5).length;const started=Object.keys(S.cards).length;
 v.innerHTML=`<div><div class="eyebrow">${t("srEyebrow")}</div><h1>${t("cardsT")}</h1><p style="color:var(--fg2)">${t("cardsP")}</p></div>
 <div class="grid"><div class="card stat"><span class="n">${due.length}</span><span class="l">${t("dueNow")}</span></div><div class="card stat"><span class="n">${started}/${total}</span><span class="l">${t("started")}</span></div><div class="card stat"><span class="n">${mastered}</span><span class="l">${t("mastered")}</span></div></div>
 <div class="card"><div class="eyebrow">${t("steps")}</div><div class="timeline" style="margin-top:8px">${INTERVALS.slice(1).map((d,k)=>`<div><b>${d} ${t("days")}</b>${t("step")} ${k+1}</div>`).join("")}</div></div>
 <div id="deck"></div>`;
 const deck=$("#deck");
 let queue=shuffle(due);
 if(!queue.length){const nxt=DATA.cards.map(c=>cardState(c.id).due).filter(Boolean).sort()[0];deck.innerHTML=`<div class="card"><h3>${t("nothingDue")}</h3><p style="color:var(--fg2);margin-top:6px">${nxt?t("nextCard")+new Date(nxt).toLocaleDateString(t("locale"),{weekday:"long",day:"numeric",month:"long"})+".":t("noCards")}</p><div class="row" style="margin-top:10px"><button class="btn" id="extra">${t("extra")}</button></div></div>`;$("#extra").onclick=()=>{queue=shuffle(DATA.cards).slice(0,10);showCard();};return;}
 showCard();
 function showCard(){
  if(!queue.length){deck.innerHTML=`<div class="card"><h3>${t("sessionDone")}</h3><p style="color:var(--fg2);margin-top:6px">${t("comeBack")}</p></div>`;checkBadges();return;}
  const c=queue[0];const st=cardState(c.id);
  deck.innerHTML=`<div class="row" style="justify-content:space-between"><span class="eyebrow">${t("left",queue.length)}</span><span class="pill">${esc(c.tag||"")}</span><span class="pill aqua">${t("step")} ${st.lvl}</span></div>
   <div class="flash" style="margin-top:10px"><div class="face" id="face"><div class="eyebrow">${t("qLabel")}</div><div>${c.q}</div></div></div>
   <div class="row" style="margin-top:10px;justify-content:center"><button class="btn primary" id="flip">${t("flip")}</button></div><div id="rate"></div>`;
  $("#flip").onclick=()=>{$("#face").className="face back";$("#face").innerHTML=`<div class="eyebrow">${t("aLabel")}</div><div>${c.a}</div>`;$("#flip").hidden=true;
   $("#rate").innerHTML=`<div class="rate" style="margin-top:12px"><button class="r0" data-g="0">${t("rAgain")}<small>${t("r10min")}</small></button><button class="r1" data-g="1">${t("rHard")}<small>${nextDays(c.id,1)} ${t("days")}</small></button><button class="r2" data-g="2">${t("rGood")}<small>${nextDays(c.id,2)} ${t("days")}</small></button><button class="r3" data-g="3">${t("rEasy")}<small>${nextDays(c.id,3)} ${t("days")}</small></button></div>`;
   $("#rate").querySelectorAll("button").forEach(b=>b.onclick=()=>{const g=+b.dataset.g;rateCard(c.id,g);if(g>=2)addXp(g===3?3:5,t("card"));else{touchDay();save();}queue.shift();if(g===0)queue.push(c);showCard();});};
 }
}

/* ---------- Lab (unused) ---------- */
function labo(v){
 if(sub){return adView(v,DATA.ads.find(a=>a.id===sub));}
 const b=DATA.brand;
 v.innerHTML=`<div><div class="eyebrow">${t("laboEyebrow")}</div><h1>${t("laboT")}</h1><p style="color:var(--fg2)">${t("laboP")}</p></div>
 <div class="card prose">${b.html}</div>
 <div class="card"><div class="eyebrow">${t("products")}</div><div class="list" style="margin-top:10px">${b.products.map(p=>`<div class="layer"><button data-toggle>${esc(p.name)} <span>${esc(p.tag)}</span></button><div hidden class="prose">${p.html}</div></div>`).join("")}</div></div>
 <div class="card"><div class="eyebrow">${t("realAds")}</div><p style="color:var(--fg2);font-size:.9rem;margin:6px 0 10px">${t("adsAnnotated",DATA.ads.length)}</p><div class="list">${DATA.ads.map(a=>`<button class="item" data-ad="${a.id}"><span class="pill ${false?"gold":"aqua"}">${esc(a.product)}</span><span class="t">${esc(a.title)}</span><span class="m">${esc(a.format)}</span>${S.labo[a.id]?'<span class="done">✓</span>':""}</button>`).join("")}</div></div>`;
 v.querySelectorAll("[data-ad]").forEach(x=>x.onclick=()=>go("labo",x.dataset.ad));
 wireToggles(v);
}
function wireToggles(v){v.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{const d=b.nextElementSibling;d.hidden=!d.hidden;});}
function adView(v,a){
 if(!a){go("labo");return;}
 const done=S.labo[a.id];
 v.innerHTML=`<div class="row"><button class="btn small" data-go="labo">${t("backLab")}</button><span class="pill ${false?"gold":"aqua"}">${esc(a.product)}</span><span class="moduleTag">${esc(a.format)} · ${esc(a.date)} · ID ${esc(a.id)}</span></div>
 <h1>${esc(a.title)}</h1>
 <div class="card"><div class="eyebrow">${a.transcript?t("transcript"):t("adText")}</div><div class="adtext" id="adtext" style="margin-top:8px">${esc(a.text)}</div><div class="row" style="margin-top:8px"><button class="btn small" id="moreT">${t("showAll")}</button><a class="btn small" href="https://www.facebook.com/ads/library/?id=${esc(a.id)}" target="_blank" rel="noopener">${t("viewLib")}</a></div></div>
 <div class="card" id="guess"><div class="eyebrow">${t("youFirst")}</div><p style="margin:6px 0 12px">${t("youFirstP")}</p><div class="list" id="gq"></div></div>
 <div class="card"><div class="eyebrow">${t("keyT")}</div><div class="list" style="margin-top:10px">${a.layers.map(L=>`<div class="layer"><button data-toggle>${esc(L.t)} <span>▾</span></button><div hidden class="prose">${L.html}</div></div>`).join("")}</div></div>
 ${a.lesson?`<div class="card prose"><div class="eyebrow">${t("adLesson")}</div>${a.lesson}</div>`:""}`;
 $("#moreT").onclick=()=>{$("#adtext").classList.toggle("open");$("#moreT").textContent=$("#adtext").classList.contains("open")?t("collapse"):t("showAll");};
 wireToggles(v);
 const gq=$("#gq");const qs=a.guess||[];
 if(!qs.length||done){gq.innerHTML=`<p style="color:var(--fg2)">${done?t("alreadyDone"):t("noGuess")}</p>`;}
 else{mountQuiz(gq,qs.map((q,k)=>Object.assign({id:"labo_"+a.id+"_"+k,tag:"pb",module:0},q)),{small:true});}
 if(!done){S.labo[a.id]={at:today()};save();checkBadges();}
}

/* ---------- Workshop ---------- */
function atelier(v){
 v.innerHTML=`<div><div class="eyebrow">${t("atelierEyebrow")}</div><h1>${t("atelierT")}</h1><p style="color:var(--fg2)">${t("atelierP")}</p></div>
 <div class="card"><div class="eyebrow">${t("killerT")}</div><p style="color:var(--fg2);font-size:.9rem;margin:6px 0 10px">${t("killerP")}</p><label class="sr-only" for="killIn">${t("killerLabel")}</label><textarea id="killIn" placeholder="I was skeptical at first, but this product is a game changer..."></textarea><div class="row" style="margin-top:8px"><button class="btn aqua" id="killBtn">${t("analyse")}</button></div><div id="killOut" style="margin-top:10px"></div></div>
 ${DATA.exercises.map(ex=>{const lk=lvlKey(ex.level);return `<div class="card"><div class="row" style="justify-content:space-between"><span class="pill ${lk==="easy"?"good":lk==="medium"?"gold":"bad"}">${esc(t("lvl")[lk]||ex.level)}</span>${S.atelier[ex.id]?`<span class="pill good">${t("doneTag")}</span>`:""}</div><h2 style="margin-top:8px">${esc(ex.title)}</h2><div class="prose" style="margin-top:8px">${ex.brief}</div><label class="sr-only" for="ex_${ex.id}">${t("yourAnswer")}</label><textarea id="ex_${ex.id}" style="margin-top:10px" placeholder="${esc(t("writeHere"))}">${esc((S.atelier[ex.id]||{}).text||"")}</textarea><div class="layer" style="margin-top:10px"><button data-toggle>${t("grid")} <span>▾</span></button><div hidden><div class="list">${ex.check.map((c,k)=>`<label class="row" style="gap:8px"><input type="checkbox" data-ex="${ex.id}" data-k="${k}" ${(S.atelier[ex.id]||{}).checks&&S.atelier[ex.id].checks[k]?"checked":""}> ${esc(c)}</label>`).join("")}</div></div></div><div class="layer" style="margin-top:8px"><button data-toggle>${t("model")} <span>▾</span></button><div hidden class="prose">${ex.model}</div></div><div class="row" style="margin-top:10px"><button class="btn primary" data-save="${ex.id}">${t("saveEx")}</button></div></div>`;}).join("")}`;
 wireToggles(v);
 $("#killBtn").onclick=()=>{const txt=$("#killIn").value;if(!txt.trim())return;let hits=0;let html=esc(txt);DATA.killers.forEach(k=>{const re=new RegExp(k.re,"gi");if(re.test(html)){hits++;html=html.replace(new RegExp(k.re,"gi"),m=>`<mark class="kill" title="${esc(k.fix)}">${m}</mark>`);}});
  $("#killOut").innerHTML=`<div class="explain" style="white-space:pre-wrap">${html}</div><p style="margin-top:8px;color:var(--fg2);font-size:.9rem">${hits?t("killerHits",hits):t("killerNone")}</p>${hits?`<ul style="margin:6px 0 0 18px;font-size:.9rem">${DATA.killers.filter(k=>new RegExp(k.re,"i").test(txt)).map(k=>`<li><b>${esc(k.label)}</b> → ${esc(k.fix)}</li>`).join("")}</ul>`:""}`;};
 v.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{const id=b.dataset.save;const text=$("#ex_"+id).value;const checks=[...v.querySelectorAll(`input[data-ex="${id}"]`)].map(c=>c.checked);const first=!S.atelier[id];S.atelier[id]={text,checks,at:today()};if(first&&text.trim().length>40)addXp(20,t("exercise"));else{save();toast(t("saved"));}});
}

/* ---------- Glossary + backup ---------- */
function glossaire(v){
 v.innerHTML=`<div><div class="eyebrow">${t("glosEyebrow")}</div><h1>${t("glosT")}</h1><p style="color:var(--fg2)">${t("glosP")}</p></div>
 <div class="card"><dl class="glos">${DATA.glossary.map(g=>`<dt>${esc(g.t)}</dt><dd>${g.d}</dd>`).join("")}</dl></div>
 <div class="card"><div class="eyebrow">${t("backup")}</div><p style="color:var(--fg2);font-size:.9rem;margin:6px 0 10px">${t("backupP")}</p><label class="sr-only" for="bk">${t("backupCode")}</label><textarea id="bk" style="min-height:80px;font-family:var(--mono);font-size:.75rem"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="bkOut">${t("genCode")}</button><button class="btn" id="bkCopy">${t("copy")}</button><button class="btn aqua" id="bkIn">${t("importCode")}</button><button class="btn" id="bkReset">${t("reset")}</button></div><p style="margin-top:8px;color:var(--fg2);font-size:.85rem">${cloudLabel()}</p><p id="bkMsg" style="margin-top:8px;color:var(--fg2);font-size:.85rem"></p></div>`;
 $("#bkOut").onclick=()=>{$("#bk").value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));};
 $("#bkCopy").onclick=()=>{const c=$("#bk").value||btoa(unescape(encodeURIComponent(JSON.stringify(S))));$("#bk").value=c;navigator.clipboard.writeText(c).then(()=>toast(t("copied"))).catch(()=>{$("#bk").select();toast(t("selected"));});};
 $("#bkIn").onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($("#bk").value.trim()))));if(!o||typeof o.xp!=="number")throw 0;setS(pbMerge(S,o));save();render();toast(t("imported"));}catch(e){$("#bkMsg").textContent=t("invalid");}};
 let armed=false;$("#bkReset").onclick=()=>{if(!armed){armed=true;$("#bkReset").textContent=t("confirmReset");$("#bkReset").classList.add("primary");return;}(async()=>{if(SYNC_URL){try{await cloudCall({action:"reset",profile:PROFILE});}catch(e){$("#bkMsg").textContent=t("cloudErr");return;}}S=JSON.parse(JSON.stringify(DEFAULT));save();render();toast(t("resetDone"));})();};
}

/* ---------- Utilities ---------- */
let toastT;function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2200);}
const h=location.hash.replace("#","");if(PAGES.some(p=>p.id===h))page=h;
render();if(PROFILE){touchDay();save();connectDb();cloudSync(false);}
})();
</script>
</body></html>
