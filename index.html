ht weeks ago\".</li>\n<li><b>Touch</b> (the most intimate): \"run your fingers across your cheek, no bumps, no rough patches, smooth like someone else's skin\".</li>\n<li><b>Sound</b> (often forgotten): \"no more crunching, your knees are silent on the stairs\", \"the alarm, not the hot flash, wakes you\".</li>\n<li><b>Taste, smell</b> when relevant: \"he sniffs and walks away? Not with this. He hears the bag and he's there.\"</li>\n<li><b>Inner sensations:</b> \"that knot in your stomach when someone pulls out a phone… gone\".</li>\n</ul>\n<p><b>Converting an abstract benefit:</b> ask \"what will they see? what will they feel? what will they hear? what will stop happening? which precise moment will be different?\". \"Better sleep\" → \"the clock says 6 a.m., the sheets are dry, you're confused because you don't remember waking up\".</p>\n<p><b>The mini-movie:</b> setting (Saturday morning, 7 a.m., the grandkids outside) → sensory details → contrast with before (\"you don't grab the nightstand\") → emotion → resolution (\"you're in the yard with them, not watching anymore\").</p>"},{"id":"l17","module":3,"num":"17","dur":"10 min","title":"Future pacing: living the result before buying","body":"<p><b>The idea:</b> when we vividly imagine a future, the brain lives it (same areas, same dopamine). Once the reader has \"already\" felt the transformation, not buying feels like losing something they own.</p>\n<p><b>Dopamine triggers to aim for:</b> victory, relief, love/connection, pride, positive surprise, regaining control. Weak: \"you'll feel better\". Strong: 2-3 triggers + vivid details.</p>\n<p><b>The ingredients of good future pacing (the \"mini-movie\"):</b></p>\n<ul>\n<li>A <b>precise moment</b>: \"7:14 a.m. on a Saturday\", not \"someday\".</li>\n<li>A <b>sensory trigger</b>: the laugh coming from the bathroom, the dry t-shirt, the hair tie wrapped twice instead of four times.</li>\n<li><b>A witness</b>: the daughter crying on the porch, the husband asking \"what are you doing differently?\". External validation = dopamine.</li>\n<li>An <b>inner realisation</b>: \"wait, that's it?\", \"you forgot what this feels like\".</li>\n<li>An <b>emotional peak</b> you let breathe.</li>\n<li>The <b>\"new normal\" framing</b>: \"this isn't a miracle, this is just Tuesday\".</li>\n</ul>\n<p><b>The physical test:</b> read it out loud. If your heart rate doesn't change, if you don't smile, if your eyes don't sting, it isn't strong enough. Placement: right before the CTA.</p>"},{"id":"l18","module":3,"num":"18","dur":"8 min","title":"Rhythm and flow: the music of copy","body":"<p><b>The idea:</b> good copy has music. Short sentences = punches (key points, emotional peaks, pauses after a long block). Long sentences = momentum (painting a picture, telling, explaining). All short = robot; all long = breathless.</p>\n<p><b>The mix:</b> long (accumulated frustration: \"the glucosamine, the turmeric, the injections, the stretches from YouTube, the cream from Amazon…\") → short (\"Nothing worked.\") → short (\"I'm going to tell you why.\") → medium (mechanism) → short (CTA). Like a slide (Sugarman's \"slippery slide\"): every element pushes toward the next.</p>\n<p><b>Tools:</b> fragments (\"Not anymore. Until now.\"), <b>rule of three</b> (\"no pain, no stiffness, no hesitation\"), <b>parallelism</b> (\"you've tried the products, you've seen the doctors, you've read the articles\"), <b>rising intensity</b> (\"it works. It works fast. It works fast and lasts.\").</p>\n<blockquote>Ultimate test: read out loud (or record yourself). Where you run out of breath, it's too long; where it's choppy, too short; where you get bored, a loop is missing.</blockquote>"},{"id":"l19","module":3,"num":"19","dur":"14 min","title":"The damaging admission","body":"<p><b>The idea:</b> saying something bad about your product, on purpose, makes everything else believable. Everyone expects 100% positive; when you admit a flaw, the brain concludes \"they're honest, so the rest is true\". Avis: \"We're number two. We try harder.\" Buckley's: \"It tastes awful. And it works.\" Listerine: \"the taste you hate, twice a day\".</p>\n<p><b>Types of admissions:</b></p>\n<ul>\n<li><b>Limit:</b> \"this isn't magic, it takes 14 days; if you want overnight, this isn't for you\".</li>\n<li><b>Inconvenience:</b> \"it's not cheap\", \"you have to take it every day, miss a week and you slow your progress\", \"it smells like medicine, not a gummy\".</li>\n<li><b>Who it's not for:</b> \"if your doctor said bone on bone, see a surgeon first\".</li>\n<li><b>Price:</b> \"$79, because we use the clinical-grade form: 87% absorbed vs 15% for the CVS bottle\".</li>\n<li><b>Past failures:</b> \"version one flopped, 40% results; version three, 87%\".</li>\n<li><b>It doesn't work for everyone:</b> \"30% don't respond; for the 87% who do… and the guarantee tells you which group you're in\".</li>\n</ul>\n<p><b>Formula:</b> admission + pivot (\"it takes 14 days BECAUSE it repairs instead of masking\"). <b>The \"it relieves but doesn't cure\" case:</b> if nothing on the market cures, honestly sell the relief (\"it won't make menopause disappear, but it makes it bearable\"): fewer refunds, more loyalty, and you're the only honest one in a crowd of \"cures\".</p>\n<p><b>Rules:</b> a real flaw, not a fake one (\"our only flaw is that we work too well\"); a flaw that doesn't destroy the value proposition; one or two per piece, not ten.</p>"},{"id":"l20","module":3,"num":"20","dur":"7 min","title":"Takeaway and disqualification","body":"<p><b>The idea:</b> push away to attract. Say \"this isn't for you if…\" and the right customers want to prove they're the right ones. Reverse psychology + scarcity (\"only for people who…\") + trust (a seller who says \"this isn't for you\" seems honest) + filter (fewer bad customers, fewer refunds).</p>\n<ul>\n<li><b>Disqualifiers:</b> \"don't buy this if you want overnight results / won't take it daily / have structural damage\".</li>\n<li><b>Exclusivity frame:</b> \"this is for the mom who has tried everything and is ready to try one more thing. If you're looking for the cheapest option, this isn't it.\"</li>\n<li><b>Honest warning:</b> \"for the first 4-6 weeks you may see nothing. Most people quit. If you can commit to 90 days, the results are worth it.\"</li>\n<li><b>Price as a filter:</b> \"$79 a month. Walmart has a $12 bottle. It probably won't work, but it's $12. This isn't for people who want cheap.\"</li>\n</ul>\n<p><b>Structure:</b> who it's not for → why → who it's for → \"if that's you, keep reading; if not, I just saved you $79\".</p>"},{"id":"l21","module":4,"num":"21","dur":"31 min","title":"The psychology of attention: why we stop (or don't)","body":"<p><b>The idea:</b> you're not competing against other ads, but against the ex, the stories, the cat, the kids, 10,000 messages. Attention is the scarcest resource: you <b>steal</b> it, you don't earn it.</p>\n<p><b>What happens in 0.5 seconds:</b> 0-100 ms detection (something new); 100-300 ms the amygdala sorts <b>threat / reward / ignore</b> (unconscious); 300-500 ms the cortex asks \"<b>is this for me?</b>\"; 500 ms conscious decision. Most ads die before 300 ms. Your hook speaks to the reptilian brain, not to logic.</p>\n<p><b>The reptilian brain responds to:</b> threat (\"this ingredient is destroying your joints\"), opportunity (\"I dropped my keys and picked them up without thinking\"), novelty/unexpected, <b>self</b> (\"women over 50\", my name, my tribe), contrast (\"from four hot flashes to zero\"), strong emotion (faces, tears, laughter).</p>\n<p><b>Scrolling is a trance:</b> 1.7 s per piece of content, 3 pieces per second, less than 5% processed consciously. You break the trance with visual contrast, direct relevance, pattern interrupt (PetLab's 3D), an emotional spike, an open loop.</p>\n<p><b>Hierarchy of triggers:</b> 5 <b>survival</b> (\"this could kill your dog\", 100%) > 4 <b>pain/fear of loss</b> (95%) > 3 <b>identity</b> (85%) > 2 <b>opportunity/desire</b> (70%) > 1 <b>curiosity/novelty</b> (50%). Loss aversion beats gain. If you use a level 1 when a level 4 is possible, you leave attention on the table.</p>\n<p><b>\"Is this for me?\"</b> passes if the hook touches: their demographics, their exact situation, their identity, their pain, their desire, their enemy, or their past failures.</p>\n<p><b>The equation:</b> attention = (relevance × emotion × novelty) / effort. \"Revolutionary joint supplement\" = 3×1×1/2 = 1.5 (scroll). \"Still can't get off the floor without holding onto something\" = 9×7×6/1 = 378 (stop).</p>\n<p><b>Hook fatigue:</b> a hook that works gets copied, saturated, then associated with junk content (\"I was skeptical at first\", \"doctors don't want you to know\", \"one weird trick\"). Remedies: specificity (impossible to copy), stealing from outside your industry, the micro-specific (\"that thing where you throw off the covers, then pull them back, then throw them off again\"), stories (infinite), being first rather than perfect.</p>\n<blockquote>Test before publishing: does it hit the reptilian brain? does it pass \"is this for me?\"? does it use the highest level possible? does it create an emotion? does it open a loop? effort close to zero? does it not look like an ad?</blockquote>"},{"id":"l22","module":4,"num":"22","dur":"27 min","title":"The phrases that stop the scroll (trigger phrases)","body":"<p><b>The idea:</b> our brain is wired for four things: social threats (betrayal, argument, secret), survival threats (hospital, scam, losing everything), forbidden information (\"I'm not supposed to share this\"), and unfinished stories. Plus gossip: other people's drama is irresistible.</p>\n<p><b>10 categories of phrases:</b></p>\n<ol>\n<li><b>Relationship gossip:</b> \"my husband thought I was cheating\", \"my sister stopped talking to me\", \"my best friend called me crying\".</li>\n<li><b>Caught / exposed:</b> \"I almost got caught\", \"my doctor noticed\", \"it showed up on the test\".</li>\n<li><b>Secret / forbidden:</b> \"I'm not supposed to share this\", \"my doctor whispered\", \"I signed an NDA, but…\", \"they don't want you to know\" (worn out, careful).</li>\n<li><b>Scam / betrayal:</b> \"I got scammed\", \"it was all fake\", \"I ignored the red flags\".</li>\n<li><b>Medical emergency:</b> \"my doctor called me personally\", \"I was rushed to the hospital\", \"I was misdiagnosed for years\".</li>\n<li><b>Financial crisis:</b> \"I lost everything\", \"I was drowning in debt\".</li>\n<li><b>Confession:</b> \"I have to confess\", \"I've been hiding something\", \"I was the problem\".</li>\n<li><b>Discovery:</b> \"I just found out\", \"turns out\", \"that's when it clicked\".</li>\n<li><b>Conflict with authority:</b> \"my doctor was wrong\", \"I went against my doctor's advice\", \"they called me crazy\".</li>\n<li><b>Transformation:</b> \"that was six months ago\", \"people don't recognize me\".</li>\n</ol>\n<p><b>Formula:</b> trigger phrase + your topic + qualification + loop. \"My husband thought I was faking it. After three years of complaining about my knees, he finally saw me try to get off the floor. That look on his face. That's when I knew I had to find something that actually worked.\"</p>\n<p><b>Rules:</b> the story must be true or based on real customers; no bait-and-switch (\"my husband thought I was cheating\" must lead to the menopause symptoms that explain the suspicion); aim for hook rate AND hold rate AND conversion, not just shock.</p>"},{"id":"l23","module":4,"num":"23","dur":"16 min","title":"The first 3 lines: locking them in","body":"<p><b>The idea:</b> the hook stops them, the next 3 lines keep them. Each line has a job: <b>line 1 stops</b> (pattern interrupt), <b>line 2 anchors</b> (\"yes, this is for you\", qualification), <b>line 3 opens a loop</b> (tension only resolved by reading on).</p>\n<p><b>5 formulas:</b></p>\n<ol>\n<li><b>Pain → validation → way out:</b> \"3 a.m. Drenched again. / You're not crazy and you're not broken: your hypothalamus is misfiring. / And there's a way to stop it your doctor never mentioned.\"</li>\n<li><b>Story in medias res → tension → stop before resolution:</b> \"I dropped my keys yesterday. / Looked at them for 10 seconds. / Then kicked them to the couch because I couldn't bend down. That was the moment I knew something had to change.\"</li>\n<li><b>Question → reversal → promise:</b> \"When was the last time your daughter smiled in a photo? / The problem isn't her skin. It's what she's been putting on it. / I'll show you the three things that are making it worse.\"</li>\n<li><b>Contradiction → proof → stacking:</b> \"Biotin is useless for PCOS hair loss. / So is minoxidil. So is 99% of what your doctor said. / Here's why, and what 47,000 women did instead.\"</li>\n<li><b>Transformation → contrast → teaser:</b> \"Last night I slept seven hours straight. / Three weeks ago I was waking up four times a night. / One thing changed, and it wasn't hormones.\"</li>\n</ol>\n<p><b>Mistakes:</b> starting with the product (\"our luxury supplement uses…\"); too fast (\"I'm going to show you the amazing story of…\"); generic (\"knee pain affects millions\"); closing the loop too early; fake hook (\"this will blow your mind\").</p>"},{"id":"l24","module":4,"num":"24","dur":"29 min","title":"The hook mistakes that kill attention","body":"<p><b>The idea:</b> ten ways to botch the hook, and therefore everything else.</p>\n<ol>\n<li><b>Clickbait without payoff:</b> \"you won't believe what I found in my garage\" then a supplement. The hook must be <b>connected</b> to the message (e.g. the ball shot at the camera: great hook rate, zero hold rate).</li>\n<li><b>Over-promising:</b> \"eliminate knee pain forever in 24 hours\" triggers skepticism, and behind it, refunds, chargebacks, cancelled subscriptions. If your model needs 3 months of retention, your promises and your proof must talk about 3 months. Prefer \"87% see significant improvement in 14 days\" and above all more proof, demo, community.</li>\n<li><b>Boring / expected:</b> \"are you suffering from knee pain? joint supplement, natural ingredients\". The brain predicts, so it ignores. Unexpected: \"I go downstairs sideways now\".</li>\n<li><b>Starting with the product</b> when the avatar isn't level 4-5: \"introducing JointFlex Pro with 12 clinical studies\" means nothing to them. Start with them: \"my grandson ran toward me at the park and I flinched\".</li>\n<li><b>Too vague:</b> \"feel better naturally\", \"change your life today\": no self-identification, no curiosity, no specificity. A hook that fits every product sells no product.</li>\n<li><b>Too clever:</b> puns (\"knee-d a solution?\") take cognitive effort; in zombie mode, zero effort available. <b>Clarity always beats cleverness.</b></li>\n<li><b>Closing the loop in the hook:</b> \"glucosamine supplement reduces inflammation\": everything is said, nothing to discover. Open: \"why glucosamine didn't work for you and what will\".</li>\n<li><b>Wrong tone for the platform:</b> Facebook = conversational, email = personal, VSL = intimate, advertorial = journalistic.</li>\n<li><b>Targeting everyone:</b> \"anyone can benefit from better joint health\" = nobody feels called. Narrow it: \"for people over 55 who tried glucosamine and it did nothing\".</li>\n<li><b>False urgency:</b> \"page taken down in 24 hours\", \"only 3 left\": everyone sees through it. Real urgency stated simply, or better, the <b>cost of waiting</b> (\"every week you wait is another week of bad sleep\").</li>\n</ol>\n<p><b>Also important:</b> the creator must look like the avatar (a tired 50-year-old woman in her bedroom, not a 20-year-old girl) and the hook must be understood without sound (visual + text + audio).</p>\n<p>A good hook rate also gives the rest of the message a chance to be tested: hook OK + bad hold = loop problem; hold OK + no purchases = mechanism or proof problem.</p>"},{"id":"l25","module":5,"num":"25","dur":"8 min","title":"The 3 types of stories that convert","body":"<p><b>The idea:</b> every selling story boils down to three types.</p>\n<ol>\n<li><b>The origin story</b> (why it exists): the founder/discoverer. Structure: I had the same problem → I tried everything → the discovery → the breakthrough → the mission (often against an industry). Example: \"I'm a retired orthopedic surgeon. For 30 years I told patients to take glucosamine. Then my own knees failed… the real solution was buried in a 1987 Japanese study.\" Establishes credibility, the enemy, the guide (not the hero). For VSL, advertorial, launch. Careful: stay credible/legal (you're not a surgeon).</li>\n<li><b>The customer story</b> (someone like you): before → breaking point → discovery → skepticism → trial → result → now. \"3 a.m. soaked again, third time tonight. My husband moved to the guest room… Found this in a Facebook group at 3 a.m. Didn't believe it. Ordered anyway. Six weeks later I slept through, husband's back in our bed. I feel human again.\" For UGC, testimonials, emails, social proof.</li>\n<li><b>The moment story</b> (one scene that says it all): not the journey, a sensory snapshot. Before: \"I kicked my keys toward the couch. Couldn't bend down. My 6-year-old asked why I was playing soccer inside.\" After: \"my grandson sprinted at me at the park. I didn't flinch. I squatted, scooped him up, spun him. He laughed. I almost cried.\" For hooks, 15-30 s UGC, image ads, email subject lines.</li>\n</ol>\n<p><b>Combining:</b> open on a moment → develop into a customer story → bring in the origin (credible mechanism) → close on a future moment (future pacing).</p>"},{"id":"l26","module":5,"num":"26","dur":"21 min","title":"Structure of a short UGC story","body":"<p><b>The idea:</b> in 15 to 60 seconds, no time for a full arc, but it must stay a story (not \"buy my product\"). Four beats:</p>\n<ol>\n<li><b>Hook (2-5 s):</b> a precise moment, pattern interrupt: \"my hairdresser asked if I was sick\", \"3 a.m., soaked. Third time this week.\"</li>\n<li><b>Tension (5-20 s):</b> the lived problem, <b>in the past tense</b> (\"I was averaging four hours of sleep, my husband started sleeping in the guest room, my doctor said that's menopause, accept it\"). Past tense because the viewer, living it in the present, thinks \"she had it too, what changed?\". You don't scare: you create <b>relatability</b>. People scroll to escape their life, not to have it thrown in their face.</li>\n<li><b>Shift (3-10 s):</b> what changed: \"my sister sent me this thing. I didn't believe it. I'd tried everything. I was desperate so I tried it anyway.\"</li>\n<li><b>Result (5-25 s):</b> the avatar's exact desire, no more no less, in sensory terms: \"six weeks in, last night I slept seven hours straight. Woke up dry. Before my alarm. I'd forgotten what rested feels like. My husband's back in our bed.\"</li>\n</ol>\n<p><b>Rules:</b> past tense, first person, spoken language (incomplete sentences OK), specific details (3 a.m., not \"middle of the night\"), emotion shown (\"I sat in the car and cried\") not named, creator who looks like the avatar. Everything comes from avatar research: key moments, real desire, who they trust for the shift (a friend, a group, a professional).</p>"},{"id":"l27","module":5,"num":"27","dur":"16 min","title":"Testimonials that ring true","body":"<p><b>The idea:</b> most testimonials sound fake because they're smooth, positive, product-centred (\"great product, fast shipping, changed my life, will buy again\"). The best ones sound like an <b>overheard conversation between two friends at a café</b>: casual, odd details, vulnerable, honest about skepticism, not 100% positive.</p>\n<p><b>Structure:</b> moment (precise scene of the problem) → struggle (what was tried, precisely) → discovery (natural: \"my sister sent a link, I almost didn't click\") → now (concrete reality, not \"I feel so much better\").</p>\n<p><b>Specificity = truth:</b> \"$1,847 spent on supplements last year\", \"14 years, three months, 11 doctors\", \"day 11 my husband noticed\". Micro-moments and awkward details (\"my husband moved to the guest room\") that nobody would make up.</p>\n<p><b>The honesty principle:</b> \"I didn't believe it\", \"it took longer than they said\", \"some days are still hard\". Reservations increase credibility; perfection triggers doubt.</p>\n<p><b>Placement:</b> not at the bottom of the page but in the middle, after the mechanism or the product presentation, in an authentic form (screenshots of Facebook comments, Reddit posts). A testimonial can do anything: explain the root cause, handle an objection, describe the mechanism, from a customer's point of view.</p>"},{"id":"l28","module":5,"num":"28","dur":"38 min","title":"The full 12-beat arc (VSL, advertorial, long copy)","body":"<p><b>The idea:</b> not a film, a sale: 4 acts, 12 beats. The goal: make them feel the problem is urgent, this solution is different, and it works for <i>them</i>.</p>\n<p><b>Act 1, identification:</b> 1) <b>pattern interrupt</b> (on an ugly image ad, the hook must be very intense: \"my husband said he's divorcing me, and what happened next decides everything\"; on an advertorial, the ad has already won the attention, a headline is enough: contradiction, precise result, authority, confession, question); 2) <b>the before</b>: their daily reality in their words (physical, social, mental, identity), to the point that they comment \"this is my life\"; 3) <b>the breaking point</b>: expectation + failure + <b>witness</b> + emotion (a scene, not a decision: \"my daughter said she was embarrassed\", shame pushes to act); it mirrors those who are there and scares those who aren't yet (\"make the mouse bigger to sell the trap\").</p>\n<p><b>Act 2, education:</b> 4) <b>the failed attempts</b>: what they tried, why each category fails (treats the wrong problem), without getting clinical; 5) <b>the mechanism</b> (the most important beat): simple as for a child, with an analogy, a unique name, three types (hidden cause, missing ingredient, broken process); then the lever: studies on the ingredient, authority, and the \"already-believed ingredient + twist\" trick (magnesium + L-theanine).</p>\n<p><b>Act 3, solution:</b> 6) <b>the discovery</b>: natural and linked to the solution (you find the product through a group, then you check the mechanism and the studies, not the reverse); 7) <b>proof stacking</b>: science, authority, social volume, stories, demonstration, personal timeline, guarantee, in the order that fits (skeptics: science first; emotional: stories; logical, often men: demo); 8) <b>the product</b> as the logical conclusion, tied to the mechanism; 9) <b>the trial</b>: week by week, slow start (a miracle = BS detector), on the line between \"fast\" and \"believable\"; 10) <b>the after</b>: future pacing, return to the breaking point reversed, ripple effect on what matters to them, an admission (\"it took me 20 days, not 14\"), identity change.</p>\n<p><b>Act 4, close:</b> 11) <b>the offer</b>: anchor high (what the alternatives cost), reveal the price, product-related bonuses, guarantee based on the real cycle (\"90 days because hair takes 90 days\"), the math (\"$1.65 a day\"); 12) <b>urgency and choice</b>: stay the same (loss aversion) or try risk-free (future pacing), real urgency only, CTA phrased as a result (\"grow my hair back\"), not \"add to cart\".</p>\n<p><b>Mistakes that kill:</b> starting with the product, skipping the mechanism, a breaking point without a scene, a generic \"before\", miracle promises, weak proof, false urgency. And the hidden craft: keeping the boring passages (ingredients) alive with a conversational tone and comments.</p>"},{"id":"l29","module":6,"num":"29","dur":"51 min","title":"Zakaria at Evolve Marrakech: everything is copywriting","body":"<p><b>Who:</b> Zakaria, the course instructor, presented as having gone from $20-30k/day to \"million-dollar days\" thanks to advertorials. His thesis: <b>everything your customer reads is copywriting</b> (ad headlines, UGC scripts, email subject lines, product page, testimonials). Improving the copy everywhere = same traffic, same budget, more money.</p>\n<p><b>Five techniques with their proof:</b></p>\n<ol>\n<li><b>Fear beats desire.</b> Prospect theory (Kahneman & Tversky, 1979): losing $100 hurts twice as much as gaining $100. Consumers are 2 to 2.5 times more sensitive to a price increase than to a decrease. Meta-analysis of 127 studies: fear works mostly <b>when it comes with a solution</b>. Bad: \"discover the secret to younger skin\". Good: \"after 25 you lose 1% of collagen a year; by 40 a third is gone; every year you wait, another 1% doesn't come back\". <b>But</b>: on a problem-aware audience, start with relatability, then open a loop toward relief, and only then fear; otherwise they flee.</li>\n<li><b>Specific beats vague.</b> Precise claims are judged 21 to 53% more believable; \"31 days\" beats \"about a month\". \"I lost 31 pounds in 42 days, 40-minute workouts in my living room while my kids watched cartoons.\"</li>\n<li><b>The mechanism explains why.</b> \"Because\" increases compliance by 34% even with an empty reason (Langer, 1978). A good mechanism does three things: invalidates what they tried, names the real cause, positions the product as the only logical answer. <b>Simple as for a 5-year-old</b>: people scroll in \"system 1\", not in exam mode. Tip: analogies come from forums (Reddit) where people explain simply.</li>\n<li><b>Stories bypass the guard.</b> Transportation theory: absorbed in a narrative, we counter-argue less; brains synchronise (Hasson, 2012); oxytocin increases donations by 56% (Zak, 2014). Scrolling is an escape trance: a story doesn't break the spell, it extends it (\"you don't break the spell\", Nikita).</li>\n<li><b>Borrowed experience.</b> Making them feel the result before buying (mental simulation, Taylor 1998; reading \"velvet\" activates touch). The guru who tries on the Rolex and starts the Lambo: you live the scene, you want what he has. Then <b>future pacing</b> for their own future (\"it's 6 a.m., you're awake but not because of an alarm… that's what you get back\").</li>\n</ol>\n<p><b>Who should learn this:</b> creative strategists, landing pages, email/SMS, UGC managers, media buyers, support, founders. Salaries: junior $3-5k, mid $6-10k, senior $12-20k. Books: Breakthrough Advertising, Boron Letters (Halbert), Scientific Advertising (Hopkins), Ogilvy, Sugarman, Great Leads, Influence (Cialdini), Thinking Fast and Slow.</p>\n<p><b>This week:</b> write your mechanism in its simplest version; specificity audit (every vague claim → number, timeframe, context); rewrite a testimonial in sensory terms; put a future pacing before every CTA. Q&A: advertorial for a problem-aware audience, listicle for a product-aware audience; the ad's primary text is there to fill in what the creative doesn't say.</p>"},{"id":"l30","module":6,"num":"30","dur":"1 h 26","title":"Eugene Schwartz: how to write ads (1990, Rodale)","body":"<p><b>Who:</b> the author of <i>Breakthrough Advertising</i> (the awareness levels come from him). 27 wins out of 30 packages for Rodale, $200M in sales. His talk is \"day one\" of the Training folder.</p>\n<p><b>1. Work before talent.</b> A 1,100-page manuscript: he reads every page, underlines every claim (one hour a day, two weeks), has a 50-60 page \"vocabulary\" typed up, and only then assembles. He knows the book better than its author (the egg story on page 164). \"The power of the ad is always in the product itself. The copywriter simply finds it and expresses it.\"</p>\n<p><b>2. The 33 minutes 33 timer.</b> Same desk, same ritual (the coffee, the three pens), a timer that rings. For 33 minutes you may do nothing, but you don't leave the desk and you do nothing else. Boredom pushes you to work. Then a mandatory 5-minute break: <b>the brain connects when it plays</b>. Never a blank page in 40 years.</p>\n<p><b>3. Copy is not written, it's assembled.</b> Blocks (claims, images, desires) you stack: \"a little city of desire\". Words are shop windows: you must see the product through them, never the glass. \"Sneaky little arthritis tricks\": four ordinary words, powerful in combination.</p>\n<p><b>4. Creativity = connectivity.</b> Linking two ideas that didn't go together. The focused brain holds 7 items; the unconscious churns thousands. Hence the breaks, the shower, the holidays (he writes his best ads in the margins of other people's books), and working on three projects in parallel (the \"creative triangle\": one project feeds the other).</p>\n<p><b>5. The headline has one job:</b> get the next sentence read. Same for every sentence. The whole envelope is the headline; you can put hundreds of words on it if they're \"tantalizing\". The 6-page letter = customer cases (\"a case history is proof by a surrogate so you don't have to take the risk\").</p>\n<p><b>6. Length:</b> as long as needed to hold the claims, without ruining the company. Always offer a way out (\"scapegoat\"): someone who doesn't read everything must be able to order from the envelope. <b>You never sell, you get people to try</b> (21-day guarantee).</p>\n<p><b>7. The most powerful word:</b> \"you\". You write to one person who shares a problem with millions. You must know her so well she takes you for her reflection: listen, read the National Enquirer, watch the $100M movies (Lethal Weapon: an explosion every 3 minutes = every paragraph must be a headline). \"People live by hidden desires\" (every reader of an investment letter wants to be Gekko). Heaven and hell: be melodramatic, honest and full of proof.</p>\n<p><b>8. Claim + mechanism.</b> The engine of mail order: a strong promise + a strange means (\"vacuum dust from drawers without removing their contents\" → page 71). When claims run out (claim exhaustion), the mechanism must carry belief (Boardroom: \"you can't cash an unsigned check\"). \"Can't be done\": an impossible means for an average promise, and the reader orders to check.</p>\n<p><b>9. Fatigue and revival:</b> a package gets tired; you hand the product to another copywriter who finds \"a whole new set of do's\". You don't sell a book, you sell bundles of things it makes you do. Premiums: he sells nothing without them; \"you're always playing pool: sinking the ball while getting position on the next shot\".</p>"}],"quiz":[{"id":"q01","lesson":"l01","module":1,"q":"A prospect has symptoms but has never connected them to a problem. Which awareness level?","choices":["Level 1, unaware","Level 2, problem-aware","Level 3, solution-aware"],"a":0,"exp":"They haven't \"labelled\" their symptoms yet: that's level 1. The copy has to hold up a mirror to their symptoms, then name the problem."},{"id":"q02","lesson":"l01","module":1,"q":"For a level 3 audience (they've already tried several solutions), the right approach is:","choices":["Twist the knife so they feel the urgency","Explain why the other solutions fail, then your mechanism","Offer them -40% right away"],"a":1,"exp":"They already suffer and they're comparing. Fear without hope makes them flee; the differentiating mechanism keeps them. A pure offer is for levels 4-5."},{"id":"q03","lesson":"l01","module":1,"type":"tf","q":"True or false: \"-40% until midnight\" is a good hook for cold traffic.","a":1,"exp":"False. A discount means nothing to someone who doesn't know the product or why they need it. That's level 5 copy."},{"id":"q04","lesson":"l02","module":1,"q":"At which sophistication stage does the mechanism become mandatory?","choices":["Stage 1","Stage 3","Stage 5"],"a":1,"exp":"Stage 3, the skeptical market: \"I've heard that promise before, explain why it would work.\""},{"id":"q05","lesson":"l02","module":1,"q":"At stage 4 (exhausted market), what are the two options?","choices":["Lower the price or run more ads","A new mechanism or niching down on a precise avatar","Promise faster or bigger"],"a":1,"exp":"New mechanism (\"acne starts in the gut\") or niche (\"only for women with PCOS\"). Bigger promises are stage 2, already behind us."},{"id":"q06","lesson":"l02","module":1,"q":"At stage 5, what still works?","choices":["Bigger claims","A better mechanism","Personality, story, identity, human connection"],"a":2,"exp":"The market no longer believes any claim or mechanism (weight loss). What's left is the human: \"I won't promise you anything, here's what happened to me.\""},{"id":"q07","lesson":"l03","module":1,"q":"The traffic source (cold, warm, retargeting):","choices":["Sets the awareness level","Shifts the level up from the market's baseline","Has no effect"],"a":1,"exp":"The market sets the baseline (e.g. knees 55+ = level 3). Warm traffic = baseline +1, retargeting = +1 to +2, email = level 5."},{"id":"q08","lesson":"l03","module":1,"q":"The \"PCOS hair\" case is special because:","choices":["The market is virgin","There are two awareness levels at once: level 3 on hair loss, level 1 on the hormonal cause","Women don't read ads"],"a":1,"exp":"Hence the formula: acknowledge what she tried, explain the failure, reveal the real cause, show that your solution targets it."},{"id":"q09","lesson":"l03","module":1,"q":"How do you diagnose a market's sophistication?","choices":["Ask your team","Read competitor ads that have been running for 3-6 months, Amazon 3-star reviews, Reddit and forums","Look at the average price"],"a":1,"exp":"An ad that has run for 6 months works: what stage is its copy? 3-star reviews say what people tried and what they doubt."},{"id":"q10","lesson":"l04","module":1,"q":"In the \"low awareness × high sophistication\" box, the danger is:","choices":["Educating the prospect, who then googles and buys from a competitor with a mechanism","Being too expensive","Not twisting the knife enough"],"a":0,"exp":"As soon as you name their problem, they enter a saturated market. You must name, explain the mechanism, prove and close in the same piece."},{"id":"q11","lesson":"l04","module":1,"type":"tf","q":"True or false: most DTC brands live in the \"high awareness × high sophistication\" box.","a":0,"exp":"True. That's the red ocean: strong mechanism, stacked proof, story and irresistible offer are mandatory."},{"id":"q12","lesson":"l05","module":1,"q":"Level 3, hair loss. Which of these hooks is right?","choices":["\"Your hairline recedes every day, your confidence goes with your hair\"","\"Here's what actually works in 2026 for PCOS hair loss, and why biotin failed\"","\"Losing your hair at 29 is your future if you do nothing\""],"a":1,"exp":"Level 3 = pain acknowledged briefly + immediate hope. The other two twist the knife on someone already suffering: she scrolls to protect herself."},{"id":"q13","lesson":"l05","module":1,"q":"Same knee supplement, stage 4. What do you need?","choices":["A bigger promise + guarantee","A classic mechanism (inflammation)","A new mechanism (\"it's not the cartilage, it's the synovial fluid\") or a new avatar"],"a":2,"exp":"Stage 4: everything has been seen. You change the root cause or the target."},{"id":"q14","lesson":"l06","module":2,"q":"When the buyer is not the user, the dominant emotion is almost always:","choices":["Status","Nurturance (protecting a loved one)","Belonging"],"a":1,"exp":"Parents, pet owners, children of ageing parents: we do more for those we love than for ourselves."},{"id":"q15","lesson":"l06","module":2,"q":"\"Every month you wait, more follicles die and never come back.\" Which emotion?","choices":["Relief","Security (loss aversion)","Identity"],"a":1,"exp":"Fear of losing something irreversible: security. Often placed right before the CTA."},{"id":"q16","lesson":"l06","module":2,"q":"How many emotions should one piece of copy aim at?","choices":["All six, so nobody is missed","One or two, hard (plus a secondary one)","None: logic is enough"],"a":1,"exp":"Diagnose the 2-3 dominant ones in the avatar file and hit them deep. Six at half strength doesn't convert."},{"id":"q17","lesson":"l07","module":2,"q":"The order of the emotional journey:","choices":["Curiosity → Indifference → Urgency → Hope → Conviction","Indifference → Curiosity → Hope → Conviction → Urgency","Hope → Urgency → Conviction → Curiosity → Indifference"],"a":1,"exp":"You break indifference (\"that's me\"), create curiosity (new information), hope (someone like me), conviction (proof), then urgency."},{"id":"q18","lesson":"l07","module":2,"q":"What moves someone from curiosity to hope?","choices":["A discount","The precise story of someone like them, with a concrete result","A slogan"],"a":1,"exp":"\"Tommy, 65, ex-runner, walked 3 miles on Saturday\": the prospect thinks \"this could work for me\". Over-promising kills that fragile hope."},{"id":"q19","lesson":"l08","module":2,"q":"\"Stop waking up at 3 a.m. drenched\" and \"Sleep through the night like you used to\":","choices":["Target two different emotions","Are two doors (pain / desire) into the same emotion, relief","Are interchangeable without consequence"],"a":1,"exp":"Pain = moving away from, desire = moving toward. Same room, two doors. You pick the door according to the awareness level."},{"id":"q20","lesson":"l08","module":2,"q":"Course rule: pain gets… and desire gets…","choices":["purchases / scrolls","attention / action","laughs / tears"],"a":1,"exp":"Pain gets attention, desire gets action."},{"id":"q21","lesson":"l09","module":2,"q":"For a joint supplement for dogs, who do you write to and what do you show?","choices":["You write to the dog","You write to the owner and show the dog's pain through what the owner observes","You write to the vet"],"a":1,"exp":"The dog doesn't read and doesn't pay. The owner sees (slow to get up), guesses (\"he can't tell you it hurts\") and feels (guilt)."},{"id":"q22","lesson":"l09","module":2,"q":"A frequent junior mistake according to module 2:","choices":["Talking only about the user's pain without the buyer's emotion","Putting in too much proof","Writing too short"],"a":0,"exp":"Result: flat copy, because the person paying feels nothing. You need the buyer's emotional fuel (nurturance, guilt)."},{"id":"q23","lesson":"l10","module":2,"q":"A \"chronic\" audience (they got used to their pain) needs:","choices":["A direct offer","To be reactivated: show them what they gave up","More scientific proof"],"a":1,"exp":"\"You don't hike anymore, you tell yourself it's fine. You just got used to less.\" Then hope."},{"id":"q24","lesson":"l10","module":2,"q":"An aspirational buyer (no pain) typically needs:","choices":["Fewer touchpoints","2 to 3 times more touchpoints and a created urgency (slippery slope, point of no return, hidden cost)","Very dramatic copy"],"a":1,"exp":"No pain = no natural urgency, more price resistance. You have to build it honestly."},{"id":"q25","lesson":"l11","module":3,"q":"Why does \"speaking their language\" make even an average UGC creator credible?","choices":["Because the script sounds like the person, so it feels authentic","Because it's shorter","Because Meta favours it"],"a":0,"exp":"Voice match = trust. A script in AI jargon sounds fake even when well acted."},{"id":"q26","lesson":"l12","module":3,"q":"What do you do with \"I was skeptical at first\"?","choices":["Keep it, it's reassuring","Replace it by showing the skepticism: \"I rolled my eyes when my sister sent me this\"","Put it in bold"],"a":1,"exp":"Show, don't tell. Real skeptics don't announce their skepticism."},{"id":"q27","lesson":"l12","module":3,"q":"Where can you use \"clinically proven\" and \"industry leading\"?","choices":["Everywhere","Nowhere","On a product page or in the mouth of an authority, never in a testimonial or UGC"],"a":2,"exp":"A real person doesn't talk like a press release."},{"id":"q28","lesson":"l12","module":3,"q":"The decisive test of the \"words that kill\" module:","choices":["Is the text over 500 words?","Could you swap the product name for a competitor's without anything changing?","Are there emojis?"],"a":1,"exp":"If yes, it's generic. Good copy can only be about THIS product, for THIS avatar, in THEIR voice."},{"id":"q29","lesson":"l13","module":3,"q":"Why is \"87% in 14 days\" more believable than \"it works fast\"?","choices":["Because 87 is a nice number","Because the brain uses precision as a shortcut to truth (\"why 87 and not 90?\")","Because studies say so"],"a":1,"exp":"Liars round up. Specific signals true. But never make it up: if you don't have the data, go find it."},{"id":"q30","lesson":"l13","module":3,"q":"Which one is over-specification?","choices":["\"7,342 customers to date\"","\"23.7% improvement in 14.3 days\"","\"Day 14: you walk down the stairs without holding the rail\""],"a":1,"exp":"Too many decimals sounds forced. Round to what makes sense: 23%, 14 days."},{"id":"q31","lesson":"l13","module":3,"q":"The most convincing form of specificity according to the course:","choices":["A doctor's quote","A week-by-week timeline","A \"vet approved\" logo"],"a":1,"exp":"\"Week 1… week 2… week 4: the moment in the mirror.\" The reader projects step by step."},{"id":"q32","lesson":"l14","module":3,"q":"Maximum number of active open loops?","choices":["1","4","10"],"a":1,"exp":"Beyond 4, the reader loses the thread. And every loop must be closed, otherwise it's a betrayal."},{"id":"q33","lesson":"l14","module":3,"q":"Which one is a strong loop?","choices":["\"I'll explain why this works\"","\"What she found in her husband's search history changed everything, but it wasn't what you think\"","\"This is important\""],"a":1,"exp":"Precise, unexpected, emotionally charged. The other two are vague promises."},{"id":"q34","lesson":"l14","module":3,"q":"The \"story interrupt\" is:","choices":["Stopping telling stories","Starting a story, cutting it at the most intense moment, and giving context before picking it up again","Interrupting the ad with a jingle"],"a":1,"exp":"Like Breaking Bad opening on the RV scene. The brain wants the rest."},{"id":"q35","lesson":"l15","module":3,"q":"\"But here's what nobody tells you\" is:","choices":["A bucket brigade (bridge phrase)","A CTA","A claim"],"a":0,"exp":"It carries the reader to the next sentence. Place it at transitions and when energy drops, not in every sentence."},{"id":"q36","lesson":"l15","module":3,"q":"Recommended frequency of bucket brigades:","choices":["Every sentence","Every 3 to 5 paragraphs, at transitions","Only one at the start"],"a":1,"exp":"Too many = an annoying tic. They serve after the hook, between ideas, before a key point, after a dense passage, before the CTA."},{"id":"q37","lesson":"l16","module":3,"q":"Why does sensory language bypass skepticism?","choices":["Because it's more poetic","Because you can't argue with a felt experience, only with a statement","Because it's shorter"],"a":1,"exp":"\"That sharp stabbing pain when you first stand up\" activates the pain area. \"Our product reduces pain\" is a debatable claim."},{"id":"q38","lesson":"l16","module":3,"q":"The sense most often forgotten in copy:","choices":["Sight","Sound","Touch"],"a":1,"exp":"\"No more crunching, your knees are silent on the stairs\", \"the alarm, not the hot flash, wakes you\"."},{"id":"q39","lesson":"l17","module":3,"q":"Why does future pacing make people buy?","choices":["Because it explains the product","Because the brain lives the imagined scene (same dopamine) and not buying feels like losing what you already felt","Because it's short"],"a":1,"exp":"Mental simulation: the imagined future is processed like a memory. Hence the placement right before the CTA."},{"id":"q40","lesson":"l17","module":3,"q":"Which one is NOT an ingredient of the \"mini-movie\"?","choices":["A precise moment (7:14 a.m., Saturday)","A witness who notices","A list of ingredients"],"a":2,"exp":"The mini-movie is moment, sensory detail, witness, inner realisation, emotional peak, \"new normal\"."},{"id":"q41","lesson":"l18","module":3,"q":"Copy made only of short sentences:","choices":["Is perfect for Facebook","Sounds robotic and choppy","Is always clearer"],"a":1,"exp":"Flow comes from the mix: long for momentum, short to hit. Test it out loud."},{"id":"q42","lesson":"l18","module":3,"q":"Sugarman's \"slippery slide\" means:","choices":["Every element must push the reader to the next one, down to the CTA","You have to write in a slippery tone","The price must go down"],"a":0,"exp":"Like a slide: once you've started, you only stop at the bottom."},{"id":"q43","lesson":"l19","module":3,"q":"\"It tastes awful. And it works.\" illustrates:","choices":["A marketing mistake","The damaging admission: admitting a flaw makes the rest believable","A false urgency"],"a":1,"exp":"The bad taste becomes proof of efficacy. Avis: \"We're number two. We try harder.\""},{"id":"q44","lesson":"l19","module":3,"q":"How many admissions per piece of copy?","choices":["As many as possible","One or two","None"],"a":1,"exp":"Ten flaws isn't trust anymore, it's self-sabotage."},{"id":"q45","lesson":"l19","module":3,"q":"If your product relieves but doesn't cure (and nothing on the market cures), the course advises:","choices":["Promising a cure anyway","Honestly selling the relief: fewer refunds, more loyalty, and you're the only honest one","Dropping the product"],"a":1,"exp":"\"It won't make menopause disappear, but it makes it bearable.\" Right expectations make customers who stay."},{"id":"q46","lesson":"l20","module":3,"q":"Why does saying \"this isn't for you if…\" increase sales?","choices":["It's shorter","Reverse psychology + scarcity + trust + filtering out bad customers","Meta likes it"],"a":1,"exp":"Good customers want to prove they're the right ones; bad ones leave before asking for a refund."},{"id":"q47","lesson":"l20","module":3,"q":"Structure of the takeaway:","choices":["Who it's not for → why → who it's for → \"if that's you, keep reading\"","Price → bonus → guarantee","Hook → mechanism → proof"],"a":0,"exp":"\"If that's you, keep reading. If not, I just saved you $79.\""},{"id":"q48","lesson":"l21","module":4,"q":"In the hierarchy of attention triggers, the strongest is:","choices":["Curiosity","Opportunity","Survival / loss"],"a":2,"exp":"Survival (100%) > pain/loss (95%) > identity (85%) > opportunity (70%) > curiosity (50%)."},{"id":"q49","lesson":"l21","module":4,"q":"According to the attention equation, why does \"revolutionary joint supplement\" fail?","choices":["Low relevance, zero emotion, zero novelty: everyone has seen it","Too long","Not enough capital letters"],"a":0,"exp":"(3 × 1 × 1) / 2 = 1.5. Versus \"still can't get off the floor without holding onto something\": (9 × 7 × 6) / 1 = 378."},{"id":"q50","lesson":"l21","module":4,"q":"\"Hook fatigue\" is:","choices":["When the creator is tired","When a hook copied everywhere becomes a pattern the brain ignores, or even links to junk content","When the ad runs too long"],"a":1,"exp":"Cycle: innovation → adaptation → saturation → fatigue. Remedy: specificity, micro-moments, stories, stealing from outside your niche."},{"id":"q51","lesson":"l21","module":4,"q":"In the scroll trance, what share of content is processed consciously?","choices":["Less than 5%","About 50%","Almost all of it"],"a":0,"exp":"1.7 s per piece of content, 3 per second. Hence: speak to the reptilian brain, not to logic."},{"id":"q52","lesson":"l22","module":4,"q":"\"My husband thought I was cheating\" in a menopause ad is acceptable if:","choices":["The husband is never mentioned again","It genuinely leads to the symptoms (she gets up at 3 a.m., wanders around the house): no bait-and-switch","Never"],"a":1,"exp":"The drama must resolve inside the real message. Otherwise: high hook rate, trust destroyed."},{"id":"q53","lesson":"l22","module":4,"q":"Which one is a \"forbidden information\" trigger?","choices":["\"I'm not supposed to share this\"","\"Buy one get one\"","\"Our new formula\""],"a":0,"exp":"Secrets, NDAs, \"my doctor whispered\": the brain wants what is hidden from it."},{"id":"q54","lesson":"l23","module":4,"q":"The job of the 2nd line after the hook:","choices":["Sell","Anchor: confirm it's for them (qualify)","Give the price"],"a":1,"exp":"Line 1 stops, line 2 anchors, line 3 opens a loop."},{"id":"q55","lesson":"l23","module":4,"q":"\"I dropped my keys yesterday. Looked at them for 10 seconds. Then kicked them to the couch.\" Which formula?","choices":["Question → reversal → promise","Story in medias res → tension → stop before resolution","Contradiction → proof"],"a":1,"exp":"We're in the middle of the scene, tension rises, we stop before saying what changed."},{"id":"q56","lesson":"l24","module":4,"q":"A hook with a big hook rate but zero hold rate (e.g. a ball shot at the camera) suffers from:","choices":["Clickbait without payoff: the hook isn't connected to the message","Too much specificity","Wrong tone"],"a":0,"exp":"The hook must lead naturally into the body. Otherwise people stop, then leave."},{"id":"q57","lesson":"l24","module":4,"q":"Why is \"knee-d a solution?\" a mistake?","choices":["It's too long","The pun takes cognitive effort; in zombie mode, clear always beats clever","It's forbidden"],"a":1,"exp":"Clear beats clever. Zero effort to understand."},{"id":"q58","lesson":"l24","module":4,"q":"The recommended replacement for false urgency (\"only 3 left\"):","choices":["\"Only 2 left\"","The cost of waiting: \"every week you wait is another week of bad sleep\"","A countdown"],"a":1,"exp":"Real urgency stated simply, or loss aversion on what waiting really costs."},{"id":"q59","lesson":"l24","module":4,"q":"Over-promising (\"pain gone in 24 hours\") also costs:","choices":["Nothing if it sells","Refunds, chargebacks, cancelled subscriptions, and trust","Only time"],"a":1,"exp":"If your model needs 3 months of retention, your proof has to talk about 3 months."},{"id":"q60","lesson":"l25","module":5,"q":"\"My grandson sprinted at me at the park. I didn't flinch. I scooped him up.\" is:","choices":["An origin story","A full customer story","A moment story (one snapshot that tells the whole transformation)"],"a":2,"exp":"No journey, a single sensory scene. Ideal for a hook, a 15-second UGC, an email subject line."},{"id":"q61","lesson":"l25","module":5,"q":"In the origin story, the founder is:","choices":["The hero","The guide (the one who discovered and shares)","The customer"],"a":1,"exp":"They had the problem, tried everything, found it, and now show the way, often against an industry."},{"id":"q62","lesson":"l26","module":5,"q":"Why is the tension of a UGC told in the past tense?","choices":["Because it's easier to act","Because the viewer, living it in the present, thinks \"she had it too, what changed?\": relatability without fear","Because Meta requires it"],"a":1,"exp":"People scroll to escape their life. You don't throw it in their face; you show someone who got out."},{"id":"q63","lesson":"l26","module":5,"q":"The 4 beats of a short UGC:","choices":["Hook, tension, shift, result","Intro, product, price, CTA","Problem, study, ingredients, offer"],"a":0,"exp":"And the result must match the avatar's real desire: not more (skepticism), not less."},{"id":"q64","lesson":"l27","module":5,"q":"A good testimonial sounds like:","choices":["A press release: \"great product, fast shipping, will buy again\"","An overheard conversation between two friends at a café: odd details, admitted skepticism, not 100% positive","A spec sheet"],"a":1,"exp":"\"Some days are still hard\" increases credibility; perfection triggers doubt."},{"id":"q65","lesson":"l27","module":5,"q":"Where do you place testimonials on a page?","choices":["At the very bottom","In the middle, after the mechanism or the product, in an authentic form (screenshots of comments)","In the footer"],"a":1,"exp":"At the bottom, nobody reads them. In the middle, they handle objections at the right moment."},{"id":"q66","lesson":"l28","module":5,"q":"The most important beat of the full arc:","choices":["The offer","The mechanism","The hook"],"a":1,"exp":"Without a mechanism, no reason to believe, so no sale. Simple as for a child, with an analogy and a name."},{"id":"q67","lesson":"l28","module":5,"q":"The breaking point must be:","choices":["A decision (\"I decided to act\")","A scene with a witness and shame (\"my daughter said she was embarrassed\")","A number"],"a":1,"exp":"A moment, not a decision. It mirrors those who are there and scares those who aren't yet."},{"id":"q68","lesson":"l28","module":5,"q":"In the \"discovery\" (beat 6), the credible order is:","choices":["I researched 3 ingredients, then by chance found a product that contains them","Someone recommended the product, then I checked the mechanism and the studies","I saw an ad"],"a":1,"exp":"The reverse sounds fake. You find first, you check second."},{"id":"q69","lesson":"l28","module":5,"q":"The order of proof for a logical audience (often men):","choices":["Stories first","Demonstration first (show that the mechanism works)","Price first"],"a":1,"exp":"Skeptics: science first. Emotional: stories. Logical: demo."},{"id":"q70","lesson":"l29","module":6,"q":"According to Kahneman & Tversky (prospect theory), losing $100:","choices":["Hurts as much as gaining $100 feels good","Hurts about twice as much","Doesn't count"],"a":1,"exp":"Hence: ads about what you lose beat ads about what you gain. But always with a solution."},{"id":"q71","lesson":"l29","module":6,"q":"The meta-analysis of 127 studies on fear shows it works mostly:","choices":["Alone","When it comes with a solution","On young people"],"a":1,"exp":"Fear + way out = action. Fear without a way out = flight."},{"id":"q72","lesson":"l29","module":6,"q":"Langer's \"because\" experiment (1978) shows that:","choices":["Giving a reason, even an empty one, increases compliance by 34%","People hate explanations","Long reasons work better"],"a":0,"exp":"The mechanism is your product's \"because\": it answers \"why would this work when nothing else did?\"."},{"id":"q73","lesson":"l29","module":6,"q":"\"You don't break the spell\" means:","choices":["A story extends the scroll trance instead of breaking it with an ad","You should avoid magic","You need a serious tone"],"a":0,"exp":"People scroll to escape; a story is another escape, into which you slip the product."},{"id":"q74","lesson":"l29","module":6,"q":"Advertorial or listicle?","choices":["Advertorial for a problem-aware audience (they need education), listicle for a product-aware audience","The reverse","Always listicle"],"a":0,"exp":"You educate the one who doesn't know the solution; you give \"5 reasons\" to the one who already knows the product."},{"id":"q75","lesson":"l30","module":6,"q":"Schwartz's ritual to never face a blank page:","choices":["Writing at night","A 33 min 33 timer: you may do nothing, but nothing else; then a mandatory 5-minute break","Dictating to his secretary"],"a":1,"exp":"Boredom pushes you to work; the break lets the brain connect."},{"id":"q76","lesson":"l30","module":6,"q":"For Schwartz, the headline has only one job:","choices":["Sell the product","Get the next sentence read","Identify the company"],"a":1,"exp":"And every sentence has the same job. The whole envelope is the headline."},{"id":"q77","lesson":"l30","module":6,"q":"\"Copy is not written, copy is assembled\" means:","choices":["You copy competitors","You stack blocks (claims, images, desires) found in the product itself","You write as a team"],"a":1,"exp":"The power is in the product; the copywriter finds it (by reading every page) and expresses it."},{"id":"q78","lesson":"l30","module":6,"q":"The most powerful word in the English language according to Schwartz:","choices":["Free","New","You"],"a":2,"exp":"You write to one person who shares a desire with millions. Never \"the hands\", always \"your hands\"."},{"id":"q79","lesson":"l30","module":6,"q":"When claims run out (claim exhaustion), what carries belief?","choices":["The price","The strange mechanism (\"a way to vacuum dust from drawers without removing the contents\")","The colours"],"a":1,"exp":"The reader orders to find out how it's possible, even if they don't believe it."},{"id":"q80","lesson":"l30","module":6,"type":"tf","q":"True or false: Schwartz often sold without a premium (gift) to protect the margin.","a":1,"exp":"False. \"I wouldn't sell anything without them.\" The premium makes people try, and you're always playing the next shot."}],"cards":[{"id":"c001","tag":"Awareness","q":"The 5 awareness levels, in order?","a":"1 Unaware · 2 Problem-aware · 3 Solution-aware · 4 Product-aware · 5 Most aware (ready to buy)."},{"id":"c002","tag":"Awareness","q":"What does the copy do for a <b>level 1</b> audience?","a":"Mirror the symptoms (without naming the solution), then name the problem and its consequences. You may twist the knife."},{"id":"c003","tag":"Awareness","q":"What does the copy do for a <b>level 3</b> audience?","a":"No knife. Explain why the other solutions failed, then unique mechanism + proof. Brief pain, immediate hope."},{"id":"c004","tag":"Awareness","q":"What does the copy do for a <b>level 4</b> audience?","a":"Handle objections, stack proof, guarantee, irresistible offer (mid-funnel, retargeting)."},{"id":"c005","tag":"Awareness","q":"What does the copy do for a <b>level 5</b> audience?","a":"Get out of the way: clear CTA, best offer, urgency. No education."},{"id":"c006","tag":"Awareness","q":"Cold / warm / retargeting / email traffic: which levels?","a":"Cold 1-3 · Warm 3-4 · Retargeting 4-5 · Email and brand search 3-5 (often 5)."},{"id":"c007","tag":"Awareness","q":"The number 1 mistake with awareness levels?","a":"Writing level 5 copy (\"-40%\") to level 2 people. Or level 1 copy (\"did you know…\") to a level 3 market."},{"id":"c008","tag":"Sophistication","q":"The 5 sophistication stages?","a":"1 Virgin (simple promise) · 2 Bigger promises · 3 Mechanism required · 4 New mechanism or niche · 5 Personality, story, identity."},{"id":"c009","tag":"Sophistication","q":"At which stage are most health / beauty / supplement markets?","a":"Stage 3 or 4. Stage 1 barely exists anymore in direct response."},{"id":"c010","tag":"Sophistication","q":"The two options at stage 4?","a":"A) A new mechanism (new root cause). B) Niche down (one precise avatar: \"if you don't have PCOS, don't buy\")."},{"id":"c011","tag":"Sophistication","q":"Why does Zakaria use stage 5 techniques even in a stage 3 market?","a":"Story, admission and human connection raise belief everywhere. You add them, you don't replace the mechanism."},{"id":"c012","tag":"Diagnosis","q":"What is a market's awareness \"baseline\"?","a":"The dominant level, set by how old the problem is, how much advertising has been seen and what people discuss publicly. The traffic source shifts it, it doesn't set it."},{"id":"c013","tag":"Diagnosis","q":"How do you diagnose a market's sophistication (3 sources)?","a":"Competitor ads running for 3-6 months; Amazon 3-star reviews; Reddit / forums (beliefs, attempts, skepticism)."},{"id":"c014","tag":"Diagnosis","q":"Formula for an avatar who is \"level 3 on the solution, level 1 on the cause\" (e.g. PCOS hair)?","a":"Acknowledge what they tried → explain why it failed → reveal the real cause → show that your solution targets it."},{"id":"c015","tag":"Matrix","q":"\"Low awareness × high sophistication\" box: the rule?","a":"Win the whole journey in a single piece: symptom → name it → mechanism → proof → close before they go comparing."},{"id":"c016","tag":"Matrix","q":"\"High awareness × high sophistication\" box: what do you need?","a":"Strong mechanism + stacked proof + story/personality + irresistible offer. That's the red ocean of most brands."},{"id":"c017","tag":"Pain","q":"Pain-intensity rule by awareness level?","a":"L1-2: twist the knife (they downplay). L3: brief pain + immediate hope. L4-5: no pain, just the reason to buy."},{"id":"c018","tag":"Pain","q":"What is the \"freeze / run\" effect?","a":"When you press on the pain of someone already suffering without showing a way out: they scroll to protect themselves."},{"id":"c019","tag":"Emotions","q":"The 6 buying emotions?","a":"Relief · Nurturance (protect) · Belonging · Identity (be yourself again) · Security (fear of loss) · Status (be admired)."},{"id":"c020","tag":"Emotions","q":"Dominant emotion when the buyer is not the user?","a":"Nurturance. We do more for those we love than for ourselves (parents, pet owners)."},{"id":"c021","tag":"Emotions","q":"Which emotion is often placed right before the CTA?","a":"Security / loss aversion: \"every month you wait… never comes back\"."},{"id":"c022","tag":"Emotions","q":"Relief signals in avatar research?","a":"\"I couldn't take it anymore\", \"finally something that works\", \"I just wanted it to stop\"."},{"id":"c023","tag":"Emotions","q":"Identity signals?","a":"\"I don't feel like myself\", \"I want to be me again\", \"I used to be…\"."},{"id":"c024","tag":"Emotions","q":"How many emotions per piece of copy?","a":"One or two hard, a third as secondary. Not six."},{"id":"c025","tag":"Journey","q":"The 5 steps of the emotional journey?","a":"Indifference → Curiosity → Hope → Conviction → Urgency."},{"id":"c026","tag":"Journey","q":"What triggers each step?","a":"Indifference: \"that's me\" (precise image). Curiosity: new information/loop. Hope: someone like me + precise result. Conviction: volume of proof + objections. Urgency: cost of waiting, real scarcity."},{"id":"c027","tag":"Journey","q":"Split between ad and landing page?","a":"Ad: indifference → curiosity → hope. Top of page: hope → conviction. Bottom of page: conviction → urgency."},{"id":"c028","tag":"Pain","q":"Pain vs desire: definition?","a":"Pain = moving away from (\"stop waking up drenched\"). Desire = moving toward (\"sleep like you used to\"). Two doors into the same emotion."},{"id":"c029","tag":"Pain","q":"When to lead with pain, when with desire?","a":"Pain: levels 1-2 (they downplay). Desire: level 3+ (they already live the pain, they need hope)."},{"id":"c030","tag":"Pain","q":"\"Pain gets attention, desire gets…\"?","a":"…action. Pain stops the scroll, desire makes them click."},{"id":"c031","tag":"Buyer/user","q":"6-block structure for \"buyer ≠ user\"?","a":"1 Symptom visible to the buyer · 2 User's pain seen by the buyer · 3 Buyer's emotion · 4 Bridge (\"you can do something\") · 5 Proof (users like theirs) · 6 CTA phrased as \"help\"."},{"id":"c032","tag":"Buyer/user","q":"For a dog, where does all the pain go through in the copy?","a":"Through what the owner observes (slow to get up), guesses (\"he can't tell you\") and feels (guilt, helplessness)."},{"id":"c033","tag":"Intensity","q":"The 3 emotional intensities?","a":"Acute (it burns, fast decision) · Chronic (got used to it, must be reactivated) · Aspirational (would be nice, urgency to create, 2-3× more touchpoints)."},{"id":"c034","tag":"Intensity","q":"6 techniques to create urgency in an aspirational audience?","a":"Slippery slope · Point of no return · Hidden cost · Future self (version A / B) · Anticipated regret · Small investment vs big result."},{"id":"c035","tag":"Language","q":"\"Voice match = …\"?","a":"…trust. The avatar's vocabulary, sentence length, formality and emotional temperature, taken from the research file."},{"id":"c036","tag":"Words that kill","q":"What replaces \"game changer\"?","a":"The change, shown: \"I slept seven hours for the first time in eight months\"."},{"id":"c037","tag":"Words that kill","q":"What replaces \"just try it, you have nothing to lose\"?","a":"Handle the real objection: \"You've been burned before. Here's why this is different, and here's your money back.\""},{"id":"c038","tag":"Words that kill","q":"Weak words to cut?","a":"very, really, just, things, stuff, kind of, sort of, honestly, to be honest, I think, I feel like."},{"id":"c039","tag":"Words that kill","q":"Where is corporate jargon (clinically proven, industry leading) tolerated?","a":"Product page or in the mouth of an authority. Never in a testimonial or a UGC."},{"id":"c040","tag":"Words that kill","q":"The decisive test for generic copy?","a":"Could you swap the product name for a competitor's without changing anything? Would a real person say that?"},{"id":"c041","tag":"Specificity","q":"The 7 types of specificity?","a":"Numbers · Time · Sensory · Scenario · Person · Process · Comparison."},{"id":"c042","tag":"Specificity","q":"Why is specific believed?","a":"The brain takes precision as a shortcut to truth: \"why 87% and not 90?\". Liars round up."},{"id":"c043","tag":"Specificity","q":"The 3 rules of specificity?","a":"Never make it up (go find the data) · Don't over-specify (23.7% in 14.3 days) · Back every number."},{"id":"c044","tag":"Loops","q":"What is an open loop and why does it work?","a":"An incomplete thought; the brain hates it and keeps going to close it (Zeigarnik effect: we remember the unfinished better)."},{"id":"c045","tag":"Loops","q":"6 types of loops?","a":"\"What they're hiding\" (enemy) · Story interrupt · Contradiction · The numbers don't add up · \"Before I tell you\" · Stacked loops (3 things…)."},{"id":"c046","tag":"Loops","q":"Rules for loops?","a":"Always close · The answer must be worth the wait · Max 4 active · The detour must be interesting in itself."},{"id":"c047","tag":"Loops","q":"Where to place loops?","a":"First 3 lines · before each explanatory passage · before the ask · at section transitions · the ad opens, the landing page closes and reopens."},{"id":"c048","tag":"Bucket brigades","q":"5 examples of bucket brigades?","a":"But here's the thing · Here's what nobody tells you · Sound familiar? · Picture this · Here's the bottom line."},{"id":"c049","tag":"Bucket brigades","q":"Frequency and placement?","a":"At transitions and energy drops (ingredient passages), every 3-5 paragraphs. Not every sentence. Matched to the avatar's tone."},{"id":"c050","tag":"Sensory","q":"Why does sensory language bypass skepticism?","a":"You can argue with a statement (\"reduces pain\") but not with a felt experience (\"that stabbing pain when you first stand up\")."},{"id":"c051","tag":"Sensory","q":"The 5 questions to convert an abstract benefit?","a":"What will they see? What will they feel? What will they hear? What will stop happening? Which precise moment will be different?"},{"id":"c052","tag":"Sensory","q":"Structure of the \"mini-movie\"?","a":"Setting (day, time, place) → sensory details → contrast with before → emotion → resolution."},{"id":"c053","tag":"Future pacing","q":"Why does future pacing make people buy?","a":"The brain lives the imagined scene (same areas, dopamine). Not buying = losing something already felt."},{"id":"c054","tag":"Future pacing","q":"6 ingredients of strong future pacing?","a":"Precise moment · Sensory trigger · Witness who notices · Inner realisation (\"wait, that's it?\") · Emotional peak · \"New normal\" framing (\"this is just Tuesday\")."},{"id":"c055","tag":"Future pacing","q":"The physical test of future pacing?","a":"Read out loud: heart rate, smile, stinging eyes? If not, it isn't strong enough. Placement: right before the CTA."},{"id":"c056","tag":"Rhythm","q":"What are short sentences for? Long ones?","a":"Short: hit (key points, peaks, pause after a block). Long: momentum (image, story, explanation). All short = robot, all long = breathless."},{"id":"c057","tag":"Rhythm","q":"4 rhythm tools?","a":"Fragments (\"Not anymore.\") · Rule of three · Parallelism (\"you've tried…, you've seen…, you've read…\") · Rising intensity."},{"id":"c058","tag":"Rhythm","q":"The ultimate rhythm test?","a":"Read out loud (or record yourself). Out of breath = too long; choppy = too short; bored = missing a loop."},{"id":"c059","tag":"Admission","q":"What is a damaging admission and why does it work?","a":"Admitting a real flaw (timeframe, price, taste, daily dose). The brain concludes \"they're honest\" and believes the rest. Buckley's: \"it tastes awful and it works\"."},{"id":"c060","tag":"Admission","q":"Admission + pivot formula?","a":"\"It takes 14 days BECAUSE it repairs instead of masking.\" \"It's $79 BECAUSE clinical-grade form, 87% absorbed.\""},{"id":"c061","tag":"Admission","q":"Rules of the admission?","a":"A real flaw, not a fake one · One that doesn't destroy the value proposition · One or two per piece · One that leads somewhere positive."},{"id":"c062","tag":"Admission","q":"If your product relieves without curing?","a":"Honestly sell the relief: fewer refunds, more loyalty, and you're the only honest one in a crowd of \"cures\"."},{"id":"c063","tag":"Takeaway","q":"Why does \"this isn't for you if…\" sell more?","a":"Reverse psychology (I want what is taken from me) + scarcity + trust (honest seller) + filtering out bad customers."},{"id":"c064","tag":"Takeaway","q":"Structure of the takeaway?","a":"Who it's not for → why → who it's for → \"if that's you, keep reading; if not, I just saved you $79\"."},{"id":"c065","tag":"Attention","q":"What happens in the brain in 0.5 s when facing a hook?","a":"0-100 ms detection · 100-300 ms amygdala: threat / reward / ignore · 300-500 ms \"is this for me?\" · 500 ms decision. Most ads die before 300 ms."},{"id":"c066","tag":"Attention","q":"What does the reptilian brain react to?","a":"Threat · Opportunity · Novelty/unexpected · Self (my tribe, my situation) · Contrast · Strong emotion."},{"id":"c067","tag":"Attention","q":"Hierarchy of attention triggers?","a":"5 Survival (100%) > 4 Pain/loss (95%) > 3 Identity (85%) > 2 Opportunity (70%) > 1 Curiosity (50%)."},{"id":"c068","tag":"Attention","q":"The attention equation?","a":"Attention = (relevance × emotion × novelty) / effort. \"Revolutionary joint supplement\" = 1.5; \"still can't get off the floor without holding onto something\" = 378."},{"id":"c069","tag":"Attention","q":"The hook passes \"is this for me?\" if it touches… (7 things)","a":"Demographics · Exact situation · Identity · Pain · Desire · Enemy · Past failures."},{"id":"c070","tag":"Attention","q":"What is hook fatigue and its 4 phases?","a":"A hook copied everywhere becomes an ignored pattern (and gets linked to junk content). Innovation → adaptation → saturation → fatigue."},{"id":"c071","tag":"Attention","q":"5 remedies for hook fatigue?","a":"Specificity (uncopyable) · Steal from outside your niche · Micro-specific (the exact gesture) · Stories (infinite) · Be first rather than perfect."},{"id":"c072","tag":"Attention","q":"Scroll-trance statistics?","a":"1.7 s per piece of content · 3 pieces per second · less than 5% processed consciously."},{"id":"c073","tag":"Triggers","q":"The 4 things the brain is wired for (trigger phrases)?","a":"Social threats (betrayal, secret) · Survival threats (hospital, scam) · Forbidden information · Unfinished stories. Plus gossip."},{"id":"c074","tag":"Triggers","q":"10 categories of trigger phrases?","a":"Relationship gossip · Caught/exposed · Secret · Scam · Medical emergency · Financial crisis · Confession · Discovery · Conflict with authority · Transformation."},{"id":"c075","tag":"Triggers","q":"Formula for a trigger hook?","a":"Trigger phrase + your topic + qualification + loop. \"My husband thought I was faking it. After three years of complaining about my knees… That's when I knew.\""},{"id":"c076","tag":"Triggers","q":"The anti-clickbait rule?","a":"No bait-and-switch: the drama must resolve inside the real message. You want hook rate AND hold rate AND conversion."},{"id":"c077","tag":"3 lines","q":"The job of the first 3 lines after the hook?","a":"Line 1 stops (interrupt) · Line 2 anchors (it's for you) · Line 3 opens a loop (commitment)."},{"id":"c078","tag":"3 lines","q":"5 opening formulas?","a":"Pain → validation → way out · Story in medias res → tension → stop · Question → reversal → promise · Contradiction → proof → stacking · Transformation → contrast → teaser."},{"id":"c079","tag":"Hook mistakes","q":"10 hook mistakes?","a":"Clickbait without payoff · Over-promising · Boring/expected · Starting with the product · Too vague · Too clever · Closing the loop in the hook · Wrong platform tone · Targeting everyone · False urgency."},{"id":"c080","tag":"Hook mistakes","q":"\"Clear beats clever\"?","a":"In zombie mode, zero effort available: a pun (\"knee-d a solution?\") kills the hook. Clarity first."},{"id":"c081","tag":"Hook mistakes","q":"What replaces false urgency?","a":"A real urgency said simply, or the cost of waiting (\"every week you wait is another week of bad sleep\")."},{"id":"c082","tag":"Hook mistakes","q":"Hook OK + bad hold = ? Hold OK + no purchase = ?","a":"Loop / body problem. Mechanism or proof problem. A good hook lets you test the rest."},{"id":"c083","tag":"Stories","q":"The 3 types of stories that convert?","a":"Origin (why it exists, the guide) · Customer (someone like you) · Moment (one scene that says it all)."},{"id":"c084","tag":"Stories","q":"Structure of the customer story?","a":"Before → breaking point → discovery → skepticism → trial → result → now."},{"id":"c085","tag":"Stories","q":"How to combine the 3 types?","a":"Open on a moment → develop into a customer story → bring in the origin (credible mechanism) → close on a future moment."},{"id":"c086","tag":"UGC","q":"The 4 beats of a short UGC and their durations (30 s)?","a":"Hook 3 s · Tension 10 s · Shift 5 s · Result 12 s."},{"id":"c087","tag":"UGC","q":"Why tell the tension in the past tense?","a":"The viewer lives it in the present; \"she had it too, what changed?\" = relatability without fear. People scroll to escape, not to be scared."},{"id":"c088","tag":"UGC","q":"Language rules of a UGC?","a":"First person, past tense, spoken language (incomplete sentences OK), precise details (3 a.m.), emotion shown not named, creator who looks like the avatar."},{"id":"c089","tag":"Testimonials","q":"Structure of a testimonial that sounds true?","a":"Moment (scene of the problem) → Struggle (precise attempts) → Discovery (natural, skeptical) → Now (concrete reality)."},{"id":"c090","tag":"Testimonials","q":"The honesty principle of testimonials?","a":"Include skepticism, a longer timeframe, imperfection (\"some days are still hard\"). Perfection triggers doubt."},{"id":"c091","tag":"Testimonials","q":"Where to place testimonials?","a":"In the middle of the page, after the mechanism/product, in an authentic form (screenshots of comments), not at the bottom."},{"id":"c092","tag":"Full arc","q":"The 4 acts of the full arc?","a":"1 Identification (hook, the before, breaking point) · 2 Education (failures, mechanism) · 3 Solution (discovery, proof, product, trial, after) · 4 Close (offer, urgency/choice)."},{"id":"c093","tag":"Full arc","q":"Formula of the breaking point?","a":"Expectation + failure + witness + emotion. A scene, not a decision. Shame pushes to act."},{"id":"c094","tag":"Full arc","q":"The 3 jobs of a mechanism (Marrakech)?","a":"Invalidate what they tried · Name the real cause · Position the product as the only logical answer."},{"id":"c095","tag":"Full arc","q":"3 types of mechanism?","a":"Hidden cause · Missing ingredient · Broken process. Give it a unique name."},{"id":"c096","tag":"Full arc","q":"The \"already-believed ingredient + twist\" trick?","a":"Take an ingredient they already believe in (magnesium) and add a curiosity element (L-theanine, dose, form) to make the mechanism unique."},{"id":"c097","tag":"Full arc","q":"Credible order of the discovery?","a":"You find the product (friend, group), THEN you check mechanism and studies. The reverse sounds fake."},{"id":"c098","tag":"Full arc","q":"7 types of proof to stack?","a":"Science · Authority · Social volume · Stories · Demonstration · Personal timeline · Guarantee (risk reversal)."},{"id":"c099","tag":"Full arc","q":"Order of proof by audience?","a":"Skeptics: science first. Emotional: stories first. Logical (often men): demo first."},{"id":"c100","tag":"Full arc","q":"The trial timeline must be…?","a":"On the line between \"fast\" and \"believable\". Slow start (day 1: nothing) then day 10, day 14. A miracle = BS detector."},{"id":"c101","tag":"Full arc","q":"Components of the offer (beat 11)?","a":"Anchor high (cost of alternatives) → price → product-related bonuses → guarantee based on the real cycle → the math (\"$1.65 a day\")."},{"id":"c102","tag":"Full arc","q":"The CTA is phrased as…?","a":"A result (\"grow my hair back\", \"give him back his walks\"), not \"add to cart\"."},{"id":"c103","tag":"Marrakech","q":"Prospect theory (Kahneman & Tversky, 1979) in one sentence?","a":"Losing $100 hurts about twice as much as gaining $100 feels good. Fear beats desire, with a solution."},{"id":"c104","tag":"Marrakech","q":"Result of the meta-analysis of 127 studies on fear?","a":"Fear increases attitudes, intentions and behaviours, especially when it comes with a solution."},{"id":"c105","tag":"Marrakech","q":"Specific claims are judged…?","a":"21 to 53% more believable than vague claims. \"31 days\" beats \"about a month\"."},{"id":"c106","tag":"Marrakech","q":"The \"because\" experiment (Langer, 1978)?","a":"Giving a reason, even an empty one, raises compliance by 34%. The mechanism is the product's \"because\"."},{"id":"c107","tag":"Marrakech","q":"Transportation theory and oxytocin?","a":"Absorbed in a story, we counter-argue less; emotional stories raised donations by 56% (Zak, 2014)."},{"id":"c108","tag":"Marrakech","q":"Borrowed experience vs future pacing?","a":"Borrowed: the result lived by someone else, in \"I\" (the guru's Lambo). Future pacing: the reader's future, in \"you\". You combine both before the CTA."},{"id":"c109","tag":"Marrakech","q":"System 1 / system 2 and copy?","a":"Scrolling is system 1 (automatic, emotional). The mechanism must be understandable by a 5-year-old."},{"id":"c110","tag":"Marrakech","q":"Advertorial or listicle, based on what?","a":"Advertorial for a problem-aware audience (educate); listicle for a product-aware audience."},{"id":"c111","tag":"Schwartz","q":"Schwartz's reading method?","a":"Read every page of the manuscript, underline every claim, 1 hour a day for 2 weeks, have a 50-60 page \"vocabulary\" typed up, then assemble."},{"id":"c112","tag":"Schwartz","q":"Schwartz's timer?","a":"33 min 33 s: forbidden to do anything else, allowed to do nothing. Then a mandatory 5-minute break: the brain connects when it plays."},{"id":"c113","tag":"Schwartz","q":"\"Copy is not written, copy is…\"?","a":"…assembled. Blocks (claims, images, desires) stacked into \"a little city of desire\". Words are shop windows: you must see the product, not the glass."},{"id":"c114","tag":"Schwartz","q":"Creativity = ?","a":"Connectivity: linking two ideas that didn't go together. The focused brain holds 7 items; the unconscious connects during breaks (shower, holidays, three projects in parallel)."},{"id":"c115","tag":"Schwartz","q":"The only job of the headline (and of every sentence)?","a":"Get the next sentence read."},{"id":"c116","tag":"Schwartz","q":"Copy length and \"scapegoat\"?","a":"As long as needed for the claims; always a way out to order early (envelope + first page are enough). You don't sell, you get people to try."},{"id":"c117","tag":"Schwartz","q":"Claim + mechanism at Schwartz's?","a":"A strong promise + a strange means (\"vacuum dust from drawers without removing the contents\", see page 71). When claims run out, the mechanism carries belief."},{"id":"c118","tag":"Schwartz","q":"How to revive a tired package?","a":"Another copywriter, a \"whole new set of do's\": you don't sell a book but what it makes you do. And always a premium."}],"glossary":[{"t":"Creative strategist","d":"The person who decides what to say, to whom, and in what format before an ad gets produced. They pick the angle, the persona, the awareness level and the format, then brief the creators and read the results."},{"t":"Copywriting","d":"Writing that sells: ad texts, video scripts, product pages, emails. Zakaria: \
