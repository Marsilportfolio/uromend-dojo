<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Uromend Dojo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : rail de navigation à gauche (desktop) / barre d'onglets en bas (mobile), une vue à la fois, cartes de contenu sobres, l'accent "ananas" réservé aux actions et aux scores. */
:root{
  --bg:#F2F7F8; --bg2:#FFFFFF; --bg3:#E3EDF0; --fg:#0E2A33; --fg2:#4A6670; --line:#CFDDE2;
  --aqua:#157F92; --aqua2:#D7EEF2; --gold:#D99A1E; --gold2:#FBEFD2; --good:#2E8B57; --bad:#C9453B; --warn:#B9770E;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(14,42,51,.06),0 6px 18px rgba(14,42,51,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A20;--bg2:#12252C;--bg3:#1A323A;--fg:#E4EFF2;--fg2:#9FB7BF;--line:#274249;--aqua:#3FB7C9;--aqua2:#15363E;--gold:#F0B746;--gold2:#3A2F14;--good:#5CC88A;--bad:#F07B72;--warn:#E3A33C;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1A20;--bg2:#12252C;--bg3:#1A323A;--fg:#E4EFF2;--fg2:#9FB7BF;--line:#274249;--aqua:#3FB7C9;--aqua2:#15363E;--gold:#F0B746;--gold2:#3A2F14;--good:#5CC88A;--bad:#F07B72;--warn:#E3A33C;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
a{color:var(--aqua)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
nav.rail{background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .logo{width:38px;height:38px;border-radius:50%;background:var(--aqua);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:1.1rem}
.brand b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1.1}
.brand small{color:var(--fg2);font-size:.75rem}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--fg);padding:10px 12px;border-radius:var(--r);text-align:left;font-size:.95rem}
.navbtn:hover{background:var(--bg3)}
.navbtn.on{background:var(--aqua2);color:var(--aqua);font-weight:700}
.navbtn .ic{width:22px;text-align:center;font-size:1.05rem}
.navbtn .badge{margin-left:auto;background:var(--gold);color:#1a1200;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:99px;font-family:var(--mono)}
.rail .spacer{flex:1}
.xpbar{padding:10px 12px;border-top:1px solid var(--line);font-size:.8rem;color:var(--fg2)}
.xpbar .track{height:6px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-top:6px}
.xpbar .fill{height:100%;background:var(--gold);width:0}
main{padding-block:26px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .n{font-family:var(--display);font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{color:var(--fg2);font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--bg2);color:var(--fg);padding:9px 14px;border-radius:8px;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--bg3)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1200}
.btn.primary:hover{filter:brightness(1.05)}
.btn.aqua{background:var(--aqua);border-color:var(--aqua);color:#fff}
.btn.small{padding:6px 10px;font-size:.82rem}
.btn:focus-visible,.navbtn:focus-visible,.choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--bg3);color:var(--fg2)}
.pill.aqua{background:var(--aqua2);color:var(--aqua)}
.pill.gold{background:var(--gold2);color:var(--warn)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);cursor:pointer;text-align:left;width:100%;color:var(--fg)}
.item:hover{border-color:var(--aqua)}
.item .t{font-weight:700;flex:1;min-width:0}
.item .m{color:var(--fg2);font-size:.82rem}
.item .done{color:var(--good);font-weight:800}
.prose{display:flex;flex-direction:column;gap:12px;max-width:68ch}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.prose blockquote{margin:0;padding:10px 14px;border-left:4px solid var(--gold);background:var(--gold2);border-radius:0 8px 8px 0;font-style:italic}
.prose .pb{padding:12px 14px;border-radius:8px;background:var(--aqua2);border:1px dashed var(--aqua)}
.prose .pb b{color:var(--aqua)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{border:1px solid var(--line);background:var(--bg2);color:var(--fg);padding:12px 14px;border-radius:8px;text-align:left;font-size:.95rem}
.choice:hover{border-color:var(--aqua)}
.choice.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg2))}
.choice.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg2))}
.choice[disabled]{cursor:default}
.explain{padding:12px 14px;border-radius:8px;background:var(--bg3);font-size:.95rem}
.progress{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--aqua);transition:width .3s}
.flash{perspective:1200px}
.flash .face{min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:26px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);box-shadow:var(--shadow);font-size:1.12rem;text-align:center}
.flash .face.back{background:var(--aqua2);border-color:var(--aqua)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{padding:12px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font-weight:700;display:flex;flex-direction:column;gap:2px;align-items:center}
.rate button small{font-weight:400;color:var(--fg2);font-family:var(--mono);font-size:.7rem}
.rate .r0{border-color:var(--bad)} .rate .r1{border-color:var(--warn)} .rate .r2{border-color:var(--aqua)} .rate .r3{border-color:var(--good)}
.adtext{white-space:pre-wrap;font-family:var(--body);line-height:1.55;max-height:300px;overflow:auto;padding:14px;border-radius:8px;background:var(--bg3);border:1px solid var(--line);font-size:.93rem}
.adtext.open{max-height:none}
.layer{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.layer>button{width:100%;border:0;background:var(--bg2);color:var(--fg);padding:12px 14px;text-align:left;font-weight:700;display:flex;justify-content:space-between}
.layer>div{padding:12px 14px;border-top:1px solid var(--line);background:var(--bg3)}
textarea,input[type=text],select{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--fg)}
textarea{min-height:120px;resize:vertical}
.kill{background:color-mix(in srgb,var(--bad) 25%,transparent);border-bottom:2px solid var(--bad);border-radius:2px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;box-shadow:var(--shadow);z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.streak{font-family:var(--mono)}
.moduleTag{font-family:var(--mono);font-size:.7rem;color:var(--fg2)}
.glos dt{font-weight:700;font-family:var(--display)} .glos dd{margin:0 0 10px;color:var(--fg2)}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .bowl{font-size:2.6rem}
.tabbar{display:none}
.mission{border-left:4px solid var(--gold)}
.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.timeline div{background:var(--bg3);border-radius:6px;padding:8px;text-align:center;font-size:.8rem}
.timeline div b{display:block;font-family:var(--mono);font-size:.95rem}
.timeline div.cur{background:var(--gold2);border:1px solid var(--gold)}
.sr-only{position:absolute;left:-9999px} .goat{display:inline-flex;flex-direction:column;align-items:center;margin-left:8px;line-height:1;vertical-align:middle}.goat img{width:18px;height:auto}.goat b{font-family:var(--mono);font-size:.5rem;letter-spacing:.12em;color:var(--warn);margin-top:2px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.rail{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:40;justify-content:space-around}
  .tabbar button{border:0;background:transparent;color:var(--fg2);font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:8px;position:relative}
  .tabbar button .ic{font-size:1.25rem}
  .tabbar button.on{color:var(--aqua);font-weight:700}
  .tabbar .badge{position:absolute;top:0;right:0;background:var(--gold);color:#1a1200;font-size:.62rem;font-weight:700;padding:1px 5px;border-radius:99px;font-family:var(--mono)}
  .rate button{padding:10px 4px;font-size:.85rem}
  h1{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.langsw{display:flex;gap:6px;padding:8px 12px 0}
.langsw button{flex:1;border:1px solid var(--line);background:var(--bg2);color:var(--fg2);padding:6px 8px;border-radius:8px;font-size:.8rem;font-weight:700}
.langsw button.on{background:var(--aqua2);color:var(--aqua);border-color:var(--aqua)}
.langsw.big{padding:0;max-width:320px}
.langsw.big button{padding:10px 12px;font-size:.95rem}
</style>

<script>
const DATA_FR={"modules":[{"id":1,"title":"Market Intelligence (comprendre le marché)","desc":"Avant d'écrire un mot : où en est la tête du client (conscience) et combien le marché a déjà tout entendu (sophistication)."},{"id":2,"title":"Buyer Psychology (ce qui fait acheter)","desc":"Les 6 émotions d'achat, le parcours émotionnel, douleur ou désir, acheteur ≠ utilisateur, et l'intensité à respecter."},{"id":3,"title":"Copywriting Techniques (les outils d'écriture)","desc":"Parler leur langue, chasser les mots qui tuent, injecter du spécifique, boucles ouvertes, ponts, sens, future pacing, rythme, aveux et disqualification."},{"id":4,"title":"Hooks & Attention (arrêter le scroll)","desc":"Ce qui se passe en 0,5 seconde dans le cerveau, les phrases qui arrêtent, les 3 premières lignes, les erreurs qui tuent un hook."},{"id":5,"title":"Story & Drama (raconter pour vendre)","desc":"Les 3 types d'histoires, la structure UGC courte, les témoignages qui sonnent vrai, l'arc complet en 12 temps."},{"id":6,"title":"Zakaria à Evolve Marrakech + Eugene Schwartz","desc":"La présentation qui résume tout (peur, spécificité, mécanisme, histoire, expérience empruntée) et la méthode de travail du maître du copywriting."}],"lessons":[{"id":"l01","module":1,"num":"01","dur":"16 min","title":"Les 5 niveaux de conscience","body":"<p><b>L'idée :</b> avant d'écrire, sache où est mentalement ton prospect. Si tu parles « produit » à quelqu'un qui ignore qu'il a un problème, tu le perds ; si tu expliques le problème à quelqu'un qui compare déjà les produits, tu l'ennuies.</p>\n<ul>\n<li><b>Niveau 1, inconscient</b> (« je n'ai pas de problème ») : il a des symptômes mais ne les a pas étiquetés. Ton job : <b>miroir des symptômes</b>, puis nommer le problème et ses conséquences. Tu peux remuer le couteau. Exemple du cours : « 3 h du matin, yeux grands ouverts, draps trempés… ce n'est pas le stress, ce n'est pas l'âge » (ménopause non nommée). C'est le plus gros public et le plus dur à convertir.</li>\n<li><b>Niveau 2, conscient du problème</b> (« j'ai un problème, je ne sais pas quoi faire ») : valide, agite un peu, puis <b>introduis une catégorie de solution</b>. « Ta fille prenait 47 selfies pour en garder un ; maintenant elle évite l'appareil. Voilà ce qui se passe et ce qui marche vraiment. »</li>\n<li><b>Niveau 3, conscient des solutions</b> (« il existe des solutions, laquelle ? ») : il a essayé (glucosamine 8 mois, rien). <b>Ne remue pas le couteau</b> : il souffre déjà, il fuirait (effet « paralysie »). Explique pourquoi les autres solutions échouent, puis ton <b>mécanisme unique</b> + preuve.</li>\n<li><b>Niveau 4, conscient du produit</b> (« je connais, mais pourquoi acheter ? ») : milieu de tunnel, retargeting. Lève les objections, empile la preuve, garantie, offre irrésistible. « Tu as cet onglet ouvert depuis 3 jours… 47 000 mamans ont été là où tu es. »</li>\n<li><b>Niveau 5, le plus conscient</b> (« je suis prêt, donne-moi une raison ») : dégage du chemin. CTA clair, meilleure offre, urgence. « Ton panier se sent seul. -40 % jusqu'à minuit. »</li>\n</ul>\n<p><b>Règle de traffic :</b> trafic froid = niveaux 1-3 ; chaud = 3-4 ; retargeting = 4-5 ; e-mail = 3-5. La plus grosse erreur : écrire du niveau 5 (« -40 % ») à des gens de niveau 2.</p>\n<blockquote>« Talking to problem-aware people as if they were product-aware: you lost them. The reverse: you bore them. » (vers 00:33)</blockquote>"},{"id":"l02","module":1,"num":"02","dur":"10 min","title":"Les 5 stades de sophistication","body":"<p><b>L'idée :</b> la conscience, c'est la tête du client ; la sophistication, c'est l'usure du marché. Un marché sophistiqué est immunisé contre les promesses simples.</p>\n<ol>\n<li><b>Stade 1, marché vierge</b> : une simple promesse suffit (« clear acne »). N'existe presque plus en DTC (vente directe en ligne).</li>\n<li><b>Stade 2, deuxième vague</b> : on agrandit la promesse (vitesse, degré, portée) : « clear acne in 14 days, even stubborn hormonal acne, guaranteed ».</li>\n<li><b>Stade 3, marché sceptique</b> : la promesse ne suffit plus, il faut un <b>mécanisme</b> : « ce n'est pas la bactérie, c'est l'inflammation en dessous ; ce produit cible le cycle inflammatoire ». Ménopause : « ton hypothalamus se trompe de température, les œstrogènes ne réparent pas ça ». La plupart des marchés santé/beauté sont ici ou au-dessus.</li>\n<li><b>Stade 4, marché épuisé</b> : tous les mécanismes ont été vus. Deux options : <b>un nouveau mécanisme</b> (« l'acné ne commence pas sur la peau mais dans l'intestin ») ou <b>niche down</b> (« pas pour tout le monde : pour la femme de 62 ans qui veut encore randonner », « si tu n'as pas de SOPK, n'achète pas »).</li>\n<li><b>Stade 5, marché mort</b> : plus aucune promesse ni mécanisme ne passe (perte de poids). Il reste la <b>personnalité, l'histoire, l'identité</b> : « je ne vais pas te promettre une peau nette. J'ai eu 11 ans d'acné… voilà ce qui s'est passé pour moi ». Zakaria utilise des techniques de stade 5 (histoire, aveu, connexion humaine) même sur des marchés de stade 3-4.</li>\n</ol>\n<p><b>Où sont leurs avatars :</b> acné ado stade 4, ménopause stade 3-4, genoux stade 3, cheveux SOPK stade 3 (la niche rend le marché moins sophistiqué).</p>"},{"id":"l03","module":1,"num":"03","dur":"14 min","title":"Diagnostiquer la position de ton marché","body":"<p><b>L'idée :</b> on ne devine pas, on diagnostique. Chaque marché a une <b>conscience de base</b> (baseline) fixée par l'ancienneté du problème, la quantité de pub déjà vue, et ce dont on parle publiquement. La source de trafic ne change pas cette base, elle la <b>décale vers le haut</b> : froid = base, chaud = base +1, retargeting = +1 à +2, e-mail/recherche de marque = niveau 5.</p>\n<ul>\n<li>Genoux 55+ : marché mûr, 20 ans de pubs glucosamine → base <b>niveau 3</b>. Même le trafic froid est « solution-aware » : il ne demande pas « ai-je un problème ? » mais « laquelle marche ? ».</li>\n<li>Ménopause : base <b>niveau 2-3</b>, avec une part de niveau 1 (symptômes non reliés). On peut faire deux pubs : une qui éduque les inconscientes, une qui différencie pour les autres.</li>\n<li>Cheveux SOPK : <b>deux niveaux en même temps</b>. Niveau 3 sur la perte de cheveux (elle a essayé la biotine, les shampoings), niveau 1 sur la cause (elle ne sait pas que c'est hormonal). D'où la formule : <b>reconnais ce qu'elle a essayé → explique pourquoi ça a échoué → révèle la vraie cause → montre que ta solution la cible</b>. Mauvaise approche : « Did you know women lose hair? » (insultant) ou « essaie notre sérum » (du pareil au même).</li>\n</ul>\n<p><b>Diagnostiquer la sophistication :</b> lire les pubs concurrentes depuis 3-6 mois (si une pub tourne depuis 6 mois, elle marche : quel stade ?), les avis Amazon 3 étoiles (ce qu'ils ont essayé, ce dont ils doutent), Reddit et forums (ce qu'ils croient, ce qu'on leur a dit).</p>\n<p><b>Erreurs classiques :</b> croire que le trafic froid est toujours inconscient ; écrire du niveau 1 à un marché de niveau 3 (« did you know knee pain affects millions? ») ; croire que tous les marchés ont la même base ; ignorer la base dans les créas.</p>\n<blockquote>Checklist avant d'écrire : depuis quand le problème existe ? combien de pub le marché a vu ? que sait déjà la personne moyenne ? quelles promesses et mécanismes ont déjà été faits ? Ai-je besoin d'un mécanisme (stade 3) ? d'un nouveau mécanisme ou d'une niche (stade 4) ?</blockquote>"},{"id":"l04","module":1,"num":"04","dur":"14 min","title":"La matrice conscience × sophistication","body":"<p><b>L'idée :</b> les deux axes se croisent, et chaque case impose une stratégie.</p>\n<ul>\n<li><b>Faible conscience × faible sophistication</b> (océan bleu) : éduquer avec des promesses simples. Quasi inexistant aujourd'hui.</li>\n<li><b>Faible conscience × forte sophistication</b> (le piège) : la femme a des bouffées de chaleur mais n'a pas dit « ménopause » ; le marché ménopause, lui, est saturé. Erreur : « elle est inconsciente, donc je n'ai qu'à éduquer ». Dès que tu lui nommes son problème, elle entre dans un marché sophistiqué, va googler, et achète chez un concurrent qui a un mécanisme. <b>Il faut gagner tout le parcours dans une seule pièce</b> : symptôme reconnu → nommer le problème → transition immédiate vers le mécanisme → preuve → fermer avant qu'elle compare.</li>\n<li><b>Forte conscience × faible sophistication</b> : offre directe (« tu as besoin de X, on vend X »). Rare, et la concurrence arrive vite.</li>\n<li><b>Forte conscience × forte sophistication</b> (l'océan rouge où vivent la plupart des marques) : mécanisme fort + preuves empilées + histoire/personnalité + offre irrésistible. Les témoignages, les études, les labels protègent aussi juridiquement et permettent de scaler.</li>\n</ul>\n<p>C'est pour ça que tout le cours insiste sur <b>création de mécanisme, empilement de preuves, histoire et connexion émotionnelle</b> : c'est ce qui gagne dans un marché saturé.</p>"},{"id":"l05","module":1,"num":"05","dur":"21 min","title":"Adapter le copy à la position du marché (pratique)","body":"<p><b>L'idée :</b> même produit, cinq copies différentes selon le niveau de conscience, et trois selon le stade de sophistication.</p>\n<p><b>Même complément ménopause, 5 niveaux :</b> N1 symptômes purs sans le mot « ménopause » ; N2 nommer le problème (« la ménopause vole ton sommeil, voilà quoi faire ») ; N3 reconnaître les tentatives (black cohosh, HRT) et différencier par le mécanisme ; N4 « tu as visité cette page trois fois cette semaine, voilà ce qui a convaincu 7 000 femmes » ; N5 « -40 %, livraison demain ».</p>\n<p><b>Règle d'intensité de la douleur :</b></p>\n<ul>\n<li><b>Niveaux 1-2 : remue le couteau</b>, ils ne sentent pas l'urgence. « Tu te dis que c'est normal ; dans 6 mois tu ne pourras plus cacher ta raie, dans 12 mois tu achèteras des postiches. »</li>\n<li><b>Niveau 3 : reconnais la douleur brièvement, offre le soulagement tout de suite.</b> Mauvais : « ta ligne recule, ta confiance part avec tes cheveux » (elle scrolle pour se protéger). Bon : « voilà ce qui marche vraiment en 2026 pour la perte de cheveux SOPK ». Image du cours : l'ami au casino qui a tout perdu, tu ne lui dis pas « je t'avais prévenu », tu lui montres une sortie.</li>\n<li><b>Niveaux 4-5 : aucune douleur</b>, juste la raison d'acheter maintenant.</li>\n</ul>\n<p><b>Même complément genoux, 3 stades :</b> stade 2 = promesse plus grosse + preuve + garantie ; stade 3 = mécanisme (« le cartilage se casse plus vite qu'il ne se reconstruit à cause de 3 choses : inflammation, déshydratation, stress oxydatif ; on ferme le drain avant de remplir la baignoire ») ; stade 4 = nouveau mécanisme (« la douleur ne vient pas du cartilage mais du liquide synovial, on répare l'huile, pas les pièces ») ou nouvel avatar.</p>\n<blockquote>Checklist : pour quelle source de trafic ? quel niveau ? quel stade ? mon hook colle-t-il au niveau ? mon corps au stade ? ai-je un mécanisme (stade 3) ? suis-je différencié (stade 4) ?</blockquote>"},{"id":"l06","module":2,"num":"06","dur":"22 min","title":"Les 6 émotions d'achat","body":"<p><b>L'idée :</b> on achète avec l'émotion, on justifie avec la logique. Six émotions universelles ; ton copy doit en viser une ou deux à fond, pas six à moitié.</p>\n<ol>\n<li><b>Relief (soulagement)</b> : faire cesser la douleur. La plus puissante quand il y a douleur chronique ou honte. Copy : « Imagine demain matin, le premier pas hors du lit sans la douleur. » (langage sensoriel).</li>\n<li><b>Nurturance (protéger)</b> : on fait plus pour ceux qu'on aime que pour soi. <b>Dominante dès que l'acheteur n'est pas l'utilisateur</b> : parents, maîtres d'animaux, enfants pour leurs parents. « Tu ne peux pas prendre son acné sur ton visage, mais tu peux lui donner ça. »</li>\n<li><b>Belonging (appartenir)</b> : l'exclusion fait aussi mal qu'une douleur physique. « 47 000 femmes savent exactement ce que tu vis. Tu n'es pas seule, tu es l'une des nôtres. »</li>\n<li><b>Identity (redevenir soi)</b> : « tu n'es pas la fille à l'acné, c'est juste quelque chose qui est arrivé à ton visage ». Perte d'identité par la douleur (le randonneur devenu « l'homme aux mauvais genoux »).</li>\n<li><b>Security (sécurité)</b> : aversion à la perte, peur que ça empire. « Chaque mois que tu attends, des follicules meurent et ne reviennent pas. » Souvent placée juste avant le CTA.</li>\n<li><b>Status (être vu, respecté)</b> : « dans 30 jours, tu ne seras plus invisible », « le grand-père que les petits-enfants veulent montrer ».</li>\n</ol>\n<p><b>Diagnostiquer l'émotion dominante</b> : relis ton dossier avatar et compte les signaux. Relief : « I couldn't take it anymore ». Nurturance : « watching her suffer ». Belonging : « nobody understands ». Identity : « I don't feel like myself ». Security : « what if it gets worse ». Status : « I can't take pictures ». Note chaque émotion sur 10, garde les 2-3 plus fortes.</p>"},{"id":"l07","module":2,"num":"07","dur":"9 min","title":"Le parcours émotionnel vers l'achat","body":"<p><b>L'idée :</b> personne ne passe de « jamais entendu parler » à « prends mon argent » d'un coup. Cinq étapes, chacune a un déclencheur.</p>\n<ol>\n<li><b>Indifférence</b> → il faut une rupture : une image si précise qu'il se dit « c'est moi » (« ce matin tu es resté assis 30 secondes au bord du lit avant de pouvoir te lever. Personne n'a remarqué. Ta femme, si. »).</li>\n<li><b>Curiosité</b> (« dis-m'en plus ») → une information nouvelle, un mécanisme, une boucle ouverte (« ce n'est pas tes œstrogènes, c'est ton hypothalamus »).</li>\n<li><b>Espoir</b> (« ça pourrait marcher pour moi ») → une histoire de quelqu'un comme lui, un résultat précis, pas une promesse (« Tommy, 65 ans, ex-coureur, a fait 3 miles samedi, première fois en 4 ans »). L'espoir est fragile : sur-promettre le tue.</li>\n<li><b>Conviction</b> (« ça va marcher pour moi ») → volume de preuves, objections traitées, études, garantie.</li>\n<li><b>Urgence</b> (« je dois le faire maintenant ») → rareté réelle, coût de l'attente, le problème qui progresse.</li>\n</ol>\n<p><b>Où dans le tunnel :</b> la pub = indifférence → curiosité → espoir ; le haut de la landing page = espoir → conviction ; le bas = conviction → urgence. Plus grosse erreur : sauter à l'urgence (« -50 % aujourd'hui ») sans avoir construit espoir et conviction.</p>"},{"id":"l08","module":2,"num":"08","dur":"12 min","title":"Douleur ou désir : les deux portes","body":"<p><b>L'idée :</b> les 6 émotions sont des pièces ; douleur et désir sont deux portes vers la même pièce. <b>Douleur = s'éloigner de</b> (« stop waking up at 3 a.m. drenched ») ; <b>désir = aller vers</b> (« sleep through the night like you used to »). Les deux mènent au soulagement.</p>\n<ul>\n<li>Relief : stop the suffering / feel at peace. Nurturance : stop watching her suffer / give her the confidence she deserves. Identity : stop being the hopeless mom / be the mom who found the answer. Security : stop the threat / feel protected. Status : stop being overlooked / be respected. Belonging : stop hiding from photos / be in the picture, front row.</li>\n<li><b>Quand mener par la douleur :</b> niveaux 1-2 (ils ignorent ou banalisent). <b>Par le désir :</b> niveau 3+ (ils vivent la douleur chaque jour, ils ont déjà été brûlés, ils ont besoin d'espoir). Trop de douleur = fuite ; trop de désir = rêverie sans action.</li>\n<li><b>La séquence qui convertit :</b> douleur → espoir → agitation → espoir → enjeux → close. Ratio selon l'avatar : maman acné 60/40 douleur, genoux 50/50, ménopause 40/60 désir, SOPK 50/50.</li>\n<li><b>Règle :</b> la douleur fait arrêter le scroll, le désir fait cliquer.</li>\n</ul>\n<p>Signaux de douleur dans la recherche : « I can't stand », « I'm so tired of », « I've tried everything ». Signaux de désir : « I wish I could », « I want to be again », « I dream of ».</p>"},{"id":"l09","module":2,"num":"09","dur":"11 min","title":"Acheteur ≠ utilisateur : convaincre deux personnes","body":"<p><b>L'idée :</b> la maman achète, l'ado utilise ; le maître achète, le chien utilise. Deux psychologies. <b>On écrit à celui qui paie, on montre la douleur de celui qui utilise.</b></p>\n<ul>\n<li><b>Acné ado :</b> l'ado ressent honte, anxiété sociale (« everyone looks at me ») ; la maman ressent inquiétude, culpabilité, impuissance (« I hate seeing her like this »). Hook pour la maman : une scène qu'ELLE reconnaît (« elle passait la porte en racontant sa journée, maintenant elle file dans sa chambre »).</li>\n<li><b>Chien à articulations :</b> l'utilisateur ne parle pas. Tout passe par ce que le maître <b>observe</b> (lent à se lever, ne saute plus), ce qu'il <b>devine</b> (« he can't tell you it hurts, but you know »), ce qu'il <b>ressent</b> (culpabilité, impuissance), ce qu'il <b>veut</b> (le revoir courir à la porte).</li>\n<li><b>Structure en 6 blocs :</b> hook (symptôme visible par l'acheteur) → douleur de l'utilisateur vue par l'acheteur → émotion de l'acheteur → pont (« il y a quelque chose que tu peux faire ») → preuve (histoires d'utilisateurs comme le sien) → CTA formulé comme « aider » (« give him back his walks »).</li>\n<li><b>Erreurs :</b> écrire seulement à l'utilisateur (l'ado n'a pas de carte bancaire) ; écrire seulement à l'acheteur sans montrer la souffrance (pas de carburant émotionnel).</li>\n</ul>"},{"id":"l10","module":2,"num":"10","dur":"15 min","title":"Intensité émotionnelle et timing","body":"<p><b>L'idée :</b> adapte le ton à la température de l'avatar.</p>\n<ul>\n<li><b>Aigu</b> (ça brûle maintenant) : il cherche une solution aujourd'hui, peu de résistance au prix. Copy courte, directe, chemin rapide vers l'achat : « tu peux à peine marcher depuis deux jours ; ça marche en 7 jours ou remboursé ; commence ce soir ». Ne pas remuer le couteau : il est déjà intense.</li>\n<li><b>Chronique</b> (il s'est habitué) : « c'est la vie », il a réduit ses attentes. Copy : <b>réactiver</b>, montrer ce qu'il a abandonné (« tu ne randonnes plus, tu te dis que ça va, ça ne va pas : tu t'es juste habitué à moins »).</li>\n<li><b>Aspirationnel</b> (ce serait bien) : pas de douleur, forte résistance au prix, décision lente, 2 à 3 fois plus de points de contact. Il faut <b>créer</b> l'urgence : la pente glissante (« compare avec ta photo d'il y a 5 ans »), le point de non-retour (« un follicule mort ne revient pas »), le coût caché (« combien de temps pour te maquiller chaque matin ? »), le futur soi (« à 50 ans, version A ou version B »), le regret anticipé, le petit investissement contre le gros résultat.</li>\n</ul>\n<p><b>Déplacer l'intensité :</b> de chronique à aigu (« trois ans comme ça, et trois de plus ? »), d'aspirationnel à chronique puis aigu. Erreurs : copy « urgence » sur un public aspirationnel (ça sonne faux) ; copy mollassonne (« you might see improvement over time ») sur un public aigu.</p>"},{"id":"l11","module":3,"num":"11","dur":"8 min","title":"Fondation : parler leur langue","body":"<p><b>L'idée :</b> ce n'est pas une technique, c'est le socle. Si ton avatar a 58 ans et que tu écris comme un TikTokeur de 24, il scrolle. <b>Voix accordée = confiance.</b></p>\n<ul>\n<li><b>Vocabulaire :</b> genoux 55+ disent « my knees are shot », « bone on bone », pas « joint optimization ». Maman acné dit « her face is broken out », pas « dermatological intervention ».</li>\n<li><b>Longueur des phrases :</b> pros = phrases longues ; ados = courtes, pas forcément complètes ; seniors = claires sans jargon ; maman stressée = droit au but.</li>\n<li><b>Formalité :</b> ménopause 45-60 = décontractée mais respectueuse (ni clinique, ni « girl, the hot flashes are not it ») ; SOPK 20-30 ans = relâchée (« you're 26 and you can see your scalp, what the f… »).</li>\n<li><b>Température émotionnelle :</b> frustré → empathique, pas joyeux ; sceptique → honnête, pas vendeur.</li>\n</ul>\n<p>Une voix juste rend n'importe quel créateur UGC crédible, même moyen, parce que le script sonne comme la personne. Une voix fausse (jargon IA, corporate) fait sonner faux même un bon acteur. Tout vient du dossier avatar : commentaires, avis, appels.</p>"},{"id":"l12","module":3,"num":"12","dur":"9 min","title":"Les mots qui tuent la conversion","body":"<p><b>L'idée :</b> certaines formules déclenchent « c'est une pub » et le mur monte.</p>\n<ul>\n<li><b>Formules usées :</b> « I was skeptical at first », « game changer », « life changing », « this product is amazing », « I can't believe it actually works », « just try it / nothing to lose », « best decision I ever made ». Le remède est toujours le même : <b>montre au lieu de nommer</b>. « Game changer » → « I slept seven hours for the first time in eight months ». « Skeptical » → « I rolled my eyes when my sister sent me this ». « Just try it » → traite l'objection réelle (« you've been burned before, here's why this is different, here's your money back »).</li>\n<li><b>Mots faibles à couper :</b> very, really, just, things, stuff, kind of, sort of, honestly, to be honest, I think, I feel like.</li>\n<li><b>Jargon corporate</b> (OK sur une page produit ou dans la bouche d'une autorité, jamais dans un témoignage) : industry leading, best in class, clinically proven, scientifically formulated, premium, world class. Humain : « here's what's in it and why ».</li>\n<li><b>Déclencheurs de scepticisme</b> (ça marchait en 2010) : doctors don't want you to know, the secret, miracle, breakthrough, works instantly, 100% guaranteed, lose 13 pounds in 13 days, one weird trick, you won't believe.</li>\n</ul>\n<blockquote>Le test décisif : est-ce que ça sonne comme toutes les pubs du secteur ? Pourrait-on remplacer le nom du produit par un concurrent ? Une vraie personne dirait-elle ça ? Si oui, réécris.</blockquote>"},{"id":"l13","module":3,"num":"13","dur":"9 min","title":"Injection de spécificité (la technique n° 1)","body":"<p><b>L'idée :</b> le vague = incroyable, oubliable, ignorable. Le précis = crédible, mémorable, convaincant. Le cerveau utilise la précision comme raccourci vers la vérité : « pourquoi diraient-ils 87 % et pas 90 ? ».</p>\n<p><b>7 façons d'être spécifique :</b></p>\n<ol>\n<li><b>Chiffres</b> : « 47,342 customers as of last Tuesday » ; « 12.7 pounds in 8 weeks ».</li>\n<li><b>Temps</b> : « day 9 », « I've had acne since I was 13, I'm 28, that's 15 years ».</li>\n<li><b>Sensoriel</b> : « that sharp stabbing pain when you first stand up », « no more bumps when you run your fingers across your cheeks ».</li>\n<li><b>Scénario</b> : « imagine your daughter asking for a photo together and you say yes without checking your angle ».</li>\n<li><b>Personne</b> : « Michelle, 47, Ohio, two teenagers, tried Proactiv, Differin, a dermatologist ».</li>\n<li><b>Processus</b> : « most supplements lubricate the joint ; we target the inflammation that destroys the cartilage ».</li>\n<li><b>Comparaison</b> : « biotin alone: 23% saw improvement ; our formula: 87% ».</li>\n</ol>\n<p><b>Timeline semaine par semaine</b> = la forme la plus convaincante : « week 1 active breakouts calm down 40%, week 2 new breakouts drop 70%, week 3 clear stretches, week 4 the moment in the mirror ».</p>\n<p><b>Règles :</b> ne jamais inventer (si tu n'as pas les données, va les chercher) ; ne pas sur-spécifier (« 23.7 % en 14,3 jours » sonne forcé) ; backer chaque chiffre.</p>"},{"id":"l14","module":3,"num":"14","dur":"17 min","title":"Boucles ouvertes : garder l'attention","body":"<p><b>L'idée :</b> le hook attrape, la boucle retient. Une boucle ouverte = une pensée incomplète ; le cerveau déteste et continue pour la refermer (effet Zeigarnik : on se souvient mieux des tâches inachevées, comme la réplique qu'on aurait dû sortir, trois heures après).</p>\n<p><b>Faible vs forte :</b> « I'll tell you more » (faible) contre « what she found in her husband's search history changed everything, but it wasn't what you think » (forte : précise, inattendue, chargée).</p>\n<p><b>Types de boucles :</b></p>\n<ul>\n<li><b>« Ce qu'ils ne veulent pas que tu saches »</b> (ennemi) : « there's a reason Proactiv doesn't work for most teens, and the company knows it ».</li>\n<li><b>Story interrupt</b> : on commence une histoire et on la coupe au pic (« her husband knocked: \"I found something. You're not going to believe where.\" I'll tell you in a minute, but first… »).</li>\n<li><b>Contradiction</b> : « everything you've been told about knee pain is wrong, and what you do every day thinking it helps is making it worse ».</li>\n<li><b>Les chiffres ne collent pas</b> : « n° 1 depuis 15 ans, et seulement 12 % des femmes SOPK en profitent ; follow the money ».</li>\n<li><b>« Avant de te le dire »</b> : retarder la réponse avec un contexte nécessaire (« if I just gave you the name, you'd Google it, read a 2019 blog and give up »).</li>\n<li><b>Boucles empilées</b> : « three things are destroying your knees : the first is obvious, the second will surprise you, the third your doctor does by accident ».</li>\n</ul>\n<p><b>Où :</b> dans les 3 premières lignes, avant chaque section explicative (pour relancer l'énergie), avant la demande, en transition de section ; la pub ouvre, la landing ferme et rouvre.</p>\n<p><b>Règles :</b> toujours refermer (sinon trahison), la réponse doit valoir l'attente, max 4 boucles actives, le détour doit être intéressant en lui-même.</p>"},{"id":"l15","module":3,"num":"15","dur":"8 min","title":"Bucket brigades et transitions","body":"<p><b>L'idée :</b> chaque phrase est une décision (« je continue ? »). Les bucket brigades décident à la place du lecteur : elles créent l'élan.</p>\n<ul>\n<li><b>Continuation :</b> But here's the thing. Here's why this matters. And that's not all. It gets better. Let me explain.</li>\n<li><b>Contradiction :</b> But. However. Here's the catch. Not exactly.</li>\n<li><b>Révélation :</b> Here's the truth. The real reason. What nobody tells you. In other words.</li>\n<li><b>Question :</b> So what does this mean for you? Sound familiar? See where I'm going with this?</li>\n<li><b>Histoire :</b> Picture this. Imagine. Let me give you an example.</li>\n<li><b>Urgence :</b> Here's the kicker. The bottom line. Here's what it comes down to.</li>\n</ul>\n<p><b>Avant / après :</b> « Glucosamine is a popular supplement. Studies show mixed results. This is because… » (plat) contre « You've probably tried glucosamine. Here's the thing: some swear by it, others feel nothing. So what's going on? The answer might surprise you… But here's what nobody tells you… And this is where it gets interesting. » (élan).</p>\n<p><b>Où :</b> après le hook, entre paragraphes, avant un point clé, après une explication dense (« OK, that's a lot. Here's the simple version »), avant le CTA. <b>Pas à chaque phrase</b> : aux transitions et aux baisses d'énergie, environ tous les 3-5 paragraphes. Varie-les, et accorde-les au ton de l'avatar (« listen up y'all » ne marche pas pour un pro de 65 ans).</p>"},{"id":"l16","module":3,"num":"16","dur":"11 min","title":"Langage sensoriel : le faire ressentir","body":"<p><b>L'idée :</b> une affirmation se discute, une expérience se ressent. Quand tu lis « that sharp stabbing pain when you first stand up », ton cerveau active la zone de la douleur. Le sensoriel contourne le scepticisme.</p>\n<ul>\n<li><b>Vue :</b> « look at your part: those tiny hairs at your hairline weren't there eight weeks ago ».</li>\n<li><b>Toucher</b> (le plus intime) : « run your fingers across your cheek, no bumps, no rough patches, smooth like someone else's skin ».</li>\n<li><b>Son</b> (souvent oublié) : « no more crunching, your knees are silent on the stairs », « the alarm, not the hot flash, wakes you ».</li>\n<li><b>Goût, odeur</b> quand c'est pertinent : « he sniffs and walks away ? Not with this. He hears the bag and he's there. »</li>\n<li><b>Sensations internes :</b> « that knot in your stomach when someone pulls out a phone… gone ».</li>\n</ul>\n<p><b>Convertir un bénéfice abstrait :</b> demande « que verra-t-il ? que sentira-t-il ? qu'entendra-t-il ? qu'est-ce qui n'arrivera plus ? quel moment précis sera différent ? ». « Better sleep » → « the clock says 6 a.m., the sheets are dry, you're confused because you don't remember waking up ».</p>\n<p><b>La mini-movie :</b> décor (samedi matin, 7 h, les petits-enfants dehors) → détails sensoriels → contraste avec avant (« you don't grab the nightstand ») → émotion → résolution (« you're in the yard with them, not watching anymore »).</p>"},{"id":"l17","module":3,"num":"17","dur":"10 min","title":"Future pacing : vivre le résultat avant d'acheter","body":"<p><b>L'idée :</b> quand on imagine vivement un futur, le cerveau le vit (mêmes zones, même dopamine). Une fois que le lecteur a « déjà » ressenti la transformation, ne pas acheter revient à perdre quelque chose qu'il possède.</p>\n<p><b>Déclencheurs de dopamine à viser :</b> victoire, soulagement, amour/connexion, fierté, surprise positive, reprise de contrôle. Faible : « you'll feel better ». Fort : 2-3 déclencheurs + détails vifs.</p>\n<p><b>Les ingrédients d'un bon future pacing (la « mini-movie ») :</b></p>\n<ul>\n<li>Un <b>moment précis</b> : « 7:14 a.m. on a Saturday », pas « someday ».</li>\n<li>Un <b>déclencheur sensoriel</b> : le rire qui vient de la salle de bain, le t-shirt sec, l'élastique qu'on tourne deux fois au lieu de quatre.</li>\n<li><b>Un témoin</b> : la fille qui pleure sur le porche, le mari qui demande « what are you doing differently? ». La validation extérieure = dopamine.</li>\n<li>Une <b>réalisation interne</b> : « wait, that's it? », « you forgot what this feels like ».</li>\n<li>Un <b>pic émotionnel</b> qu'on laisse respirer.</li>\n<li>Le <b>cadrage « nouveau normal »</b> : « this isn't a miracle, this is just Tuesday ».</li>\n</ul>\n<p><b>Le test physique :</b> lis-le à voix haute. Si ton rythme cardiaque ne change pas, si tu ne souris pas, si tes yeux ne piquent pas, ce n'est pas assez fort. Placement : juste avant le CTA.</p>"},{"id":"l18","module":3,"num":"18","dur":"8 min","title":"Rythme et flow : la musique du copy","body":"<p><b>L'idée :</b> le bon copy a une musique. Phrases courtes = coups de poing (points clés, pics émotionnels, pauses après un bloc long). Phrases longues = élan (peindre une image, raconter, expliquer). Tout court = robot ; tout long = essoufflant.</p>\n<p><b>Le mélange :</b> long (frustration accumulée : « the glucosamine, the turmeric, the injections, the stretches from YouTube, the cream from Amazon… ») → court (« Nothing worked. ») → court (« I'm going to tell you why. ») → moyen (mécanisme) → court (CTA). Comme un toboggan (Sugarman, « slippery slide ») : chaque élément pousse vers le suivant.</p>\n<p><b>Outils :</b> fragments (« Not anymore. Until now. »), <b>règle de trois</b> (« no pain, no stiffness, no hesitation »), <b>parallélisme</b> (« you've tried the products, you've seen the doctors, you've read the articles »), <b>montée en intensité</b> (« it works. It works fast. It works fast and lasts. »).</p>\n<blockquote>Test ultime : lis à voix haute (ou enregistre-toi). Là où tu manques de souffle, c'est trop long ; là où ça hache, trop court ; là où tu t'ennuies, ça manque de boucle.</blockquote>"},{"id":"l19","module":3,"num":"19","dur":"14 min","title":"L'aveu qui coûte (damaging admission)","body":"<p><b>L'idée :</b> dire du mal de son produit, exprès, rend tout le reste crédible. Tout le monde attend 100 % positif ; quand tu avoues un défaut, le cerveau conclut « ils sont honnêtes, donc le reste est vrai ». Avis : « We're number two. We try harder. » Buckley's : « It tastes awful. And it works. » Listerine : « the taste you hate, twice a day ».</p>\n<p><b>Types d'aveux :</b></p>\n<ul>\n<li><b>Limite :</b> « this isn't magic, it takes 14 days ; if you want overnight, this isn't for you ».</li>\n<li><b>Inconvénient :</b> « it's not cheap », « you have to take it every day, miss a week and you slow your progress », « it smells like medicine, not a gummy ».</li>\n<li><b>Qui ce n'est pas pour :</b> « if your doctor said bone on bone, see a surgeon first ».</li>\n<li><b>Prix :</b> « $79, because we use the clinical-grade form : 87 % absorbed vs 15 % for the CVS bottle ».</li>\n<li><b>Échecs passés :</b> « version one flopped, 40 % results ; version three, 87 % ».</li>\n<li><b>Ça ne marche pas pour tout le monde :</b> « 30 % don't respond ; for the 87 % who do… and the guarantee tells you which group you're in ».</li>\n</ul>\n<p><b>Formule :</b> aveu + pivot (« ça prend 14 jours PARCE QUE ça répare au lieu de masquer »). <b>Le cas « ça soulage mais ne guérit pas » :</b> si rien sur le marché ne guérit, vends honnêtement le soulagement (« it won't make menopause disappear, but it makes it bearable ») : moins de remboursements, plus de fidélité, et tu es le seul honnête dans une foule de « cures ».</p>\n<p><b>Règles :</b> un vrai défaut, pas un faux (« notre seul défaut, c'est qu'on marche trop bien ») ; un défaut qui ne détruit pas la proposition de valeur ; un ou deux par pièce, pas dix.</p>"},{"id":"l20","module":3,"num":"20","dur":"7 min","title":"Takeaway et disqualification","body":"<p><b>L'idée :</b> repousser pour attirer. Dis « ce n'est pas pour toi si… » et les bons clients veulent prouver qu'ils sont les bons. Psychologie inverse + rareté (« only for people who… ») + confiance (un vendeur qui dit « ce n'est pas pour vous » paraît honnête) + filtre (moins de mauvais clients, moins de remboursements).</p>\n<ul>\n<li><b>Disqualificateurs :</b> « don't buy this if you want overnight results / won't take it daily / have structural damage ».</li>\n<li><b>Cadre d'exclusivité :</b> « this is for the mom who has tried everything and is ready to try one more thing. If you're looking for the cheapest option, this isn't it. »</li>\n<li><b>Avertissement honnête :</b> « for the first 4-6 weeks you may see nothing. Most people quit. If you can commit to 90 days, the results are worth it. »</li>\n<li><b>Le prix comme filtre :</b> « $79 a month. Walmart has a $12 bottle. It probably won't work, but it's $12. This isn't for people who want cheap. »</li>\n</ul>\n<p><b>Structure :</b> pour qui ce n'est pas → pourquoi → pour qui c'est → « if that's you, keep reading ; if not, I just saved you $79 ».</p>"},{"id":"l21","module":4,"num":"21","dur":"31 min","title":"La psychologie de l'attention : pourquoi on s'arrête (ou pas)","body":"<p><b>L'idée :</b> tu ne concours pas contre d'autres pubs, mais contre l'ex, les stories, le chat, les enfants, 10 000 messages. L'attention est la ressource la plus rare : on la <b>vole</b>, on ne la mérite pas.</p>\n<p><b>Ce qui se passe en 0,5 seconde :</b> 0-100 ms détection (quelque chose de nouveau) ; 100-300 ms l'amygdale trie <b>menace / récompense / ignorer</b> (inconscient) ; 300-500 ms le cortex demande « <b>est-ce pour moi ?</b> » ; 500 ms décision consciente. La plupart des pubs meurent avant 300 ms. Ton hook parle au cerveau reptilien, pas à la logique.</p>\n<p><b>Le cerveau reptilien répond à :</b> la menace (« this ingredient is destroying your joints »), l'opportunité (« I dropped my keys and picked them up without thinking »), la nouveauté/inattendu, <b>soi</b> (« women over 50 », mon nom, ma tribu), le contraste (« from four hot flashes to zero »), l'émotion forte (visages, pleurs, rires).</p>\n<p><b>Le scroll est une transe :</b> 1,7 s par contenu, 3 contenus par seconde, moins de 5 % traités consciemment. On brise la transe par le contraste visuel, la pertinence directe, la rupture de schéma (la 3D de PetLab), la pointe émotionnelle, la boucle ouverte.</p>\n<p><b>Hiérarchie des déclencheurs :</b> 5 <b>survie</b> (« this could kill your dog », 100 %) > 4 <b>douleur/peur de perte</b> (95 %) > 3 <b>identité</b> (85 %) > 2 <b>opportunité/désir</b> (70 %) > 1 <b>curiosité/nouveauté</b> (50 %). L'aversion à la perte bat le gain. Si tu utilises un niveau 1 quand un niveau 4 est possible, tu laisses de l'attention sur la table.</p>\n<p><b>« Est-ce pour moi ? »</b> passe si le hook touche : leur démographie, leur situation exacte, leur identité, leur douleur, leur désir, leur ennemi, ou leurs échecs passés.</p>\n<p><b>L'équation :</b> attention = (pertinence × émotion × nouveauté) / effort. « Revolutionary joint supplement » = 3×1×1/2 = 1,5 (scroll). « Still can't get off the floor without holding onto something » = 9×7×6/1 = 378 (stop).</p>\n<p><b>Hook fatigue :</b> un hook qui marche est copié, saturé, puis associé à du contenu poubelle (« I was skeptical at first », « doctors don't want you to know », « one weird trick »). Remèdes : la spécificité (impossible à copier), voler hors de son secteur, le micro-spécifique (« that thing where you throw off the covers, then pull them back, then throw them off again »), les histoires (infinies), être premier plutôt que parfait.</p>\n<blockquote>Test avant publication : touche-t-il le reptilien ? passe-t-il « est-ce pour moi ? » ? utilise-t-il le plus haut niveau possible ? crée-t-il une émotion ? ouvre-t-il une boucle ? effort proche de zéro ? ne ressemble-t-il pas à une pub ?</blockquote>"},{"id":"l22","module":4,"num":"22","dur":"27 min","title":"Les phrases qui arrêtent le scroll (trigger phrases)","body":"<p><b>L'idée :</b> notre cerveau est câblé pour quatre choses : les menaces sociales (trahison, dispute, secret), les menaces de survie (hôpital, arnaque, tout perdre), l'information interdite (« I'm not supposed to share this »), et les histoires inachevées. Plus le ragot (gossip) : le drama des autres est irrésistible.</p>\n<p><b>10 catégories de phrases :</b></p>\n<ol>\n<li><b>Gossip relationnel :</b> « my husband thought I was cheating », « my sister stopped talking to me », « my best friend called me crying ».</li>\n<li><b>Pris / exposé :</b> « I almost got caught », « my doctor noticed », « it showed up on the test ».</li>\n<li><b>Secret / interdit :</b> « I'm not supposed to share this », « my doctor whispered », « I signed an NDA, but… », « they don't want you to know » (usé, attention).</li>\n<li><b>Arnaque / trahison :</b> « I got scammed », « it was all fake », « I ignored the red flags ».</li>\n<li><b>Urgence médicale :</b> « my doctor called me personally », « I was rushed to the hospital », « I was misdiagnosed for years ».</li>\n<li><b>Crise financière :</b> « I lost everything », « I was drowning in debt ».</li>\n<li><b>Confession :</b> « I have to confess », « I've been hiding something », « I was the problem ».</li>\n<li><b>Découverte :</b> « I just found out », « turns out », « that's when it clicked ».</li>\n<li><b>Conflit avec l'autorité :</b> « my doctor was wrong », « I went against my doctor's advice », « they called me crazy ».</li>\n<li><b>Transformation :</b> « that was six months ago », « people don't recognize me ».</li>\n</ol>\n<p><b>Formule :</b> phrase déclencheur + ton sujet + qualification + boucle. « My husband thought I was faking it. After three years of complaining about my knees, he finally saw me try to get off the floor. That look on his face. That's when I knew I had to find something that actually worked. »</p>\n<p><b>Règles :</b> l'histoire doit être vraie ou basée sur de vrais clients ; pas d'appât-et-bascule (« my husband thought I was cheating » doit déboucher sur les symptômes de la ménopause qui expliquent le soupçon) ; viser hook rate ET hold rate ET conversion, pas juste le choc.</p>"},{"id":"l23","module":4,"num":"23","dur":"16 min","title":"Les 3 premières lignes : les verrouiller","body":"<p><b>L'idée :</b> le hook les arrête, les 3 lignes suivantes les gardent. Chaque ligne a un job : <b>ligne 1 arrête</b> (rupture de schéma), <b>ligne 2 ancre</b> (« c'est bien pour toi », qualification), <b>ligne 3 ouvre une boucle</b> (tension qu'on ne résout qu'en lisant).</p>\n<p><b>5 formules :</b></p>\n<ol>\n<li><b>Douleur → validation → sortie :</b> « 3 a.m. Drenched again. / You're not crazy and you're not broken: your hypothalamus is misfiring. / And there's a way to stop it your doctor never mentioned. »</li>\n<li><b>Histoire in medias res → tension → stop avant résolution :</b> « I dropped my keys yesterday. / Looked at them for 10 seconds. / Then kicked them to the couch because I couldn't bend down. That was the moment I knew something had to change. »</li>\n<li><b>Question → renversement → promesse :</b> « When was the last time your daughter smiled in a photo? / The problem isn't her skin. It's what she's been putting on it. / I'll show you the three things that are making it worse. »</li>\n<li><b>Contradiction → preuve → empilement :</b> « Biotin is useless for PCOS hair loss. / So is minoxidil. So is 99% of what your doctor said. / Here's why, and what 47,000 women did instead. »</li>\n<li><b>Transformation → contraste → teaser :</b> « Last night I slept seven hours straight. / Three weeks ago I was waking up four times a night. / One thing changed, and it wasn't hormones. »</li>\n</ol>\n<p><b>Erreurs :</b> commencer par le produit (« our luxury supplement uses… ») ; trop vite (« I'm going to show you the amazing story of… ») ; générique (« knee pain affects millions ») ; fermer la boucle trop tôt ; faux hook (« this will blow your mind »).</p>"},{"id":"l24","module":4,"num":"24","dur":"29 min","title":"Les erreurs de hook qui tuent l'attention","body":"<p><b>L'idée :</b> dix façons de rater le hook, et donc tout le reste.</p>\n<ol>\n<li><b>Clickbait sans payoff :</b> « you won't believe what I found in my garage » puis un complément. Le hook doit être <b>connecté</b> au message (ex. du tir de balle vers la caméra : super hook rate, hold rate nul).</li>\n<li><b>Sur-promettre :</b> « eliminate knee pain forever in 24 hours » déclenche le scepticisme, et derrière, remboursements, chargebacks, abonnements annulés. Si ton modèle a besoin de 3 mois de rétention, tes promesses et tes preuves doivent parler de 3 mois. Préfère « 87 % see significant improvement in 14 days » et surtout plus de preuve, de démo, de communauté.</li>\n<li><b>Ennuyeux / attendu :</b> « are you suffering from knee pain? joint supplement, natural ingredients ». Le cerveau prédit, donc ignore. Inattendu : « I go downstairs sideways now ».</li>\n<li><b>Commencer par le produit</b> quand l'avatar n'est pas niveau 4-5 : « introducing JointFlex Pro with 12 clinical studies » ne veut rien dire pour lui. Commence par eux : « my grandson ran toward me at the park and I flinched ».</li>\n<li><b>Trop vague :</b> « feel better naturally », « change your life today » : ni auto-identification, ni curiosité, ni spécificité. Un hook qui va à tous les produits ne vend aucun produit.</li>\n<li><b>Trop malin :</b> jeux de mots (« knee-d a solution? ») demandent un effort cognitif ; en mode zombie, zéro effort disponible. <b>La clarté bat toujours l'intelligence.</b></li>\n<li><b>Fermer la boucle dans le hook :</b> « glucosamine supplement reduces inflammation » : tout est dit, rien à découvrir. Ouvre : « why glucosamine didn't work for you and what will ».</li>\n<li><b>Mauvais ton pour la plateforme :</b> Facebook = conversationnel, e-mail = personnel, VSL = intime, advertorial = journalistique.</li>\n<li><b>Viser tout le monde :</b> « anyone can benefit from better joint health » = personne ne se sent appelé. Resserre : « for people over 55 who tried glucosamine and it did nothing ».</li>\n<li><b>Fausse urgence :</b> « page taken down in 24 hours », « only 3 left » : tout le monde voit le truc. Urgence réelle énoncée simplement, ou mieux, le <b>coût de l'attente</b> (« every week you wait is another week of bad sleep »).</li>\n</ol>\n<p><b>Important aussi :</b> le créateur doit ressembler à l'avatar (une femme de 50 ans fatiguée dans sa chambre, pas une fille de 20 ans) et le hook doit se comprendre sans le son (visuel + texte + audio).</p>\n<p>Un bon hook rate donne aussi au reste du message la chance d'être testé : hook OK + hold mauvais = problème de boucles ; hold OK + pas d'achats = problème de mécanisme ou de preuve.</p>"},{"id":"l25","module":5,"num":"25","dur":"8 min","title":"Les 3 types d'histoires qui convertissent","body":"<p><b>L'idée :</b> toutes les histoires de vente se ramènent à trois types.</p>\n<ol>\n<li><b>L'histoire d'origine</b> (pourquoi ça existe) : le fondateur/découvreur. Structure : j'avais le même problème → j'ai tout essayé → la découverte → la percée → la mission (souvent contre une industrie). Exemple : « I'm a retired orthopedic surgeon. For 30 years I told patients to take glucosamine. Then my own knees failed… the real solution was buried in a 1987 Japanese study. » Établit la crédibilité, l'ennemi, le guide (pas le héros). Pour VSL, advertorial, lancement. Attention : rester crédible/légal (tu n'es pas chirurgien).</li>\n<li><b>L'histoire client</b> (quelqu'un comme toi) : avant → point de rupture → découverte → scepticisme → essai → résultat → maintenant. « 3 a.m. soaked again, third time tonight. My husband moved to the guest room… Found this in a Facebook group at 3 a.m. Didn't believe it. Ordered anyway. Six weeks later I slept through, husband's back in our bed. I feel human again. » Pour UGC, témoignages, e-mails, preuve sociale.</li>\n<li><b>L'histoire-moment</b> (une scène qui dit tout) : pas le parcours, un instantané sensoriel. Avant : « I kicked my keys toward the couch. Couldn't bend down. My 6-year-old asked why I was playing soccer inside. » Après : « my grandson sprinted at me at the park. I didn't flinch. I squatted, scooped him up, spun him. He laughed. I almost cried. » Pour hooks, UGC 15-30 s, image ads, objets d'e-mail.</li>\n</ol>\n<p><b>Combiner :</b> ouvrir sur un moment → développer en histoire client → introduire l'origine (mécanisme crédible) → fermer sur un moment futur (future pacing).</p>"},{"id":"l26","module":5,"num":"26","dur":"21 min","title":"Structure d'une histoire UGC courte","body":"<p><b>L'idée :</b> en 15 à 60 secondes, pas le temps d'un arc complet, mais ça doit rester une histoire (pas « buy my product »). Quatre temps :</p>\n<ol>\n<li><b>Hook (2-5 s) :</b> un moment précis, rupture de schéma : « my hairdresser asked if I was sick », « 3 a.m., soaked. Third time this week. »</li>\n<li><b>Tension (5-20 s) :</b> le vécu du problème, <b>au passé</b> (« I was averaging four hours of sleep, my husband started sleeping in the guest room, my doctor said that's menopause, accept it »). Au passé parce que le spectateur, qui vit ça au présent, se dit « elle l'avait aussi, qu'est-ce qui a changé ? ». On ne fait pas peur : on crée la <b>relatabilité</b>. Les gens scrollent pour fuir leur vie, pas pour qu'on la leur jette à la figure.</li>\n<li><b>Shift (3-10 s) :</b> ce qui a changé : « my sister sent me this thing. I didn't believe it. I'd tried everything. I was desperate so I tried it anyway. »</li>\n<li><b>Résultat (5-25 s) :</b> le désir exact de l'avatar, ni plus ni moins, en sensoriel : « six weeks in, last night I slept seven hours straight. Woke up dry. Before my alarm. I'd forgotten what rested feels like. My husband's back in our bed. »</li>\n</ol>\n<p><b>Règles :</b> passé, première personne, langage parlé (phrases incomplètes OK), détails spécifiques (3 a.m., pas « middle of the night »), émotion montrée (« I sat in the car and cried ») pas nommée, créateur qui ressemble à l'avatar. Tout vient de la recherche avatar : moments-clés, désir réel, à qui ils font confiance pour le shift (une amie, un groupe, un pro).</p>"},{"id":"l27","module":5,"num":"27","dur":"16 min","title":"Des témoignages qui sonnent vrai","body":"<p><b>L'idée :</b> la plupart des témoignages sonnent faux parce qu'ils sont lisses, positifs, centrés produit (« great product, fast shipping, changed my life, will buy again »). Les meilleurs sonnent comme une conversation <b>surprise entre deux amies au café</b> : décontractés, détails bizarres, vulnérables, honnêtes sur le scepticisme, pas 100 % positifs.</p>\n<p><b>Structure :</b> moment (scène précise du problème) → lutte (ce qui a été essayé, en précis) → découverte (naturelle : « my sister sent a link, I almost didn't click ») → maintenant (réalité concrète, pas « I feel so much better »).</p>\n<p><b>Spécificité = vérité :</b> « $1,847 spent on supplements last year », « 14 years, three months, 11 doctors », « day 11 my husband noticed ». Les micro-moments et les détails gênants (« my husband moved to the guest room ») qu'on n'inventerait pas.</p>\n<p><b>Le principe d'honnêteté :</b> « I didn't believe it », « it took longer than they said », « some days are still hard ». Les réserves augmentent la crédibilité ; la perfection déclenche le doute.</p>\n<p><b>Placement :</b> pas en bas de page mais au milieu, après le mécanisme ou la présentation du produit, sous forme authentique (captures de commentaires Facebook, posts Reddit). Un témoignage peut tout faire : expliquer la cause racine, lever une objection, décrire le mécanisme, du point de vue d'un client.</p>"},{"id":"l28","module":5,"num":"28","dur":"38 min","title":"L'arc complet en 12 temps (VSL, advertorial, long copy)","body":"<p><b>L'idée :</b> pas un film, une vente : 4 actes, 12 temps. Le but : faire sentir que le problème est urgent, que cette solution est différente, et qu'elle marche pour <i>eux</i>.</p>\n<p><b>Acte 1, identification :</b> 1) <b>pattern interrupt</b> (sur un ugly image ad, le hook doit être très intense : « my husband said he's divorcing me, and what happened next decides everything » ; sur un advertorial, la pub a déjà gagné l'attention, un titre suffit : contradiction, résultat précis, autorité, confession, question) ; 2) <b>l'avant</b> : leur réalité quotidienne avec leurs mots (physique, social, mental, identité), au point qu'ils commentent « this is my life » ; 3) <b>le point de rupture</b> : attente + échec + <b>témoin</b> + émotion (une scène, pas une décision : « my daughter said she was embarrassed », la honte pousse à agir) ; il reflète ceux qui y sont et effraie ceux qui n'y sont pas encore (« rendre la souris plus grosse pour vendre le piège »).</p>\n<p><b>Acte 2, éducation :</b> 4) <b>les tentatives ratées</b> : ce qu'ils ont essayé, pourquoi chaque catégorie échoue (traite le mauvais problème), sans devenir clinique ; 5) <b>le mécanisme</b> (le temps le plus important) : simple comme pour un enfant, avec une analogie, un nom unique, trois types (cause cachée, ingrédient manquant, processus cassé) ; puis le levier : études sur l'ingrédient, autorité, et l'astuce « ingrédient déjà cru + twist » (magnésium + L-théanine).</p>\n<p><b>Acte 3, solution :</b> 6) <b>la découverte</b> : naturelle et liée à la solution (on trouve le produit via un groupe, puis on vérifie le mécanisme et les études, pas l'inverse) ; 7) <b>l'empilement de preuves</b> : science, autorité, volume social, histoires, démonstration, timeline personnelle, garantie, dans l'ordre adapté (sceptiques : science d'abord ; émotionnels : histoires ; logiques, souvent les hommes : démo) ; 8) <b>le produit</b> comme conclusion logique, relié au mécanisme ; 9) <b>l'essai</b> : semaine par semaine, début lent (le miracle = détecteur de BS), à la frontière entre « rapide » et « croyable » ; 10) <b>l'après</b> : future pacing, retour au point de rupture inversé, effet d'onde sur ce qui compte pour eux, un aveu (« it took me 20 days, not 14 »), changement d'identité.</p>\n<p><b>Acte 4, close :</b> 11) <b>l'offre</b> : ancrer haut (ce que coûtent les alternatives), révéler le prix, bonus liés au produit, garantie basée sur le cycle réel (« 90 days because hair takes 90 days »), les maths (« $1.65 a day ») ; 12) <b>urgence et choix</b> : rester pareil (aversion à la perte) ou essayer sans risque (future pacing), urgence réelle seulement, CTA formulé en résultat (« grow my hair back »), pas « add to cart ».</p>\n<p><b>Erreurs qui tuent :</b> commencer par le produit, sauter le mécanisme, point de rupture sans scène, « avant » générique, promesses miracles, preuve faible, fausse urgence. Et le savoir-faire caché : garder les passages ennuyeux (ingrédients) vivants par le ton conversationnel et des commentaires.</p>"},{"id":"l29","module":6,"num":"29","dur":"51 min","title":"Zakaria à Evolve Marrakech : tout est copywriting","body":"<p><b>Qui :</b> Zakaria, le formateur du cours, présenté comme passé de 20-30 k$/jour à « des journées à un million » grâce aux advertorials. Sa thèse : <b>tout ce que lit ton client est du copywriting</b> (titres de pubs, scripts UGC, objets d'e-mail, page produit, témoignages). Améliorer le copy partout = même trafic, même budget, plus d'argent.</p>\n<p><b>Cinq techniques avec leurs preuves :</b></p>\n<ol>\n<li><b>La peur bat le désir.</b> Prospect theory (Kahneman & Tversky, 1979) : perdre 100 $ fait deux fois plus mal que gagner 100 $. Les consommateurs sont 2 à 2,5 fois plus sensibles à une hausse qu'à une baisse de prix. Méta-analyse de 127 études : la peur marche surtout <b>quand elle est accompagnée d'une solution</b>. Mauvais : « discover the secret to younger skin ». Bon : « after 25 you lose 1% of collagen a year ; by 40 a third is gone ; every year you wait, another 1% doesn't come back ». <b>Mais</b> : sur un public conscient du problème, commence par la relatabilité, puis ouvre une boucle vers le soulagement, et seulement ensuite la peur ; sinon il fuit.</li>\n<li><b>Le spécifique bat le vague.</b> Les claims précis sont jugés 21 à 53 % plus crédibles ; « 31 days » bat « about a month ». « I lost 31 pounds in 42 days, 40-minute workouts in my living room while my kids watched cartoons. »</li>\n<li><b>Le mécanisme explique pourquoi.</b> « Because » augmente l'obéissance de 34 % même avec une raison creuse (Langer, 1978). Un bon mécanisme fait trois choses : invalide ce qu'ils ont essayé, nomme la vraie cause, positionne le produit comme seule réponse logique. <b>Simple comme pour un enfant de 5 ans</b> : les gens scrollent en « système 1 », pas en mode examen. Astuce : les analogies viennent des forums (Reddit) où des gens expliquent simplement.</li>\n<li><b>Les histoires contournent la garde.</b> Transportation theory : absorbé par un récit, on contre-argumente moins ; les cerveaux se synchronisent (Hasson, 2012) ; l'ocytocine augmente les dons de 56 % (Zak, 2014). Le scroll est une transe d'évasion : une histoire ne casse pas le charme, elle le prolonge (« you don't break the spell », Nikita).</li>\n<li><b>L'expérience empruntée.</b> Faire ressentir le résultat avant l'achat (simulation mentale, Taylor 1998 ; lire « velvet » active le toucher). Le guru qui essaie la Rolex et démarre la Lambo : tu vis la scène, tu veux ce qu'il a. Puis le <b>future pacing</b> pour leur propre futur (« it's 6 a.m., you're awake but not because of an alarm… that's what you get back »).</li>\n</ol>\n<p><b>Qui doit apprendre :</b> stratèges créatifs, landing pages, e-mail/SMS, UGC managers, media buyers, support, fondateurs. Salaires : junior 3-5 k$, moyen 6-10 k$, senior 12-20 k$. Livres : Breakthrough Advertising, Boron Letters (Halbert), Scientific Advertising (Hopkins), Ogilvy, Sugarman, Great Leads, Influence (Cialdini), Thinking Fast and Slow.</p>\n<p><b>Cette semaine :</b> écris ton mécanisme en version la plus simple ; audit de spécificité (chaque claim vague → chiffre, délai, contexte) ; réécris un témoignage en sensoriel ; mets un future pacing avant chaque CTA. Q&A : advertorial pour un public conscient du problème, listicle pour un public conscient du produit ; le texte principal de la pub sert à compléter ce que la créa ne dit pas.</p>"},{"id":"l30","module":6,"num":"30","dur":"1 h 26","title":"Eugene Schwartz : comment écrire des pubs (1990, Rodale)","body":"<p><b>Qui :</b> l'auteur de <i>Breakthrough Advertising</i> (les niveaux de conscience viennent de lui). 27 succès sur 30 packages pour Rodale, 200 M$ de ventes. Sa conférence est le « premier jour » du dossier Training.</p>\n<p><b>1. Le travail avant le talent.</b> Un manuscrit de 1 100 pages : il lit chaque page, souligne chaque claim (une heure par jour, deux semaines), fait taper un « vocabulaire » de 50-60 pages, et seulement ensuite assemble. Il connaît le livre mieux que son auteur (l'histoire des œufs page 164). « The power of the ad is always in the product itself. The copywriter simply finds it and expresses it. »</p>\n<p><b>2. Le minuteur de 33 minutes 33.</b> Même bureau, même rituel (le café, les trois stylos), un timer qui sonne. Pendant 33 min, tu peux ne rien faire, mais tu ne quittes pas le bureau et tu ne fais rien d'autre. L'ennui pousse à travailler. Puis 5 minutes de pause obligatoire : <b>le cerveau connecte quand il joue</b>. Jamais de page blanche en 40 ans.</p>\n<p><b>3. Le copy ne s'écrit pas, il s'assemble.</b> Des blocs (claims, images, désirs) qu'on empile : « a little city of desire ». Les mots sont des vitrines : on doit voir le produit à travers, jamais la vitre. « Sneaky little arthritis tricks » : quatre mots banals, puissants par leur combinaison.</p>\n<p><b>4. Créativité = connectivité.</b> Relier deux idées qui n'allaient pas ensemble. Le cerveau focalisé tient 7 éléments ; l'inconscient en brasse des milliers. D'où les pauses, la douche, les vacances (il écrit ses meilleures pubs dans les marges des livres des autres), et le travail sur trois projets en parallèle (le « triangle créatif » : un projet nourrit l'autre).</p>\n<p><b>5. Le titre n'a qu'un job :</b> faire lire la phrase suivante. Idem pour chaque phrase. L'enveloppe entière est le titre ; on peut y mettre des centaines de mots s'ils sont « tantalizing ». La lettre de 6 pages = des cas clients (« a case history is proof by a surrogate so you don't have to take the risk »).</p>\n<p><b>6. Longueur :</b> aussi longue qu'il faut pour contenir les claims, sans ruiner l'entreprise. Toujours offrir une sortie (« scapegoat ») : celui qui ne lit pas tout doit pouvoir commander dès l'enveloppe. <b>On ne vend jamais, on fait essayer</b> (garantie 21 jours).</p>\n<p><b>7. Le mot le plus puissant :</b> « you ». On écrit à une personne qui partage un problème avec des millions. Il faut la connaître au point qu'elle te prenne pour son reflet : écouter, lire le National Enquirer, regarder les films à 100 M$ (Lethal Weapon : une explosion toutes les 3 minutes = chaque paragraphe doit être un titre). « People live by hidden desires » (tout lecteur d'une lettre d'investissement veut être Gekko). Heaven and hell : sois mélodramatique, honnête et plein de preuves.</p>\n<p><b>8. Claim + mécanisme.</b> Le moteur du mail order : une promesse forte + un moyen étrange (« vacuum dust from drawers without removing their contents » → page 71). Quand les claims s'épuisent (claim exhaustion), le mécanisme doit porter la croyance (Boardroom : « you can't cash an unsigned check »). « Can't be done » : un moyen impossible pour une promesse moyenne, et le lecteur commande pour vérifier.</p>\n<p><b>9. Fatigue et relance :</b> un package fatigue ; on confie le produit à un autre copywriter qui trouve « a whole new set of do's ». On ne vend pas un livre, on vend des bundles de choses qu'il fait faire. Les premiums : il ne vend rien sans ; « you're always playing pool : sinking the ball while getting position on the next shot ».</p>"}],"quiz":[{"id":"q01","lesson":"l01","module":1,"q":"Un prospect a des symptômes mais ne les a jamais reliés à un problème. Quel niveau de conscience ?","choices":["Niveau 1, inconscient","Niveau 2, conscient du problème","Niveau 3, conscient des solutions"],"a":0,"exp":"Il n'a pas encore « étiqueté » ses symptômes : c'est le niveau 1. Le copy doit lui tendre un miroir de ses symptômes, puis nommer le problème."},{"id":"q02","lesson":"l01","module":1,"q":"Pour un public de niveau 3 (il a déjà essayé plusieurs solutions), la bonne approche est :","choices":["Remuer le couteau pour qu'il sente l'urgence","Expliquer pourquoi les autres solutions échouent, puis ton mécanisme","Lui proposer tout de suite -40 %"],"a":1,"exp":"Il souffre déjà et il compare. La peur sans espoir le fait fuir ; le mécanisme différenciant le retient. L'offre pure, c'est pour les niveaux 4-5."},{"id":"q03","lesson":"l01","module":1,"type":"tf","q":"Vrai ou faux : « -40 % jusqu'à minuit » est un bon hook pour du trafic froid.","a":1,"exp":"Faux. Une remise ne veut rien dire pour quelqu'un qui ne connaît ni le produit ni pourquoi il en a besoin. C'est du niveau 5."},{"id":"q04","lesson":"l02","module":1,"q":"À quel stade de sophistication le mécanisme devient-il obligatoire ?","choices":["Stade 1","Stade 3","Stade 5"],"a":1,"exp":"Stade 3, le marché sceptique : « j'ai déjà entendu cette promesse, explique-moi pourquoi ça marcherait »."},{"id":"q05","lesson":"l02","module":1,"q":"Au stade 4 (marché épuisé), quelles sont les deux options ?","choices":["Baisser le prix ou faire plus de pub","Un nouveau mécanisme ou se nicher sur un avatar précis","Promettre plus vite ou plus fort"],"a":1,"exp":"Nouveau mécanisme (« l'acné commence dans l'intestin ») ou niche (« seulement pour les femmes avec SOPK »). Les promesses plus grosses, c'est le stade 2, dépassé."},{"id":"q06","lesson":"l02","module":1,"q":"Au stade 5, qu'est-ce qui marche encore ?","choices":["Des claims plus gros","Un meilleur mécanisme","La personnalité, l'histoire, l'identité, la connexion humaine"],"a":2,"exp":"Le marché ne croit plus aucun claim ni mécanisme (perte de poids). Reste l'humain : « je ne vais rien te promettre, voilà ce qui m'est arrivé »."},{"id":"q07","lesson":"l03","module":1,"q":"La source de trafic (froid, chaud, retargeting) :","choices":["Fixe le niveau de conscience","Décale le niveau à partir de la base du marché","N'a aucun effet"],"a":1,"exp":"Le marché fixe la base (ex. genoux 55+ = niveau 3). Le trafic chaud = base +1, le retargeting = +1 à +2, e-mail = niveau 5."},{"id":"q08","lesson":"l03","module":1,"q":"Le cas « cheveux SOPK » est spécial parce que :","choices":["Le marché est vierge","Il y a deux niveaux de conscience à la fois : niveau 3 sur la perte de cheveux, niveau 1 sur la cause hormonale","Les femmes ne lisent pas les pubs"],"a":1,"exp":"D'où la formule : reconnaître ce qu'elle a essayé, expliquer l'échec, révéler la vraie cause, montrer que ta solution la cible."},{"id":"q09","lesson":"l03","module":1,"q":"Comment diagnostiquer la sophistication d'un marché ?","choices":["Demander à son équipe","Lire les pubs concurrentes qui tournent depuis 3-6 mois, les avis Amazon 3 étoiles, Reddit et les forums","Regarder le prix moyen"],"a":1,"exp":"Une pub qui tourne depuis 6 mois marche : quel stade est son copy ? Les avis 3 étoiles disent ce qu'ils ont essayé et ce dont ils doutent."},{"id":"q10","lesson":"l04","module":1,"q":"Dans la case « faible conscience × forte sophistication », le danger est :","choices":["D'éduquer le prospect, qui va ensuite googler et acheter chez un concurrent avec un mécanisme","D'être trop cher","De ne pas assez remuer le couteau"],"a":0,"exp":"Dès que tu nommes son problème, il entre dans un marché saturé. Il faut nommer, expliquer le mécanisme, prouver et fermer dans la même pièce."},{"id":"q11","lesson":"l04","module":1,"type":"tf","q":"Vrai ou faux : la plupart des marques DTC vivent dans la case « forte conscience × forte sophistication ».","a":0,"exp":"Vrai. C'est l'océan rouge : mécanisme fort, preuves empilées, histoire et offre irrésistible sont obligatoires."},{"id":"q12","lesson":"l05","module":1,"q":"Niveau 3, perte de cheveux. Lequel de ces hooks est correct ?","choices":["« Ta ligne recule chaque jour, ta confiance part avec tes cheveux »","« Voilà ce qui marche vraiment en 2026 pour la perte de cheveux SOPK, et pourquoi la biotine a échoué »","« Perdre ses cheveux à 29 ans, c'est ton futur si tu ne fais rien »"],"a":1,"exp":"Niveau 3 = douleur reconnue brièvement + espoir immédiat. Les deux autres remuent le couteau sur quelqu'un qui souffre déjà : il scrolle pour se protéger."},{"id":"q13","lesson":"l05","module":1,"q":"Même complément genoux, stade 4. Que faut-il ?","choices":["Une promesse plus grosse + garantie","Un mécanisme classique (inflammation)","Un nouveau mécanisme (« ce n'est pas le cartilage, c'est le liquide synovial ») ou un nouvel avatar"],"a":2,"exp":"Stade 4 : tout a été vu. On change de cause racine ou de cible."},{"id":"q14","lesson":"l06","module":2,"q":"Quand l'acheteur n'est pas l'utilisateur, l'émotion dominante est presque toujours :","choices":["Status","Nurturance (protéger un être aimé)","Belonging"],"a":1,"exp":"Parents, maîtres d'animaux, enfants de parents âgés : on fait plus pour ceux qu'on aime que pour soi."},{"id":"q15","lesson":"l06","module":2,"q":"« Every month you wait, more follicles die and never come back. » Quelle émotion ?","choices":["Relief","Security (aversion à la perte)","Identity"],"a":1,"exp":"La peur de perdre quelque chose d'irréversible : sécurité. Souvent placée juste avant le CTA."},{"id":"q16","lesson":"l06","module":2,"q":"Combien d'émotions viser dans une pièce de copy ?","choices":["Les six, pour ne rater personne","Une ou deux à fond (plus une secondaire)","Aucune : la logique suffit"],"a":1,"exp":"Diagnostique les 2-3 dominantes dans le dossier avatar et frappe-les profondément. Six à moitié ne convertit pas."},{"id":"q17","lesson":"l07","module":2,"q":"L'ordre du parcours émotionnel :","choices":["Curiosité → Indifférence → Urgence → Espoir → Conviction","Indifférence → Curiosité → Espoir → Conviction → Urgence","Espoir → Urgence → Conviction → Curiosité → Indifférence"],"a":1,"exp":"On brise l'indifférence (« c'est moi »), on crée la curiosité (info nouvelle), l'espoir (quelqu'un comme moi), la conviction (preuves), puis l'urgence."},{"id":"q18","lesson":"l07","module":2,"q":"Qu'est-ce qui fait passer de la curiosité à l'espoir ?","choices":["Une remise","L'histoire précise de quelqu'un comme lui, avec un résultat concret","Un slogan"],"a":1,"exp":"« Tommy, 65 ans, ex-coureur, a marché 3 miles samedi » : le prospect se dit « ça pourrait marcher pour moi ». Sur-promettre tue cet espoir fragile."},{"id":"q19","lesson":"l08","module":2,"q":"« Stop waking up at 3 a.m. drenched » et « Sleep through the night like you used to » :","choices":["Visent deux émotions différentes","Sont deux portes (douleur / désir) vers la même émotion, le soulagement","Sont interchangeables sans conséquence"],"a":1,"exp":"Douleur = s'éloigner de, désir = aller vers. Même pièce, deux portes. On choisit la porte selon le niveau de conscience."},{"id":"q20","lesson":"l08","module":2,"q":"Règle du cours : la douleur fait… et le désir fait…","choices":["acheter / scroller","arrêter le scroll / cliquer","rire / pleurer"],"a":1,"exp":"Pain gets attention, desire gets action."},{"id":"q21","lesson":"l09","module":2,"q":"Pour un complément articulaire pour chien, à qui écrit-on et que montre-t-on ?","choices":["On écrit au chien","On écrit au maître et on montre la douleur du chien à travers ce qu'il observe","On écrit au vétérinaire"],"a":1,"exp":"Le chien ne lit pas et ne paie pas. Le maître voit (lent à se lever), devine (« il ne peut pas te dire que ça fait mal ») et ressent (culpabilité)."},{"id":"q22","lesson":"l09","module":2,"q":"Erreur fréquente des juniors selon le module 2 :","choices":["Parler uniquement de la douleur de l'utilisateur sans l'émotion de l'acheteur","Mettre trop de preuves","Écrire trop court"],"a":0,"exp":"Résultat : un copy plat, car celui qui paie ne ressent rien. Il faut le carburant émotionnel de l'acheteur (nurturance, culpabilité)."},{"id":"q23","lesson":"l10","module":2,"q":"Un public « chronique » (il s'est habitué à sa douleur) a besoin de :","choices":["Une offre directe","Être réactivé : lui montrer ce qu'il a abandonné","Plus de preuves scientifiques"],"a":1,"exp":"« Tu ne randonnes plus, tu te dis que ça va. Tu t'es juste habitué à moins. » Puis l'espoir."},{"id":"q24","lesson":"l10","module":2,"q":"Un acheteur aspirationnel (pas de douleur) demande typiquement :","choices":["Moins de points de contact","2 à 3 fois plus de points de contact et une urgence créée (pente glissante, point de non-retour, coût caché)","Un copy trè
